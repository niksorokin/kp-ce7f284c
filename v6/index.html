:root {
  --font: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-brand: 'Montserrat', var(--font);
  --font-mono: 'Geist Mono', 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --t-fast: 140ms; --t-menu: 180ms; --t-enter: 380ms;
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;

  /* 4pt spacing, five type sizes + two display sizes */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --fs-cap: 12px; --fs-sm: 13px; --fs-ui: 14px; --fs-body: 15px; --fs-title: 28px; --fs-hero: 32px;

  /* dark — graphite ramp, three text roles */
  --page: #0b0b0c;
  --bg: #151516;
  --side-a: #101011; --side-b: #101011;
  --l1: #1a1a1c;
  --l2: #222224;
  --l3: #2b2b2e;
  --input: #1c1c1e;
  --b1: rgba(237,237,237,.08); --b2: rgba(237,237,237,.11); --b3: rgba(237,237,237,.16); --b4: rgba(237,237,237,.22);
  --hover: rgba(237,237,237,.06); --active: rgba(237,237,237,.1);
  --nav-active: #232325;
  --hi: inset 0 1px 0 rgba(255,255,255,.07);
  --t1: #ededed; --t2: #a3a3a8; --t3: #a3a3a8; --t4: #86868c; --t5: #86868c;
  --accent: rgb(122,170,255); --accent-2: rgb(86,134,254);
  --silver: #b9bcc2; --silver-2: #7d8087;
  --green: #4cc38a; --green-t: #4cc38a;
  --amber: #e9a23b; --amber-soft: rgba(233,162,59,.08); --amber-t: #eaa94a;
  --red: #e5484d; --red-soft: rgba(229,72,77,.12);
  --menu: #1f1f21;
  --shadow-menu: 0 12px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(237,237,237,.08);
  --shadow-1: 0 0 0 1px rgba(237,237,237,.08);
  --shadow-2: 0 8px 24px rgba(0,0,0,.3), 0 0 0 1px rgba(237,237,237,.1);
  color-scheme: dark;
}
body.light {
  --page: #e9e9eb;
  --bg: #ffffff;
  --side-a: #f6f6f7; --side-b: #f6f6f7;
  --l1: #ffffff; --l2: #f4f4f5; --l3: #ebebed;
  --input: #ffffff;
  --b1: rgba(23,23,23,.07); --b2: rgba(23,23,23,.1); --b3: rgba(23,23,23,.14); --b4: rgba(23,23,23,.2);
  --hover: rgba(23,23,23,.045); --active: rgba(23,23,23,.08);
  --nav-active: #ebebed;
  --hi: inset 0 1px 0 rgba(255,255,255,.8);
  --t1: #171717; --t2: #525252; --t3: #525252; --t4: #737373; --t5: #737373;
  --accent: #3064d6; --accent-2: #3064d6;
  --silver: #8a8e96; --silver-2: #b3b6bc;
  --green: #16a34a; --green-t: #15803d;
  --amber: #d48a12; --amber-soft: rgb(254,247,235); --amber-t: #a8650c;
  --red: #dc2626; --red-soft: rgba(220,38,38,.07);
  --menu: #ffffff;
  --shadow-menu: 0 8px 24px rgba(0,0,0,.08), 0 0 0 1px rgba(23,23,23,.08);
  --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 0 0 1px rgba(23,23,23,.08);
  --shadow-2: 0 8px 24px rgba(0,0,0,.06), 0 0 0 1px rgba(23,23,23,.08);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: var(--fs-ui)/1.5 var(--font); color: var(--t1); background: var(--page); -webkit-font-smoothing: antialiased; overflow: hidden; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.t3 { color: var(--t3); } .t4 { color: var(--t4); }
.grow { flex: 1; min-width: 0; }
.link { color: var(--accent); }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ── Stage: scenario bar above the product window ─────────────── */
.stage { height: 100vh; display: flex; flex-direction: column; padding: 8px 16px 16px; gap: 8px; }
.scenebar { display: flex; align-items: center; gap: 12px; min-height: 40px; position: relative; z-index: 50; }
.scenebar .sb-brand { font: 500 13px var(--font-brand); color: var(--t3); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.scenebar .sb-scroll { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 2px; }
.scenebar .sb-scroll::-webkit-scrollbar { display: none; }
.sb-group { display: flex; align-items: center; gap: 4px; flex: none; }
.sb-group > span { font-size: var(--fs-cap); color: var(--t4); margin-right: 4px; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 4px; border-radius: 14px; background: var(--l1); box-shadow: inset 0 0 0 1px var(--b1); color: var(--t2); font-size: var(--fs-cap); white-space: nowrap; transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.pill b { font: 400 11px var(--font-mono); color: var(--t4); min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; display: grid; place-items: center; background: var(--b1); }
.pill:hover { background: var(--l2); color: var(--t1); }
.pill.on { background: var(--t1); color: var(--bg); box-shadow: none; }
.pill.on b { background: rgba(0,0,0,.12); color: var(--bg); }
.sb-tools { display: flex; gap: 4px; }

.window { flex: 1; min-height: 0; display: flex; border-radius: 16px; overflow: hidden; background: var(--bg); box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(237,237,237,.07); position: relative; }
body.light .window { box-shadow: 0 24px 64px rgba(0,0,0,.1), 0 0 0 1px rgba(23,23,23,.08); }

.iconbtn { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--t3); transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); flex: none; }
.iconbtn:hover { background: var(--hover); color: var(--t1); }
.iconbtn.on { color: var(--t1); }

/* ── Sidebar ───────────────────────────────────────────────────── */
.sidebar { width: 264px; flex: none; display: flex; flex-direction: column; background: var(--side-a); border-right: 1px solid var(--b1); padding: 0 12px 8px; min-height: 0; }
.tl { display: flex; align-items: center; height: 44px; padding: 0 4px; gap: 8px; flex: none; }
.tl i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.tl i:nth-child(1) { background: #ff5f57; } .tl i:nth-child(2) { background: #febc2e; } .tl i:nth-child(3) { background: #28c840; }
.brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 16px; flex: none; }
.brand-mark { width: 24px; height: 24px; color: var(--t1); }
.brand-name { font: 500 22px/1 var(--font-brand); letter-spacing: -.02em; }

.side-top { display: flex; gap: 8px; margin-bottom: 8px; flex: none; }
.newchat { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border-radius: 10px; background: var(--l2); box-shadow: inset 0 0 0 1px var(--b2), var(--hi); font-size: var(--fs-ui); color: var(--t1); transition: background-color var(--t-fast) var(--ease); }
body.light .newchat, body.light .side-top .sq { background: #fff; box-shadow: var(--shadow-1); }
.newchat:hover, .side-top .sq:hover { background: var(--l3); }
.newchat:active, .btn:active, .send:active { transform: scale(.97); }
.side-top .sq { width: 36px; height: 36px; border-radius: 10px; background: var(--l2); box-shadow: inset 0 0 0 1px var(--b2), var(--hi); color: var(--t2); }

.side-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -12px; padding: 0 12px 8px; scrollbar-width: thin; scrollbar-color: transparent transparent; }
.side-scroll:hover { scrollbar-color: var(--b3) transparent; }
.nav-item { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--t1); font-size: var(--fs-ui); transition: background-color var(--t-fast) var(--ease); margin-top: 4px; }
.nav-item .i { color: var(--t4); }
.nav-item:hover { background: var(--hover); }
.nav-item.on { background: var(--nav-active); box-shadow: var(--hi); }
.nav-item.on .i { color: var(--t1); }

.sec { margin-top: 16px; }
.sec-h { display: flex; align-items: center; height: 24px; padding: 0 4px 0 8px; color: var(--t4); font-size: var(--fs-cap); font-weight: 400; }
.sec-h .lbl { flex: 1; text-align: left; }
.sec-h .iconbtn { width: 24px; height: 24px; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
.sec-h .iconbtn .i { width: 14px; height: 14px; }
.sec:hover .sec-h .iconbtn, .sec-h .iconbtn:focus-visible { opacity: 1; }
.row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--t2); font-size: var(--fs-ui); transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); position: relative; }
.row + .row { margin-top: 2px; }
.row:hover { background: var(--hover); color: var(--t1); }
.row.on { background: var(--nav-active); color: var(--t1); box-shadow: var(--hi); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font: 400 11px var(--font-mono); color: var(--t4); flex: none; }
.row.more { color: var(--t4); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; animation: breathe 2.4s var(--ease) infinite; }
.unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
@keyframes breathe { 50% { opacity: .4; } }

.side-foot { flex: none; padding-top: 8px; border-top: 1px solid var(--b1); }
.acct { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; border-radius: 10px; text-align: left; transition: background-color var(--t-fast) var(--ease); }
.acct:hover { background: var(--hover); }
.acct .t { flex: 1; min-width: 0; font-size: var(--fs-ui); line-height: 1.25; }
.acct small { display: block; color: var(--t4); font-size: var(--fs-cap); }
.acct .i { color: var(--t4); }

/* ── Main ──────────────────────────────────────────────────────── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mhead { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px 0 24px; flex: none; }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: var(--fs-ui); color: var(--t3); white-space: nowrap; }
.crumb a { color: var(--t3); transition: color var(--t-fast) var(--ease); }
.crumb a:hover { color: var(--t1); }
.crumb .sep { color: var(--t4); }
.crumb b { color: var(--t1); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crumb .note { color: var(--t4); font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 8px; margin-left: 4px; }
.backlink { display: inline-flex; align-items: center; gap: 4px; color: var(--t3); margin-left: -8px; padding: 4px 8px 4px 4px; border-radius: 8px; transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.backlink:hover { color: var(--t1); background: var(--hover); }
.mbody { flex: 1; min-height: 0; display: flex; }
.col-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.content { flex: 1; min-width: 0; overflow-y: auto; position: relative; scrollbar-width: thin; scrollbar-color: var(--b2) transparent; }
.main.enter .content > * { animation: rise var(--t-enter) var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); background: var(--l2); box-shadow: inset 0 0 0 1px var(--b1), var(--hi); font-size: var(--fs-sm); color: var(--t1); white-space: nowrap; transition: background-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.btn:hover { background: var(--l3); }
.btn.primary { background: var(--t1); color: var(--bg); box-shadow: none; }
.btn.primary:hover { background: var(--t2); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--t2); }
.btn.ghost:hover { background: var(--hover); color: var(--t1); }
.btn.sm { height: 28px; padding: 0 12px; font-size: var(--fs-cap); border-radius: 6px; }
.btn.sm .i { width: 14px; height: 14px; }
.txtbtn { color: var(--t3); font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 4px; transition: color var(--t-fast) var(--ease); }
.txtbtn:hover { color: var(--t1); }
.txtbtn .i { width: 14px; height: 14px; }

/* avatars & agent glyphs */
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 500; color: #fff; flex: none; }
.av.sm { width: 20px; height: 20px; font-size: 9px; }
.av.lg { width: 28px; height: 28px; font-size: 11px; }
.av.xl { width: 32px; height: 32px; font-size: 12px; }
.ag { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; background: var(--l3); color: var(--t2); position: relative; }
.ag .i { width: 14px; height: 14px; }
.ag.lg { width: 32px; height: 32px; border-radius: 8px; } .ag.lg .i { width: 16px; height: 16px; }
.ag.xl { width: 44px; height: 44px; border-radius: 12px; } .ag.xl .i { width: 20px; height: 20px; }
.ag.k { background: var(--t1); color: var(--bg); }
.ag .st { position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--bg); }
.ag .st.idle { background: var(--t4); } .ag .st.sched { background: var(--t4); }
.faces { display: inline-flex; align-items: center; }
.faces > .av { box-shadow: 0 0 0 2px var(--bg); }
.faces > .av + .av { margin-left: -4px; }

/* signature: the strand mark — braided when shared, one thread when it is only you */
.strand { display: inline-block; width: 24px; height: 12px; flex: none; vertical-align: -1px; overflow: visible; }
.strand path { fill: none; stroke-linecap: round; }

/* segmented */
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--l1); box-shadow: inset 0 0 0 1px var(--b1); gap: 2px; flex: none; }
.seg button, .seg a { height: 28px; padding: 0 12px; border-radius: 8px; font-size: var(--fs-sm); color: var(--t3); display: inline-flex; align-items: center; gap: 4px; transition: color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.seg button:hover, .seg a:hover { color: var(--t1); }
.seg .on { background: var(--l3); color: var(--t1); box-shadow: var(--hi); }
body.light .seg .on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ttabs { display: flex; gap: 2px; flex-wrap: wrap; }
.ttab { white-space: nowrap; height: 28px; padding: 0 12px; border-radius: 8px; font-size: var(--fs-sm); color: var(--t3); transition: color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.ttab:hover { color: var(--t1); }
.ttab.on { color: var(--t1); background: var(--hover); }

.search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); background: var(--l1); box-shadow: inset 0 0 0 1px var(--b2); color: var(--t4); width: 240px; max-width: 100%; }
.search input { background: none; border: 0; outline: 0; flex: 1; min-width: 0; color: var(--t1); font-size: var(--fs-sm); }
.search input::placeholder { color: var(--t4); }

/* section heading used everywhere */
.h6 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; padding: 0 8px; font-size: var(--fs-cap); font-weight: 400; color: var(--t4); }
.h6 .grow { flex: 1; }
.h6 a, .h6 button { color: var(--t3); transition: color var(--t-fast) var(--ease); }
.h6 a:hover, .h6 button:hover { color: var(--t1); }

/* plain list rows */
.list { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px; border-radius: 10px; position: relative; text-align: left; width: 100%; transition: background-color var(--t-fast) var(--ease); }
.lrow + .lrow::before { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--b1); }
.lrow:hover { background: var(--hover); }
.lrow:hover::before, .lrow:hover + .lrow::before { opacity: 0; }
.lrow .t { flex: 1; min-width: 0; }
.lrow .t b { display: block; font-weight: 500; font-size: var(--fs-ui); color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .t small { display: block; color: var(--t3); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.lrow .t small.wrap { white-space: normal; }
.lrow .r { flex: none; color: var(--t4); font-size: var(--fs-cap); text-align: right; }
.lrow .r.mono, .needs .lrow .r, .room-sec .lrow .r { font-family: var(--font-mono); font-size: 11px; }
.lrow .hov { opacity: 0; transition: opacity var(--t-fast) var(--ease); display: flex; gap: 4px; }
.lrow:hover .hov, .lrow:focus-within .hov { opacity: 1; }

/* ── Composer ──────────────────────────────────────────────────── */
.composer { background: var(--input); box-shadow: inset 0 0 0 1px var(--b2), var(--hi); border-radius: var(--r-xl); padding: 16px 12px 12px 20px; position: relative; }
body.light .composer { box-shadow: var(--shadow-2); }
.composer textarea { width: 100%; resize: none; border: 0; outline: 0; background: none; font-size: var(--fs-body); line-height: 1.5; min-height: 44px; color: var(--t1); display: block; }
.composer textarea::placeholder { color: var(--t4); }
.composer .bar { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
.composer .hint { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font-size: var(--fs-cap); color: var(--t4); white-space: nowrap; }
.composer .hint .kbd { margin-left: 4px; }
.composer .hint .kbd:first-child { margin-left: 0; }
.cbtn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--t3); font-size: var(--fs-sm); white-space: nowrap; min-width: 0; transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.cbtn:hover, .cbtn.on { background: var(--hover); color: var(--t1); }
.cbtn .cv { width: 12px; height: 12px; color: var(--t4); }
.cbtn.round { width: 32px; padding: 0; justify-content: center; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--b2); }
.cbtn .ml { overflow: hidden; text-overflow: ellipsis; }
.send { width: 32px; height: 32px; border-radius: 50%; background: var(--t1); color: var(--bg); display: grid; place-items: center; flex: none; margin-left: 4px; transition: background-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.send:hover { background: var(--t2); }
.send .i { stroke-width: 2; }
.scope-note { font-size: var(--fs-sm); color: var(--t4); padding: 12px 20px 0; line-height: 20px; }
.scope-note .strand { margin-right: 8px; }
.scope-note > span + span, .scope-note > span + button { margin-left: 4px; }
.scope-note b { color: var(--t2); font-weight: 500; }
.where { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 0 0 12px; font-size: var(--fs-sm); color: var(--t4); }
.where .cbtn { color: var(--t1); font-weight: 500; padding: 0 8px; }
.composer-wrap { flex: none; padding: 0 24px 16px; position: relative; }
.composer-wrap .composer, .composer-wrap .scope-note { max-width: 740px; margin: 0 auto; }

/* ── Home & folder room (same grammar) ─────────────────────────── */
.room { width: 100%; max-width: 740px; margin: 0 auto; padding: 0 24px; }
.home { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 48px 0 10vh; }
.hero { display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
.hero h1 { font-size: var(--fs-hero); font-weight: 500; margin: 0; letter-spacing: -.01em; line-height: 1.15; }
.needs { margin-top: 48px; }
.needs .lrow { min-height: 48px; }

.room-head { text-align: center; padding: 64px 0 0; }
.room-head h1 { font-size: var(--fs-hero); font-weight: 500; letter-spacing: -.01em; line-height: 1.15; margin: 0 0 16px; }
.room-head .who { font-size: var(--fs-sm); color: var(--t3); height: 28px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.room-sec { margin-top: 48px; }
.room-sec:last-child { padding-bottom: 64px; }

/* moment: the loom — who's in it, plaited into the composer */
.loom { position: relative; width: min(520px, 100%); margin: 0 auto; }
.loom-ends { position: relative; height: 28px; }
.loom-ends > .end { position: absolute; top: 0; transform: translateX(-50%); line-height: 0; }
.loom-ends > .end.ghost { opacity: .45; }
.loom-ends .av { width: 28px; height: 28px; font-size: 11px; box-shadow: 0 0 0 2px var(--bg); }
.loom-ends .ag { width: 28px; height: 28px; border-radius: 8px; }
.loom-ends .ag .i { width: 14px; height: 14px; }
.loom-ends .who { height: 28px; }
.loom-svg { display: block; width: 100%; height: auto; margin-top: -2px; }
.loom-cap { position: absolute; left: 0; right: 0; bottom: 0; top: 30px; background: var(--bg); transform-origin: bottom; transform: scaleY(0); pointer-events: none; }
.main.enter .loom-cap { animation: unveil 900ms var(--ease) both; }
@keyframes unveil { from { transform: scaleY(1); } to { transform: scaleY(0); } }
.loom + .composer { margin-top: -1px; }
.braid path.halo { stroke: var(--bg); stroke-linecap: butt; }
.braid path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.braid .k { stroke: var(--accent); }
.braid .ag-s { stroke: var(--silver); }
.braid .ghost { stroke: var(--t4); stroke-dasharray: 2 4; }
.braid .halo-fill { fill: var(--bg); }
.braid .kn-s { fill: var(--silver); }
.braid .kn-k { fill: var(--accent); }

.fstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 4px 8px 0; }
.fmini { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fmini b { font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fmini small { color: var(--t4); font: 400 11px var(--font-mono); margin-top: -4px; }
.fmini:hover .thumb { box-shadow: inset 0 0 0 1px var(--b3); }

/* file thumbnails — small previews of the real content */
.thumb { aspect-ratio: 4 / 3; border-radius: 10px; background: var(--l1); box-shadow: inset 0 0 0 1px var(--b1); overflow: hidden; position: relative; display: grid; place-items: center; color: var(--t4); transition: box-shadow var(--t-fast) var(--ease); }
body.light .thumb { background: var(--l2); }
.thumb .i { width: 20px; height: 20px; }
.thumb .doc { position: absolute; inset: 12px 16px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.thumb .doc b { font-size: 11px; font-weight: 500; color: var(--t2); line-height: 1.3; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb .doc i { display: block; height: 3px; border-radius: 2px; background: var(--b2); }
.thumb .doc.code i { display: none; }
.thumb .doc.code span { font: 400 10px/1.5 var(--font-mono); color: var(--t4); white-space: nowrap; overflow: hidden; }
.thumb .sheet { position: absolute; inset: 0; display: grid; grid-template-columns: 28% repeat(3, 1fr); grid-auto-rows: 16px; }
.thumb .sheet span { border-right: 1px solid var(--b1); border-bottom: 1px solid var(--b1); font: 400 9px/16px var(--font-mono); color: var(--t4); text-align: right; padding: 0 4px; overflow: hidden; }
.thumb .sheet span.h { background: var(--b1); color: var(--t3); }
.thumb .slide { width: 64%; aspect-ratio: 16 / 9; border-radius: 4px; background: var(--l3); box-shadow: inset 0 0 0 1px var(--b2); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; gap: 4px; }
.thumb .slide b { font-size: 11px; font-weight: 500; color: var(--t1); line-height: 1.1; }
.thumb .slide i { display: block; height: 3px; width: 50%; border-radius: 2px; background: var(--b3); }
.thumb .site { position: absolute; inset: 0; display: flex; flex-direction: column; }
.thumb .site .bar { height: 16px; border-bottom: 1px solid var(--b1); display: flex; align-items: center; gap: 4px; padding: 0 8px; }
.thumb .site .bar i { width: 4px; height: 4px; border-radius: 50%; background: var(--b3); }
.thumb .site .body { padding: 12px 12px; text-align: left; }
.thumb .site .body b { display: block; font-size: 11px; font-weight: 500; color: var(--t1); line-height: 1.25; margin-bottom: 8px; }
.thumb .site .body i { display: block; height: 3px; width: 60%; border-radius: 2px; background: var(--b2); margin-bottom: 4px; }
.thumb .site .body u { display: inline-block; width: 36px; height: 10px; border-radius: 3px; background: var(--t2); margin-top: 4px; }
.thumb.photo { background: #1d2230; }
.thumb.photo .scene { position: absolute; inset: 0; }
.thumb .wave { display: flex; align-items: center; gap: 2px; height: 40%; }
.thumb .wave i { display: block; width: 3px; border-radius: 2px; background: var(--t4); }
.thumb .frame { position: absolute; inset: 0; background: #0e0e10; display: grid; place-items: center; color: #d6d6d9; }
.thumb .frame em { position: absolute; right: 8px; bottom: 8px; font: 400 10px var(--font-mono); font-style: normal; color: #d6d6d9; background: rgba(0,0,0,.5); padding: 0 4px; border-radius: 3px; }

/* ── Chat ──────────────────────────────────────────────────────── */
.chat { max-width: 740px; margin: 0 auto; padding: 16px 24px 24px; }
.day { text-align: center; font-size: var(--fs-cap); color: var(--t4); margin: 8px 0 24px; }
.msg { margin-bottom: 32px; position: relative; }
.msg-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: var(--fs-sm); }
.msg-h .who { font-weight: 500; color: var(--t1); }
.msg-h .when { color: var(--t4); font: 400 11px var(--font-mono); }
.msg-in { padding-left: 30px; }
.msg-body { font-size: var(--fs-body); line-height: 1.65; color: var(--t1); }
.msg-body p { margin: 0 0 12px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body ul { margin: 0 0 12px; padding-left: 20px; }
.msg-body li { margin-bottom: 4px; }
.msg-body li::marker { color: var(--t4); }
.msg-body strong { font-weight: 500; }
.mention { color: var(--accent); font-weight: 500; white-space: nowrap; }
.bubble-me { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 32px; }
.bubble-me .bubble { max-width: 75%; background: var(--l2); padding: 12px 16px; border-radius: var(--r-xl); font-size: var(--fs-body); line-height: 1.6; }
.bubble-me .meta { font: 400 11px var(--font-mono); color: var(--t4); margin-top: 8px; padding-right: 8px; }
.turn { display: flex; align-items: center; gap: 8px; width: 100%; color: var(--t3); font-size: var(--fs-ui); padding: 0 0 8px; transition: color var(--t-fast) var(--ease); }
.turn:hover { color: var(--t1); }
.turn .i { width: 14px; height: 14px; transition: transform 200ms var(--ease); }
.turn.open .i { transform: rotate(180deg); }
.turn .r { margin-left: auto; color: var(--t4); font: 400 11px var(--font-mono); }

/* moment: the run — kumiya's thread splits into subagents and plaits back */
.runline { display: block; width: 100%; margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--b1); text-align: left; }
.runline svg { display: block; width: 100%; height: auto; }
.runline-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; font: 400 11px/16px var(--font-mono); color: var(--t4); }
.runline-legend span { display: inline-flex; align-items: center; gap: 8px; }
.runline-legend i { width: 12px; height: 2px; border-radius: 1px; background: var(--silver); display: inline-block; }
.runline-legend i.k { background: var(--accent); }
.runline-legend b { color: var(--t2); font-weight: 400; font-family: var(--font); font-size: var(--fs-cap); }

.steps { margin: 0 0 16px; padding-left: 16px; border-left: 1px solid var(--b2); animation: reveal 220ms var(--ease); }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
.steps .s-h { font-size: var(--fs-cap); color: var(--t4); margin: 0 0 4px; }
.step { display: flex; align-items: center; gap: 12px; min-height: 32px; font-size: var(--fs-ui); color: var(--t2); }
.step .nm { color: var(--t1); min-width: 92px; }
.step .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t3); }
.step .dur { color: var(--t4); font: 400 11px var(--font-mono); }
.step .i { width: 14px; height: 14px; }
.ok { color: var(--green); } .warn { color: var(--amber); } .err { color: var(--red); } .idle { color: var(--t4); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--b3); border-top-color: var(--t1); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.live { display: flex; align-items: center; gap: 12px; font-size: var(--fs-ui); color: var(--t2); padding: 0 0 12px; margin-bottom: 16px; border-bottom: 1px solid var(--b1); width: 100%; }
.live .r { white-space: nowrap; margin-left: auto; color: var(--t4); font: 400 11px var(--font-mono); }
.files-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.fchip { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 12px; border-radius: var(--r-md); background: var(--l1); box-shadow: inset 0 0 0 1px var(--b1); text-align: left; min-width: 0; transition: background-color var(--t-fast) var(--ease); }
.fchip:hover { background: var(--l2); }
.fchip > .i { color: var(--t3); }
.fchip b { display: block; font-weight: 500; font-size: var(--fs-sm); }
.fchip small { color: var(--t4); font-size: var(--fs-cap); }
.msg-actions { display: flex; align-items: center; gap: 2px; margin: 8px 0 0 -8px; color: var(--t4); opacity: 0; transition: opacity var(--t-fast) var(--ease); }
.msg:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
.msg-actions .use { font-size: var(--fs-cap); margin-left: 8px; color: var(--t4); }
.approval { margin: 16px 0 0; padding: 16px; border-radius: var(--r-md); background: var(--amber-soft); box-shadow: inset 0 0 0 1px rgba(233,162,59,.3); }
.approval .ah { display: flex; gap: 12px; align-items: flex-start; }
.approval .ah > .i { color: var(--amber); margin-top: 2px; }
.approval .ah b { font-weight: 500; display: block; margin-bottom: 2px; font-size: var(--fs-ui); }
.approval .ah p { margin: 0; color: var(--t3); font-size: var(--fs-sm); }
.approval .acts { display: flex; gap: 8px; margin-top: 12px; padding-left: 28px; align-items: center; flex-wrap: wrap; }
.approval .acts small { color: var(--t4); margin-left: auto; font-size: var(--fs-cap); }
.typing { display: flex; align-items: center; gap: 8px; color: var(--t4); font-size: var(--fs-sm); }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--t4); display: inline-block; animation: blink 1.2s infinite; margin-right: 2px; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* ── Right panel: one sheet ────────────────────────────────────── */
.rpanel { width: 312px; flex: none; margin: 0 12px 12px 0; background: var(--l1); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--b2) transparent; animation: slidein 260ms var(--ease); align-self: stretch; }
body.light .rpanel { background: var(--side-a); box-shadow: inset 0 0 0 1px var(--b1); }
@keyframes slidein { from { opacity: 0; transform: translateX(8px); } }
.psec { padding: 16px; }
.psec + .psec { border-top: 1px solid var(--b1); }
.psec-h { display: flex; align-items: center; gap: 8px; height: 24px; margin-bottom: 4px; font-size: var(--fs-cap); font-weight: 400; color: var(--t4); }
.psec-h .grow { flex: 1; }
.psec-h .iconbtn { width: 24px; height: 24px; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
.psec-h .iconbtn .i { width: 14px; height: 14px; }
.psec:hover .psec-h .iconbtn { opacity: 1; }
.psec-h.tog { width: 100%; text-align: left; cursor: pointer; transition: color var(--t-fast) var(--ease); }
.psec-h.tog:hover { color: var(--t2); }
.psec-h.tog .i { width: 14px; height: 14px; margin-left: auto; transition: transform 200ms var(--ease); }
.psec-h.tog.open .i { transform: rotate(180deg); }
.pi { display: flex; align-items: center; gap: 12px; min-height: 32px; font-size: var(--fs-ui); color: var(--t1); width: calc(100% + 16px); margin: 0 -8px; padding: 0 8px; text-align: left; border-radius: 8px; transition: background-color var(--t-fast) var(--ease); }
a.pi:hover, button.pi:hover { background: var(--hover); }
.pi .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi .r { color: var(--t4); font-size: var(--fs-cap); flex: none; display: flex; align-items: center; gap: 8px; }
.pi .r .i { width: 14px; height: 14px; }
.pi > .i { color: var(--t4); }
.pi.sub { padding-left: 40px; color: var(--t3); min-height: 28px; font-size: var(--fs-sm); position: relative; }
.pi.sub::before { content: ''; position: absolute; left: 18px; top: 0; bottom: 0; width: 1px; background: var(--b2); }
.pi.sub:last-of-type::before { bottom: 50%; }
.pmore { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: var(--fs-sm); color: var(--t3); transition: color var(--t-fast) var(--ease); }
.pmore:hover { color: var(--t1); }
.pmore .i { width: 14px; height: 14px; }
.ptext { font-size: var(--fs-sm); color: var(--t2); line-height: 1.6; margin: 4px 0; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; padding: 4px 0; font-size: var(--fs-sm); margin: 0; }
.kv dt { color: var(--t4); }
.kv dd { margin: 0; color: var(--t1); min-width: 0; }
.kv dd a { color: var(--t1); text-decoration: underline; text-decoration-color: var(--b3); text-underline-offset: 3px; }
.done-list { margin: 4px 0; }
.done { display: flex; gap: 12px; font-size: var(--fs-ui); padding: 4px 0; line-height: 1.4; }
.done .d { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--t4); }
.done .d.ok { background: var(--green); } .done .d.warn { background: var(--amber); } .done .d.run { background: var(--t2); }
.done small { display: block; color: var(--t4); font-size: var(--fs-cap); }
.meter { height: 4px; border-radius: 2px; background: var(--b2); overflow: hidden; margin: 8px 0 2px; }
.meter i { display: block; height: 100%; background: var(--t3); border-radius: 2px; }

/* ── Pages ─────────────────────────────────────────────────────── */
.page { max-width: 960px; margin: 0 auto; padding: 32px 40px 64px; }
.page.wide { max-width: 1240px; }
.ptitle { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
.ptitle > div:first-child { flex: 1; min-width: 240px; }
.ptitle h1 { font-size: var(--fs-title); font-weight: 500; margin: 0; letter-spacing: -.01em; line-height: 1.15; }
.ptitle p { margin: 8px 0 0; color: var(--t3); font-size: var(--fs-ui); max-width: 560px; }
.ptitle .acts { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.group { margin-bottom: 40px; }

/* library launcher */
.lib { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 32px; }
.lib-item { display: flex; gap: 12px; padding: 16px 8px; border-radius: 12px; align-items: flex-start; position: relative; transition: background-color var(--t-fast) var(--ease); }
.lib-item + .lib-item::before { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--b1); }
.lib-item:hover { background: var(--hover); }
.lib-item > .i { width: 18px; height: 18px; color: var(--t3); margin-top: 2px; }
.lib-item b { display: block; font-weight: 500; font-size: var(--fs-body); }
.lib-item small { display: block; color: var(--t3); font-size: var(--fs-sm); margin-top: 2px; }
.lib-item .att { color: var(--t1); }
.lib-item .att::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }

/* moment: the helpers' day — one thread per bot or scheduled task, a knot per run */
.day-chart { margin: 0 0 48px; padding: 20px 24px 16px; border-radius: var(--r-lg); background: var(--l1); box-shadow: var(--shadow-1); }
body.light .day-chart { background: var(--side-a); box-shadow: inset 0 0 0 1px var(--b1); }
.dc-head { display: flex; align-items: baseline; gap: 4px 12px; margin-bottom: 16px; flex-wrap: wrap; }
.dc-head b { font-weight: 500; font-size: var(--fs-body); }
.dc-head small { color: var(--t3); font-size: var(--fs-sm); }
.dc-head .grow { flex: 1; }
.dc-head a { font-size: var(--fs-sm); color: var(--t3); transition: color var(--t-fast) var(--ease); }
.dc-head a:hover { color: var(--t1); }
.dc-grid { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
.dc-lbl { height: 32px; display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--t1); min-width: 0; }
.dc-lbl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-lbl small { color: var(--t4); font-size: var(--fs-cap); }
.dc-track { position: relative; height: 32px; }
.dc-track svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
.dc-track path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.dc-track .rail { stroke: var(--b2); stroke-width: 1; }
.dc-track .future { stroke-dasharray: 2 4; opacity: .6; }
.dc-knot { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; box-shadow: 0 0 0 2px var(--l1); }
body.light .dc-knot { box-shadow: 0 0 0 2px var(--side-a); }
.dc-knot.next { background: var(--l1) !important; box-shadow: inset 0 0 0 1.5px var(--t4), 0 0 0 2px var(--l1); }
.dc-knot.flag { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: var(--amber) !important; }
.dc-flag { position: absolute; top: 50%; transform: translate(12px, -50%); font: 400 11px/16px var(--font-mono); color: var(--amber-t); white-space: nowrap; background: var(--l1); padding: 0 4px; border-radius: 4px; }
body.light .dc-flag { background: var(--side-a); }
.dc-axis { position: relative; height: 20px; margin-top: 4px; }
.dc-axis span { position: absolute; transform: translateX(-50%); font: 400 11px var(--font-mono); color: var(--t4); }
.dc-lbls { padding-top: 20px; }
.dc-now { position: absolute; top: 16px; bottom: 24px; width: 1px; background: var(--accent); pointer-events: none; }
.dc-now span { position: absolute; top: -20px; left: 0; transform: translateX(-50%); font: 400 11px var(--font-mono); color: var(--accent); background: var(--l1); padding: 0 4px; }
body.light .dc-now span { background: var(--side-a); }
.dc-plot { position: relative; padding-top: 20px; }

/* files grid */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 28px 20px; }
.ftile { display: flex; flex-direction: column; gap: 12px; text-align: left; min-width: 0; }
.ftile:hover .thumb { box-shadow: inset 0 0 0 1px var(--b3); }
.ftile .meta { padding: 0 2px; min-width: 0; }
.ftile .meta b { display: block; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ftile .meta small { display: block; color: var(--t4); font-size: var(--fs-cap); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

/* memory */
.mem { padding: 12px 8px; position: relative; display: flex; gap: 12px; align-items: flex-start; border-radius: 10px; transition: background-color var(--t-fast) var(--ease); }
.mem + .mem::before { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--b1); }
.mem:hover { background: var(--hover); }
.mem p { margin: 0 0 4px; font-size: var(--fs-ui); line-height: 1.55; }
.mem small { color: var(--t4); font-size: var(--fs-cap); }
.mem .acts { display: flex; gap: 4px; flex: none; }
.mem .hov { opacity: 0; transition: opacity var(--t-fast) var(--ease); }
.mem:hover .hov { opacity: 1; }

/* detail pages (agent, bot) */
.dhead { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
.dhead h1 { font-size: var(--fs-title); font-weight: 500; letter-spacing: -.01em; line-height: 1.15; margin: 0; display: flex; align-items: center; gap: 12px; }
.dhead p { margin: 4px 0 0; color: var(--t3); }
.dhead .acts { margin-left: auto; display: flex; gap: 8px; }
.prose { font-size: var(--fs-ui); line-height: 1.65; color: var(--t2); padding: 0 8px; margin: 0; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding: 0 8px; }
.cols3 h5 { margin: 0 0 8px; font-size: var(--fs-cap); font-weight: 400; color: var(--t4); }
.cols3 ul { margin: 0; padding: 0; list-style: none; font-size: var(--fs-ui); }
.cols3 li { padding: 4px 0; color: var(--t2); }
.cols3 li small { color: var(--t4); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--t3); font-weight: 400; letter-spacing: 0; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--t4); }
.status.running { color: var(--green-t); } .status.running::before { background: var(--green); }
.status.warn { color: var(--amber-t); } .status.warn::before { background: var(--amber); }

/* connectors */
.conn-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
.conn-list .lrow:nth-child(2)::before { display: none; }
.logo { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-weight: 500; font-size: var(--fs-sm); color: var(--t2); background: var(--l2); box-shadow: inset 0 0 0 1px var(--b1); flex: none; }

/* settings */
.set-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; }
.vnav { display: flex; flex-direction: column; gap: 2px; }
.vnav a { display: flex; align-items: center; height: 32px; padding: 0 8px; border-radius: 8px; font-size: var(--fs-ui); color: var(--t3); transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.vnav a:hover { color: var(--t1); background: var(--hover); }
.vnav a.on { background: var(--nav-active); color: var(--t1); box-shadow: var(--hi); }
.vnav h5 { margin: 24px 8px 8px; font-size: var(--fs-cap); color: var(--t4); font-weight: 400; }
.vnav h5:first-child { margin-top: 0; }
.toggle { width: 32px; height: 20px; border-radius: 10px; background: var(--l3); position: relative; flex: none; transition: background-color var(--t-fast) var(--ease); box-shadow: inset 0 0 0 1px var(--b2); cursor: pointer; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--t3); transition: transform var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.toggle.on { background: var(--t1); box-shadow: none; }
.toggle.on::after { transform: translateX(12px); background: var(--bg); }

/* apps: board */
.app-head { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.app-head h1 { font-size: var(--fs-title); font-weight: 500; letter-spacing: -.01em; line-height: 1.15; margin: 0; }
.app-head p { margin: 8px 0 0; color: var(--t3); font-size: var(--fs-ui); }
.app-head .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.app-head .kmark { width: 14px; height: 14px; }

/* moment: the sprint cord — one strand per task, twisted in by state */
.cord { margin: 0 0 32px; }
.cord-rope { display: flex; gap: 2px; height: 14px; }
.cord-rope i { flex: 1; border-radius: 7px; position: relative; background-color: var(--c); background-image: repeating-linear-gradient(118deg, rgba(255,255,255,.22) 0 2px, transparent 2px 6px), linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.28)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); transition: background-color 300ms var(--ease); }
.cord-rope i.over::after { content: ''; position: absolute; left: 50%; top: -8px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--red); }
.cord-rope i.s-done { --c: var(--accent); }
.cord-rope i.s-review { --c: var(--silver); }
.cord-rope i.s-progress { --c: var(--silver-2); }
.cord-rope i.s-backlog { --c: var(--l3); background-image: repeating-linear-gradient(118deg, var(--b2) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px var(--b2); }
.cord-key { display: flex; gap: 8px 24px; flex-wrap: wrap; margin-top: 12px; font-size: var(--fs-cap); color: var(--t3); }
.cord-key span { display: inline-flex; align-items: center; gap: 8px; }
.cord-key b { font: 400 12px var(--font-mono); color: var(--t1); }
.cord-key i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.cord-key .k-over i { background: var(--red); width: 4px; height: 4px; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.bcol { border-radius: var(--r-lg); padding: 4px 4px 8px; min-height: 140px; transition: background-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }

  function modelMenu(c) {
    const row = (n, s, ck, dis) => `<button class="mi2 ${dis ? 'dis' : ''}" data-act="toast" data-msg="${dis ? 'Personal subscriptions stay out of team chats' : n + ' selected'}"><span class="t">${n}<small>${s}</small></span>${ck ? ic('check', 'ck') : ''}</button>`;
    return `<div class="menu-scrim" data-nav="#/chat/${c.id}"></div><div class="menu" style="right:max(24px, calc(50% - 370px));bottom:calc(100% + 6px);width:330px;max-width:calc(100% - 20px);max-height:60vh;overflow:auto">
      ${row('Auto', 'Workspace rules pick the cheapest model that fits', false)}
      <div class="sep"></div><h6>Claude Team · workspace</h6>${row('Claude Opus 4.5', '62% of the 5-hour window used', c.team)}${row('Claude Sonnet 4.5', 'Faster, same subscription', false)}
      <h6>ChatGPT Business · workspace</h6>${row('GPT-5.1', 'Weekly cap 38% used', false)}
      <h6>Google AI Pro · shared by Anna</h6>${row('Gemini 3 Pro', 'Team may use up to 50% · 41% used', false)}
      <h6>DeepSeek API · team pool</h6>${row('DeepSeek V4', 'Pay as you go · $36 of $200', false)}

      <div class="sep"></div><a class="mi2" href="#/settings/models">${ic('gear')}<span class="t">Subscriptions & routing</span></a></div>`;
  }

  function chatView(r) {
    const c = CH[r.id];
    if (!c) return genericChat(r);
    const f = folderOf(c.folder);
    const sub = r.sub;
    const inSub = sub === 'activity' || sub === 'files';
    const open = sub === 'steps';
    const crumb = inSub
      ? `<a href="#/chat/${c.id}" class="hide-sm">${esc(c.title)}</a><span class="sep hide-sm">/</span><b>${sub === 'activity' ? 'What was done' : 'Files'}</b>`
      : `<a href="#/folder/${f.id}" class="hide-sm">${f.n}</a><span class="sep hide-sm">/</span><b>${esc(c.title)}</b>${c.team ? `<span class="note hide-sm">${strandMark(c.people.filter(k => k !== 'me'))}${whoLine(c.people.filter(k => k !== 'me'))} and you</span>` : `<span class="note">${strandMark(['me'])}Only you</span>`}`;
    const panelOn = sub === 'details' || (narrow() ? S.panelSm : S.panel);
    const right = `${inSub ? `<a class="btn sm ghost" href="#/chat/${c.id}">${back}Chat</a>` : ''}<a class="btn sm ghost" href="#/chat/${c.id}/share">${ic('share')}<span class="hide-sm">Share</span></a><button class="iconbtn" data-act="toast" data-msg="Rename · Move to folder · Pin · Export · Delete" aria-label="More">${ic('more')}</button><button class="iconbtn ${panelOn ? 'on' : ''}" data-act="panel" title="Details" aria-label="Details">${ic('panelr')}</button>`;
    const body = sub === 'activity' ? activity(c) : sub === 'files' ? chatFiles(c) : (c.team ? teamMessages(open) : persMessages(open));
    const pop = sub === 'mention' ? mentionMenu(c.id) : sub === 'model' ? modelMenu(c) : sub === 'plus' ? plusMenu(c.id) : '';
    return `${mhead(crumb, right)}<div class="mbody"><div class="col-main"><div class="content" data-scroll="${inSub ? '' : open ? 'steps' : 'bottom'}">${body}</div>
      ${inSub ? '' : `<div class="composer-wrap">${composer({ ph: c.team ? 'Message the team' : 'Message kumiya', model: c.model, value: sub === 'mention' ? '@' : '', team: c.team })}${pop}</div>`}
      </div>${panelOn ? chatPanel(c, r) : ''}</div>`;
  }
  function genericChat(r) {
    const c = chatOf(r.id) || { n: 'Chat', who: ['me'], solo: true };
    const f = c.f ? folderOf(c.f) : null;
    return `${mhead(`${f ? `<a href="#/folder/${f.id}" class="hide-sm">${f.n}</a><span class="sep hide-sm">/</span>` : ''}<b>${esc(c.n)}</b>${c.solo ? '<span class="note">Only you</span>' : ''}`, `<a class="btn sm ghost" href="#/chat/pricing/share">${ic('share')}<span class="hide-sm">Share</span></a>`)}
      <div class="mbody"><div class="col-main"><div class="content"><div class="empty"><b>${esc(c.n)}</b>${c.solo ? 'Only you' : whoLine(c.who)} · ${esc(c.ag || 'kumiya')}<br><br>Sample chat. The fully drawn ones are <a class="link" href="#/chat/atlas">Atlas v2 launch plan</a> and <a class="link" href="#/chat/pricing">Pricing page rewrite</a>.</div></div>
      <div class="composer-wrap">${composer({ ph: 'Message', model: 'Auto' })}</div></div></div>`;
  }

  /* ── dialogs ─────────────────────────────────────────────────── */
  const opt = (act, cur, k, t, s) => `<button class="opt ${cur === k ? 'on' : ''}" data-act="${act}" data-v="${k}"><span class="radio"></span><span class="t"><b>${t}</b><small>${s}</small></span></button>`;
  const prow = (k, role, sub) => `<div class="prow">${av(k, 'lg')}<span class="t">${P[k].n}${k === 'me' ? ' (you)' : ''}<small>${sub || P[k].n.split(' ')[0].toLowerCase() + '@northwind.example'}</small></span><button class="sel">${role}${ic('chevd')}</button></div>`;
  const perm = (t, s, on) => `<div class="perm"><span class="grow">${t}${s ? `<small>${s}</small>` : ''}</span><span class="toggle ${on ? 'on' : ''}" role="switch" aria-checked="${on}"></span></div>`;
  function shareChatDialog(r) {
    const team = r.id === 'atlas';
    const back_ = `#/chat/${r.id}`;
    const people = team ? [['anna', 'Owner'], ['mark', 'Can chat'], ['sofia', 'Can chat'], ['me', 'Can chat']] : [['me', 'Owner'], ['lena', 'Can view']];
    return `<div class="scrim" data-nav="${back_}"><div class="dialog" data-stop role="dialog" aria-label="Share">
      <h3>Share “${team ? 'Atlas v2 launch plan' : 'Pricing page rewrite'}”<span class="grow"></span><a class="iconbtn" href="${back_}" aria-label="Close">${ic('x')}</a></h3>
      <p class="sub-t">${team ? 'Team chat in Atlas launch. Everyone in the folder already has access.' : 'Personal chat. Only the people you pick will see it — your personal memory stays private.'}</p>
      <div class="invite"><label class="search">${ic('search')}<input placeholder="Add people or emails"></label><button class="btn">${team ? 'Can chat' : 'Can view'}${ic('chevd')}</button><button class="btn primary">Invite</button></div>
      ${people.map(([k, role]) => prow(k, role)).join('')}
      <div class="h6">General access</div>
      ${opt('share-access', S.shareAccess, 'invited', 'Only people invited', 'Nobody else can find or open it')}
      ${opt('share-access', S.shareAccess, 'workspace', 'Everyone in Northwind Labs', 'Shows in team search; members can join')}
      ${opt('share-access', S.shareAccess, 'link', 'Anyone with the link', 'View only · agents and bots stay off for viewers')}
      <button class="disclose ${S.shareMore ? 'open' : ''}" data-act="share-more">More options${ic('chevd')}</button>
      ${S.shareMore ? `${perm('Guests can call agents and bots', `Runs bill to ${team ? 'Claude Team' : 'your subscription'}`, true)}${perm('Use my personal memory here', 'Off by default once a chat is shared', false)}${team ? '' : `<div class="perm"><span class="grow">Move to a team folder<small>It becomes a team chat with the folder’s access</small></span><button class="btn sm">Choose${ic('chevd')}</button></div>`}` : ''}
      <div class="dfoot"><button class="btn ghost" data-act="toast" data-msg="Link copied">${ic('link')}Copy link</button><span class="grow"></span><a class="btn primary" href="${back_}">Done</a></div>
    </div></div>`;
  }
  function shareFolderDialog(f) {
    const back_ = `#/folder/${f.id}/about`;
    const sub = { Owner: 'Full control and sharing', Editor: 'Chats, files, instructions', 'Can chat': 'Chats and files', Viewer: 'Read only', 'Can view': 'Read only' };
    return `<div class="scrim" data-nav="${back_}"><div class="dialog" data-stop role="dialog" aria-label="Folder access">
      <h3>Who’s in ${f.n}<span class="grow"></span><a class="iconbtn" href="${back_}" aria-label="Close">${ic('x')}</a></h3>
      <p class="sub-t">Chats, files and instructions inside follow this. Anyone can still keep a private chat here.</p>
      ${opt('folder-access', S.folderAccess, 'workspace', 'Everyone in Northwind Labs', 'All 9 members')}
      ${opt('folder-access', S.folderAccess, 'people', 'Specific people', `${f.members.length} people · others can ask to join`)}
      ${opt('folder-access', S.folderAccess, 'private', 'Only me', 'Moves it to your personal folders')}
      <div class="invite" style="margin-top:14px"><label class="search">${ic('search')}<input placeholder="Add people or a group"></label><button class="btn primary">Add</button></div>
      ${Object.entries(f.roles).map(([k, role]) => prow(k, role, sub[role])).join('')}
      <button class="disclose ${S.folderMore ? 'open' : ''}" data-act="folder-more">More options${ic('chevd')}</button>
      ${S.folderMore ? `${perm('New chats here start as team chats', '', true)}${perm('kumiya may suggest team memories from here', 'Always through the review queue', true)}${perm('Share with the Atlas Studio workspace', 'Client guests see only chats you mark for them', false)}` : ''}
      <div class="dfoot"><button class="btn ghost" data-act="toast" data-msg="Link copied">${ic('link')}Copy link</button><span class="grow"></span><a class="btn primary" href="${back_}">Save</a></div>
    </div></div>`;
  }
  function newFolderDialog() {
    const w = S.newFolderWho;
    return `<div class="scrim" data-nav="#/home"><div class="dialog" data-stop role="dialog" aria-label="New folder">
      <h3>New folder<span class="grow"></span><a class="iconbtn" href="#/home" aria-label="Close">${ic('x')}</a></h3>
      <p class="sub-t">A folder is a room: chats, files and instructions for one piece of work.</p>
      <input class="field-in" value="Q1 planning" aria-label="Folder name">
      <div class="h6">Who’s in it?</div>
      ${opt('nf-who', w, 'solo', 'Just me', 'Private. You can invite people later.')}
      ${opt('nf-who', w, 'people', 'Specific people', 'They see every chat started here, unless you make one private.')}
      ${opt('nf-who', w, 'all', 'Everyone in Northwind', 'All 9 members can find and join it.')}
      ${w === 'people' ? `<div class="invite" style="margin:10px 0 0 40px"><label class="search">${ic('search')}<input placeholder="Add people" value=""></label>${faces(['anna', 'dev'], 3, 'lg')}</div>` : ''}
      <div class="dfoot"><span class="grow"></span><a class="btn ghost" href="#/home">Cancel</a><button class="btn primary" data-act="toast" data-msg="Prototype: “Q1 planning” would open as an empty room">Create folder</button></div>
    </div></div>`;
  }
  function wsMenu() {
    return `<div class="menu-scrim" data-act="close-menu"></div><div class="menu" style="left:12px;bottom:62px;width:292px">
      <h6>Workspaces</h6>
      ${workspaces.map(w => `<button class="mi2" data-act="toast" data-msg="Switch to ${w.n}"><span class="ag" style="background:${w.c};color:#fff;font-size:10.5px;font-weight:600;width:24px;height:24px">${w.l}</span><span class="t">${w.n}<small>${w.sub}</small></span>${w.on ? ic('check', 'ck') : ''}</button>`).join('')}
      <button class="mi2" data-act="toast" data-msg="Create a workspace for a team, a client or a side project">${ic('plus')}<span class="t">Create workspace</span></button>
      <div class="sep"></div>
      <a class="mi2" href="#/settings/members">${ic('users')}<span class="t">Members & roles</span></a>
      <a class="mi2" href="#/settings/models">${ic('cpu')}<span class="t">Subscriptions & models</span></a>
      <a class="mi2" href="#/settings/members">${ic('gear')}<span class="t">Workspace settings</span></a>
      <div class="sep"></div>
      <button class="mi2" data-act="toast" data-msg="Profile, personal memory, notifications">${ic('user')}<span class="t">Your profile</span></button>
    </div>`;
  }

  /* ── folder = a room ─────────────────────────────────────────── */
  function folderView(r) {
    if (r.id === 'new') return home({ id: '' }) + newFolderDialog();
    const f = folderOf(r.id) || folders[0];
    const team = f.scope === 'team';
    const about = r.sub === 'about' || r.sub === 'share';
    const list = chats.filter(c => c.f === f.id);
    const fl = files.filter(x => x.f === f.id);
    const who = team ? '' : `Only you${f.sharedWith ? ' · Lena can view' : ''}`;
    const priv = team && S.roomPrivate;
    const note = !team ? 'Only you will see this chat.' : priv
      ? `${strandMark(['me'])}<span>Only you will see this chat, it stays in ${f.n}</span><span>·</span><button class="link" data-act="room-private">Share with the folder</button>`
      : `${strandMark(f.members.filter(k => k !== 'me'))}<span><b>${others(f.members)}</b> will see this chat</span><span>·</span><button class="link" data-act="room-private">Make it private</button>`;
    const note0 = !team ? `${strandMark(['me'])}<span>Only you will see this chat</span>` : note;
    const row = c => `<a class="lrow" href="#/chat/${c.id}"><span class="t"><b>${esc(c.n)}</b><small>${c.solo ? 'Only you' : whoLine(c.who)} · ${esc(c.ag)}</small></span><span class="r" style="display:flex;align-items:center;gap:8px">${c.run ? '<span class="live-dot" style="position:static"></span>' : ''}${c.t}</span></a>`;
    const thumbOf = x => `<button class="fmini" data-act="toast" data-msg="Opens a preview of ${esc(x.n)}">${thumb(x.cat, x)}<b>${esc(x.n)}</b><small>${x.age}</small></button>`;
    const right = `<button class="btn sm ghost hide-sm" data-act="toast" data-msg="Pin · Rename · Archive">${ic('more')}</button><a class="iconbtn ${about ? 'on' : ''}" href="#/folder/${f.id}${about ? '' : '/about'}" title="Folder details" aria-label="Folder details">${ic('panelr')}</a>`;
    const body = `<div class="room">
      <div class="room-head"><h1>${f.n}</h1>${team ? loom(priv ? ['me'] : f.members, priv ? [] : f.defaults.agents.split(', ')) : loom(['me'], [], { ghosts: f.sharedWith || [], who })}</div>
      ${composer({ ph: `Message ${f.n}`, model: team ? 'Auto' : 'GPT-5.1 · ChatGPT Plus', team })}
      <div class="scope-note">${note0}</div>
      <div class="room-sec"><div class="h6">Conversations</div><div class="list">${list.map(row).join('')}</div></div>
      <div class="room-sec"><div class="h6">Files<span class="grow"></span><a href="#/files">All ${fl.length}</a></div><div class="fstrip">${fl.slice(0, 4).map(thumbOf).join('')}</div></div>
    </div>`;
    const panel = about ? `<aside class="rpanel show" aria-label="Folder details">
      <section class="psec"><div class="psec-h">${team ? 'People' : 'Sharing'}<span class="grow"></span><a class="iconbtn" href="#/folder/${f.id}/share" title="Invite">${ic('plus')}</a></div>
        ${Object.entries(f.roles).map(([k, role]) => `<div class="pi">${av(k, 'sm')}<span class="t">${name(k)}</span><span class="r">${role}</span></div>`).join('')}
        <a class="pmore" href="#/folder/${f.id}/share">Manage access ${ic('chevr')}</a></section>
      <section class="psec"><div class="psec-h">Instructions<span class="grow"></span><button class="iconbtn" data-act="toast" data-msg="Edit instructions — every chat here follows them" title="Edit">${ic('edit')}</button></div><p class="ptext">${f.about}</p></section>
      <section class="psec"><div class="psec-h">Defaults for new chats</div><dl class="kv"><dt>Agents</dt><dd>${f.defaults.agents}</dd><dt>Connectors</dt><dd>${f.defaults.connectors}</dd><dt>Memory</dt><dd>${f.defaults.memory}</dd><dt>Model</dt><dd>${f.defaults.model}</dd></dl></section>
      <section class="psec"><div class="psec-h">In this folder</div><dl class="kv"><dt>Chats</dt><dd>${list.length}${team ? ` · ${list.filter(c => c.solo).length} private` : ''}</dd><dt>Files</dt><dd>${fl.length}</dd><dt>Created</dt><dd>${team ? 'Oct 12 by Anna Kim' : 'Sep 3 by you'}</dd></dl></section>
    </aside>` : '';
    return `${mhead('', right)}<div class="mbody"><div class="col-main"><div class="content">${body}</div></div>${panel}</div>${r.sub === 'share' ? shareFolderDialog(f) : ''}`;
  }

  /* ── pages ───────────────────────────────────────────────────── */
  const backTo = (href, t) => `<a class="backlink" href="${href}">${back}${t}</a>`;
  const libCrumb = () => backTo('#/library', 'Library');
  const page = (crumb, body, wide) => `${mhead(crumb)}<div class="mbody"><div class="content"><div class="page ${wide ? 'wide' : ''}">${body}</div></div></div>`;
  const ptitle = (t, p, acts = '') => `<div class="ptitle"><div><h1>${t}</h1>${p ? `<p>${p}</p>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
  const seg = (key, val, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${val === v ? 'on' : ''}" data-act="set" data-k="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const group = (h, body, right = '') => `<div class="group"><div class="h6">${h}${right ? `<span class="grow"></span>${right}` : ''}</div>${body}</div>`;

  function library() {
    const it = (icn, href, t, s) => `<a class="lib-item" href="${href}">${ic(icn)}<span><b>${t}</b><small>${s}</small></span></a>`;
    const col = (h, items) => `<div><div class="h6">${h}</div><div class="list">${items}</div></div>`;
    return page('', `${ptitle('Library', 'Everything the team has built up. Open it when you need it.')}
      ${dayChart()}
      <div class="lib">
        ${col('Knowledge', it('archive', '#/files', 'Files', '16 files · 2 new today') + it('brain', '#/memory', 'Memory', '<span class="att">3 to review</span>'))}
        ${col('Helpers', it('branch', '#/agents', 'Agents & skills', '5 agents · 8 skills') + it('bot', '#/bots', 'Bots', '2 running') + it('clock', '#/scheduled', 'Scheduled', 'Next: churn check in 34 min'))}
        ${col('Workspace', it('grid', '#/apps', 'Apps', '3 in the sidebar') + it('plug', '#/connectors', 'Connectors', '10 for the team · 2 yours') + it('gear', '#/settings/members', 'Settings', 'Members, subscriptions, limits'))}
      </div>`);
  }

  function filesView() {
    const CATS = [['all', 'All types'], ['doc', 'Docs'], ['sheet', 'Sheets'], ['slides', 'Slides'], ['site', 'Sites'], ['image', 'Images'], ['video', 'Video'], ['audio', 'Audio'], ['code', 'Code']];
    const list = S.fileScope === 'all' ? files : files.filter(f => f.scope === S.fileScope);
    const shown = S.fileCat === 'all' ? list : list.filter(f => f.cat === S.fileCat);
    const loc = f => f.scope === 'solo' ? (f.share.length ? 'Lena can view' : 'Only you') : (f.f ? folderOf(f.f).n : f.where);
    return page(libCrumb('Files'), `${ptitle('Files', 'Everything people, agents and bots made or added. Apps live in the sidebar.', `<label class="search">${ic('search')}<input placeholder="Search files"></label><button class="btn">${ic('up')}Upload</button>`)}
      <div class="toolbar">${seg('fileScope', S.fileScope, [['team', 'Team'], ['solo', 'Personal'], ['all', 'All']])}<div class="ttabs">${CATS.map(([k, l]) => `<button class="ttab ${S.fileCat === k ? 'on' : ''}" data-act="set" data-k="fileCat" data-v="${k}">${l}</button>`).join('')}</div></div>
      ${shown.length ? `<div class="fgrid">${shown.map(f => `<button class="ftile" data-act="toast" data-msg="Opens a preview of ${esc(f.n)}">${thumb(f.cat, f)}<div class="meta"><b>${esc(f.n)}</b><small>${esc(loc(f))} · ${f.age}</small></div></button>`).join('')}</div>`
        : `<div class="empty"><b>Nothing here yet</b>Files from your chats will appear here.</div>`}`, true);
  }

  function memoryView() {
    const team = S.memScope === 'team';
    const list = team ? memory.team : memory.solo;
    const cats = [...new Set(list.map(m => m.cat))];
    const item = m => `<div class="mem"><div class="grow"><p>${esc(m.t)}</p><small>${name(m.by)} · used ${m.used} · from ${esc(m.src)}</small></div><div class="acts hov"><button class="iconbtn" data-act="toast" data-msg="Edit · Move to ${team ? 'personal' : 'team'} · Forget" aria-label="More">${ic('more')}</button></div></div>`;
    const rev = m => `<div class="mem"><div class="grow"><p>${esc(m.t)}</p><small>Suggested by ${m.by} · from ${esc(m.from)} in ${esc(m.src)}</small></div><div class="acts"><span class="hov" style="display:flex;gap:4px"><button class="btn sm ghost" data-act="toast" data-msg="Edit before keeping">Edit</button><button class="iconbtn" data-act="toast" data-msg="Discarded" aria-label="Discard">${ic('x')}</button></span><button class="btn sm" data-act="toast" data-msg="Kept in team memory">Keep</button></div></div>`;
    return page(libCrumb('Memory'), `${ptitle('Memory', team ? 'What kumiya, agents and bots know about Northwind. Nothing is kept without a person approving it.' : 'Only you and your personal chats use this. Team chats never see it unless you allow it per chat.', `${seg('memScope', S.memScope, [['team', 'Team'], ['solo', 'Personal']])}<button class="btn">${ic('plus')}Add</button>`)}
      ${team ? group(`To review · ${memory.review.length}`, `<div class="list">${memory.review.map(rev).join('')}</div>`, `<button data-act="toast" data-msg="All three kept">Keep all</button>`) : ''}
      ${cats.map(c => group(c, `<div class="list">${list.filter(m => m.cat === c).map(item).join('')}</div>`)).join('')}`);
  }

  function agentsView(r) {
    if (r.id) return agentDetail(r.id);
    const row = a => `<a class="lrow" href="#/agents/${a.id}">${agi(a.ic, 'lg')}<span class="t"><b>${a.n}</b><small>${a.d}</small></span><span class="r">${a.model.split(' · ')[0]}<br>${name(a.owner)} · ${a.chats} chats</span></a>`;
    const tabs = cur => `<div class="seg"><a class="${cur === 'a' ? 'on' : ''}" href="#/agents">Agents</a><a class="${cur === 's' ? 'on' : ''}" href="#/skills">Skills</a></div>`;
    return page(libCrumb('Agents & skills'), `${ptitle('Agents & skills', 'Agents are workers you @ into any chat. Skills are know-how any agent or bot can use — type / in a chat.', `${tabs('a')}<button class="btn">${ic('plus')}New agent</button>`)}

  /* ── board drag & drop ───────────────────────────────────────── */
  function bindBoard() {
    let drag = null;
    document.querySelectorAll('.kcard').forEach(el => {
      el.addEventListener('dragstart', e => { drag = { col: el.dataset.col, i: +el.dataset.i }; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'card'); });
      el.addEventListener('dragend', () => el.classList.remove('drag'));
    });
    document.querySelectorAll('[data-drop]').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over'); if (!drag) return;
        const B = JSON.parse(JSON.stringify(S.board || BOARD0));
        const [card] = B[drag.col].splice(drag.i, 1);
        const to = col.dataset.drop;
        const after = [...col.querySelectorAll('.kcard')].filter(k => { const rc = k.getBoundingClientRect(); return e.clientY > rc.top + rc.height / 2; }).length;
        let idx = after; if (to === drag.col && drag.i < after) idx = after - 1;
        B[to].splice(Math.max(0, idx), 0, card);
        S.board = B; persist(); drag = null; render(); toast(`Moved to ${to}`);
      });
    });
  }

  /* ── events ──────────────────────────────────────────────────── */
  let toastT;
  function toast(msg) { clearTimeout(toastT); let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; toastT = setTimeout(() => t.remove(), 2200); }
  const go = h => { if (location.hash === h) render(); else location.hash = h; };

  document.addEventListener('click', e => {
    const stop = e.target.closest('[data-stop]');
    const navEl = e.target.closest('[data-nav]');
    if (navEl && !(stop && navEl.classList.contains('scrim'))) { if (navEl.classList.contains('scrim') && e.target !== navEl) return; e.preventDefault(); go(navEl.dataset.nav); return; }
    if (S.sideOpen && !e.target.closest('.sidebar') && !e.target.closest('[data-act="side-open"]')) { S.sideOpen = false; render(); return; }
    const tg = e.target.closest('.toggle'); if (tg) { tg.classList.toggle('on'); tg.setAttribute('aria-checked', tg.classList.contains('on')); return; }
    const a = e.target.closest('[data-act]');
    if (e.target.closest('a[href^="#"]') && (!a || a.dataset.act === 'nf-preset')) { if (a) { S.newFolderWho = a.dataset.v; persist(); } menu = null; S.sideOpen = false; return; }
    if (!a) return;
    const act = a.dataset.act, v = a.dataset.v;
    switch (act) {
      case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; break;
      case 'panel': if (narrow()) S.panelSm = !S.panelSm; else S.panel = !S.panel; break;
      case 'set': S[a.dataset.k] = v; break;
      case 'where-pick': { const team = PLACES[v].team; if (team) S.whereTeam = v; else S.whereSolo = v; persist(); go(team ? '#/home' : '#/home/personal'); return; }
      case 'nf-who': S.newFolderWho = v; break;
      case 'room-private': S.roomPrivate = !S.roomPrivate; break;
      case 'all-recent': S.allRecent = !S.allRecent; break;
      case 'sources': S.sources = !S.sources; break;
      case 'share-access': S.shareAccess = v; break;
      case 'share-more': S.shareMore = !S.shareMore; break;
      case 'folder-access': S.folderAccess = v; break;
      case 'folder-more': S.folderMore = !S.folderMore; break;
      case 'ws-menu': menu = menu === 'ws' ? null : 'ws'; if (route().id === 'ws') { location.hash = '#/home'; return; } break;
      case 'close-menu': menu = null; if (route().id === 'ws') { location.hash = '#/home'; return; } break;
      case 'side-open': S.sideOpen = true; break;
      case 'side-close': if (innerWidth <= 860) { S.sideOpen = false; break; } toast('The sidebar folds away in the real app'); return;
      case 'board-reset': S.board = null; toast('Board reset'); break;
      case 'plus-open': { const r = route(); if (r.v === 'chat' && CH[r.id]) go(r.sub === 'plus' ? `#/chat/${r.id}` : `#/chat/${r.id}/plus`); else toast('Attach files · Add from Files · @ people and agents · / skills · Permissions'); return; }
      case 'model-open': { const r = route(); if (r.v === 'chat' && CH[r.id]) go(r.sub === 'model' ? `#/chat/${r.id}` : `#/chat/${r.id}/model`); else toast('Auto picks the model by workspace rules — and shows who pays'); return; }
      case 'send': toast('Prototype: nothing is sent — sample conversation only'); return;
      case 'prev': case 'next': { const i = FLAT.indexOf(route().hash); const n = act === 'next' ? (i + 1) % FLAT.length : (i - 1 + FLAT.length) % FLAT.length; go(FLAT[i < 0 ? 0 : n]); return; }
      case 'toast': toast(a.dataset.msg || 'Prototype'); return;
      default: return;
    }
    e.preventDefault(); persist(); render();
  });
  document.addEventListener('input', e => {
    if (e.target.matches('[data-composer]') && e.target.value.endsWith('@')) { const r = route(); if (r.v === 'chat' && CH[r.id] && r.sub !== 'mention') go(`#/chat/${r.id}/mention`); }
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); go('#/search'); return; }
    const r = route();
    if (e.key === 'Escape') {
      menu = null; S.sideOpen = false;
      if (r.v === 'chat' && ['share', 'mention', 'model', 'plus'].includes(r.sub)) go(`#/chat/${r.id}`);
      else if (r.v === 'folder' && r.sub === 'share') go(`#/folder/${r.id}/about`);
      else if (r.v === 'search' || (r.v === 'folder' && r.id === 'new') || (r.v === 'home' && (r.id === 'ws' || r.id === 'where'))) go('#/home');
      else if (r.v === 'home' && r.sub === 'where') go('#/home/personal');
      else render();
      return;
    }
    if (e.target.matches('input, textarea')) return;
    if (e.key === ']' || e.key === '[') { document.querySelector(`[data-act="${e.key === ']' ? 'next' : 'prev'}"]`).click(); }
    if (/^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey) go(FLAT[+e.key - 1]);
  });
  window.addEventListener('hashchange', () => { menu = null; S.sideOpen = false; render(); });
  render();
})();
</script>
</body>
</html>
