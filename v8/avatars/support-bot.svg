<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Support bot — Mo">
  <style>
    .sm{display:none}
    @media (max-width:32px){.d{display:none}.sm{display:inline}.lg{display:none}}
    @media (max-width:56px){.xl{display:none}}
  </style>
  <defs>
    <clipPath id="c"><circle cx="48" cy="48" r="48"/></clipPath>
    <radialGradient id="bg" cx="30%" cy="22%" r="90%">
      <stop offset="0" stop-color="#F0FDFF"/><stop offset="1" stop-color="#B6E9F4"/>
    </radialGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#67E8F9"/><stop offset=".5" stop-color="#16B3C9"/><stop offset="1" stop-color="#0B7490"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mic" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ECFEFF"/><stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>
  <radialGradient id="iris" cx="45%" cy="38%" r="62%">
      <stop offset="0" stop-color="#1F7F99"/><stop offset=".6" stop-color="#0E2F45"/><stop offset="1" stop-color="#081722"/>
    </radialGradient>
    <radialGradient id="rim" cx="45%" cy="35%" r="62%">
      <stop offset=".72" stop-color="#053B4C" stop-opacity="0"/><stop offset="1" stop-color="#053B4C" stop-opacity=".35"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="96" height="96" fill="url(#bg)"/>
    <ellipse cx="48" cy="93" rx="30" ry="6" fill="#0B4F63" opacity=".15"/>
    <!-- round ears -->
    <circle cx="25" cy="35" r="8" fill="#16B3C9"/><circle cx="25" cy="35" r="4" fill="#0B7490" opacity=".55"/>
    <circle cx="71" cy="35" r="8" fill="#16B3C9"/><circle cx="71" cy="35" r="4" fill="#0B7490" opacity=".55"/>
    <!-- body -->
    <circle cx="48" cy="60" r="33" fill="url(#body)"/>
    <circle cx="48" cy="60" r="33" fill="url(#rim)"/>
    <ellipse cx="34" cy="42" rx="14" ry="9" fill="url(#shine)"/>
    <!-- muzzle -->
    <ellipse cx="48" cy="69" rx="19" ry="14" fill="#F2FEFF"/>
    <!-- calm eyes with soft lids -->
    <g class="lg">
      <ellipse cx="37" cy="55" rx="4.6" ry="5.4" fill="url(#iris)"/>
      <ellipse cx="59" cy="55" rx="4.6" ry="5.4" fill="url(#iris)"/>
      <circle cx="38.4" cy="53.4" r="1.5" fill="#fff"/><circle cx="60.4" cy="53.4" r="1.5" fill="#fff"/>
    </g>
    <g class="sm" fill="#10263A"><circle cx="37" cy="55" r="5.4"/><circle cx="59" cy="55" r="5.4"/></g>
    <!-- nose + gentle w-smile -->
    <path d="M44.5 63 Q48 60.5 51.5 63 Q48 67.5 44.5 63 Z" fill="#10263A"/>
    <path class="d" d="M42 70 Q45 73 48 70 Q51 73 54 70" fill="none" stroke="#10263A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse class="d" cx="28.5" cy="66" rx="4.4" ry="2.6" fill="#FF6F9F" opacity=".5"/>
    <ellipse class="d" cx="67.5" cy="66" rx="4.4" ry="2.6" fill="#FF6F9F" opacity=".5"/>
    <!-- headset -->
    <path d="M15.5 58 A32.5 32.5 0 0 1 80.5 58" fill="none" stroke="#1D2B45" stroke-width="4.2" stroke-linecap="round"/>
    <rect x="9.5" y="50" width="12" height="19" rx="5.5" fill="#1D2B45"/>
    <rect x="74.5" y="50" width="12" height="19" rx="5.5" fill="#1D2B45"/>
    <rect class="d" x="12" y="53" width="3" height="10" rx="1.5" fill="#fff" opacity=".35"/>
    <path class="d" d="M16 68 Q19 80 33.5 79" fill="none" stroke="#1D2B45" stroke-width="2.6" stroke-linecap="round"/>
    <circle class="d" cx="35.5" cy="78.6" r="3.6" fill="url(#mic)"/>
  </g>
  <circle cx="48" cy="48" r="47.4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>
</svg>
