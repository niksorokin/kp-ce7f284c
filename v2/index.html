:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-brand: 'Montserrat', var(--font);
  --font-mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-panel: 28px;

  /* v2 scale — 4pt spacing, six type sizes */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --fs-cap: 12px; --fs-sm: 13px; --fs-ui: 14px; --fs-body: 15px; --fs-title: 22px; --fs-hero: 28px;

  /* dark (DSH data-ds-dark-theme) */
  --page: #0c0c0d;
  --bg: rgb(21,21,23);              /* bluish-950 */
  --side-a: rgb(42,42,45); --side-b: rgb(49,49,52);
  --l1: rgb(35,35,36);              /* layer-1 bluish-875 */
  --l2: rgb(44,44,46);              /* layer-2 bluish-850 */
  --l3: rgb(53,54,56);              /* layer-3 bluish-800 */
  --input: rgb(44,44,46);
  --code: rgb(27,27,28);
  --b1: rgba(255,255,255,.06); --b2: rgba(255,255,255,.12); --b3: rgba(255,255,255,.16); --b4: rgba(255,255,255,.2);
  --hover: rgba(255,255,255,.08); --active: rgba(255,255,255,.14);
  --nav-active: rgb(67,69,74);
  --t1: rgb(249,250,251); --t2: rgb(207,211,214); --t3: rgb(173,178,184); --t4: rgb(129,133,140); --t5: rgb(97,102,107);
  --accent: rgb(122,170,255); --accent-2: rgb(86,134,254); --accent-soft: rgb(52,65,91); --accent-ink: rgb(183,200,254);
  --send: rgb(72,104,178);
  --green: rgb(34,197,94); --green-soft: rgb(35,60,44); --green-t: rgb(78,209,126);
  --amber: rgb(245,158,11); --amber-soft: rgb(39,36,31); --amber-t: rgb(247,173,49);
  --red: rgb(242,90,90); --red-soft: rgba(242,90,90,.12);
  --violet: rgb(167,139,250); --violet-soft: rgba(167,139,250,.14);
  --menu: rgba(48,49,54,.96);
  --shadow-menu: 0 12px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  --shadow-1: 0 1px 2px rgba(0,0,0,.25), 0 0 0 1px rgba(255,255,255,.06);
  --shadow-2: 0 8px 28px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.06);
  color-scheme: dark;
}
body.light {
  --page: #e6e8ec;
  --bg: #fff;
  --side-a: rgb(249,250,251); --side-b: rgb(245,247,250);
  --l1: #fff; --l2: rgb(245,247,250); --l3: rgb(235,238,242);
  --input: #fff; --code: rgb(249,250,251);
  --b1: rgba(0,0,0,.04); --b2: rgba(0,0,0,.1); --b3: rgba(0,0,0,.12); --b4: rgba(0,0,0,.16);
  --hover: rgba(38,49,72,.06); --active: rgba(38,49,72,.1);
  --nav-active: rgb(235,238,242);
  --t1: rgb(15,17,21); --t2: rgb(97,102,107); --t3: rgb(129,133,140); --t4: rgb(151,157,166); --t5: rgb(173,178,184);
  --accent: rgb(65,118,230); --accent-2: rgb(65,118,230); --accent-soft: rgb(228,237,253); --accent-ink: rgb(47,76,143);
  --send: rgb(65,118,230);
  --green-soft: rgb(230,250,237); --green-t: rgb(1,140,60);
  --amber-soft: rgb(254,245,231); --amber-t: rgb(190,110,20);
  --red: rgb(220,40,40); --red-soft: rgba(236,19,19,.07);
  --violet: rgb(124,58,237); --violet-soft: rgba(124,58,237,.08);
  --menu: rgba(252,253,254,.98);
  --shadow-menu: 0 12px 40px rgba(15,17,21,.14), 0 0 0 1px rgba(0,0,0,.08);
  --shadow-1: 0 1px 2px rgba(15,17,21,.06), 0 0 0 1px rgba(0,0,0,.07);
  --shadow-2: 0 8px 28px rgba(15,17,21,.08), 0 0 0 1px rgba(0,0,0,.07);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: var(--fs-ui)/1.5 var(--font); color: var(--t1); background: var(--page); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.t3 { color: var(--t3); } .t4 { color: var(--t4); }
.grow { flex: 1; min-width: 0; }
.link { color: var(--accent); }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ── Stage: scenario bar above the product window ─────────────── */
.stage { height: 100vh; display: flex; flex-direction: column; padding: 10px 18px 18px; gap: 10px; }
.scenebar { display: flex; align-items: center; gap: 14px; min-height: 40px; position: relative; z-index: 50; }
.scenebar .sb-brand { font: 500 13px var(--font-brand); color: var(--t3); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.scenebar .sb-scroll { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 2px; }
.scenebar .sb-scroll::-webkit-scrollbar { display: none; }
.sb-group { display: flex; align-items: center; gap: 4px; flex: none; }
.sb-group > span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--t4); margin-right: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; border-radius: 999px; background: var(--l1); border: 1px solid var(--b1); color: var(--t2); font-size: 12.5px; white-space: nowrap; transition: background .15s var(--ease); }
.pill b { font: 500 10.5px var(--font-mono); color: var(--t4); min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; background: var(--b1); }
.pill:hover { background: var(--l2); color: var(--t1); }
.pill.on { background: var(--t1); color: var(--bg); border-color: transparent; }
.pill.on b { background: rgba(0,0,0,.12); color: var(--bg); }
.sb-tools { display: flex; gap: 6px; }

.window { flex: 1; min-height: 0; display: flex; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07); position: relative; }
body.light .window { box-shadow: 0 30px 80px rgba(15,17,21,.18), 0 0 0 1px rgba(0,0,0,.08); }

.iconbtn { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--t3); transition: background .15s var(--ease), color .15s; flex: none; }
.iconbtn:hover { background: var(--hover); color: var(--t1); }
.iconbtn.on { color: var(--t1); }

/* ── Sidebar ───────────────────────────────────────────────────── */
.sidebar { width: 264px; flex: none; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--side-a), var(--side-b)); border-right: 1px solid var(--b1); padding: 0 10px 8px; min-height: 0; }
.tl { display: flex; align-items: center; height: 44px; padding: 0 4px; gap: 8px; flex: none; }
.tl i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.tl i:nth-child(1) { background: #ff5f57; } .tl i:nth-child(2) { background: #febc2e; } .tl i:nth-child(3) { background: #28c840; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 16px; flex: none; }
.brand-mark { width: 24px; height: 24px; color: var(--t1); }
.brand-name { font: 500 22px/1 var(--font-brand); letter-spacing: -.02em; }

.side-top { display: flex; gap: 6px; margin-bottom: 6px; flex: none; }
.newchat { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: var(--r-md); background: var(--l3); box-shadow: inset 0 0 0 1px var(--b2); font-size: var(--fs-ui); color: var(--t1); transition: background .15s var(--ease); }
body.light .newchat, body.light .side-top .sq { background: #fff; }
.newchat:hover, .side-top .sq:hover { background: var(--nav-active); }
.side-top .sq { width: 38px; height: 38px; border-radius: var(--r-md); background: var(--l3); box-shadow: inset 0 0 0 1px var(--b2); color: var(--t2); }

.side-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -10px; padding: 0 10px 8px; scrollbar-width: thin; scrollbar-color: transparent transparent; }
.side-scroll:hover { scrollbar-color: var(--b3) transparent; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 10px; color: var(--t1); font-size: var(--fs-ui); transition: background .12s var(--ease); margin-top: 4px; }
.nav-item .i { color: var(--t3); width: 17px; height: 17px; }
.nav-item:hover { background: var(--hover); }
.nav-item.on { background: var(--nav-active); }
.nav-item.on .i { color: var(--t1); }

.sec { margin-top: 14px; }
.sec-h { display: flex; align-items: center; height: 26px; padding: 0 4px 0 10px; color: var(--t4); font-size: var(--fs-cap); font-weight: 500; }
.sec-h .lbl { flex: 1; text-align: left; }
.sec-h .iconbtn { width: 22px; height: 22px; opacity: 0; transition: opacity .15s; }
.sec-h .iconbtn .i { width: 14px; height: 14px; }
.sec:hover .sec-h .iconbtn, .sec-h .iconbtn:focus-visible { opacity: 1; }
.row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 10px; color: var(--t2); font-size: 13.5px; transition: background .12s var(--ease); position: relative; }
.row:hover { background: var(--hover); color: var(--t1); }
.row.on { background: var(--nav-active); color: var(--t1); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font-size: 11.5px; color: var(--t5); flex: none; }
.row:hover .time { color: var(--t4); }
.row.more { color: var(--t4); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; animation: breathe 2.4s var(--ease) infinite; }
.unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.row .live-dot, .row .unread-dot { margin-left: 2px; }
@keyframes breathe { 50% { opacity: .35; } }

.side-foot { flex: none; padding-top: 6px; border-top: 1px solid var(--b1); }
.acct { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; border-radius: 10px; text-align: left; }
.acct:hover { background: var(--hover); }
.acct .t { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.25; }
.acct small { display: block; color: var(--t4); font-size: var(--fs-cap); }
.acct .i { color: var(--t4); }

/* ── Main ──────────────────────────────────────────────────────── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mhead { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px 0 24px; flex: none; }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: var(--fs-ui); color: var(--t3); white-space: nowrap; }
.crumb a { color: var(--t3); }
.crumb a:hover { color: var(--t1); }
.crumb .sep { color: var(--t5); }
.crumb b { color: var(--t1); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crumb .note { color: var(--t4); font-size: var(--fs-sm); }
.backlink { display: inline-flex; align-items: center; gap: 2px; color: var(--t3); margin-left: -6px; padding: 4px 8px 4px 2px; border-radius: 8px; }
.backlink:hover { color: var(--t1); background: var(--hover); }
.backlink .i { width: 15px; height: 15px; }
.mbody { flex: 1; min-height: 0; display: flex; }
.col-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.content { flex: 1; min-width: 0; overflow-y: auto; position: relative; scrollbar-width: thin; scrollbar-color: var(--b2) transparent; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); background: var(--l2); box-shadow: inset 0 0 0 1px var(--b1); font-size: var(--fs-sm); color: var(--t1); white-space: nowrap; transition: background .15s var(--ease); }
.btn:hover { background: var(--l3); }
.btn .i { width: 15px; height: 15px; }
.btn.primary { background: var(--t1); color: var(--bg); box-shadow: none; }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--t2); }
.btn.ghost:hover { background: var(--hover); color: var(--t1); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.txtbtn { color: var(--t3); font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 4px; }
.txtbtn:hover { color: var(--t1); }
.txtbtn .i { width: 14px; height: 14px; }

/* avatars & agent glyphs */
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 600; letter-spacing: .02em; color: #fff; flex: none; }
.av.sm { width: 20px; height: 20px; font-size: 8.5px; }
.av.lg { width: 28px; height: 28px; font-size: 11px; }
.av.xl { width: 32px; height: 32px; font-size: 12px; }
.ag { width: 22px; height: 22px; border-radius: 7px; display: inline-grid; place-items: center; flex: none; background: var(--l3); color: var(--t2); position: relative; }
.ag .i { width: 13px; height: 13px; }
.ag.lg { width: 32px; height: 32px; border-radius: 9px; } .ag.lg .i { width: 16px; height: 16px; }
.ag.xl { width: 44px; height: 44px; border-radius: 12px; } .ag.xl .i { width: 21px; height: 21px; }
.ag.k { background: var(--t1); color: var(--bg); }
.ag .st { position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--bg); }
.ag .st.idle { background: var(--t5); } .ag .st.sched { background: var(--t4); }
.faces { display: inline-flex; align-items: center; }
.faces > .av { box-shadow: 0 0 0 2px var(--bg); }
.faces > .av + .av { margin-left: -5px; }

/* segmented */
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--l1); box-shadow: inset 0 0 0 1px var(--b1); gap: 2px; flex: none; }
.seg button, .seg a { height: 26px; padding: 0 12px; border-radius: 7px; font-size: var(--fs-sm); color: var(--t3); display: inline-flex; align-items: center; gap: 5px; }
.seg button:hover, .seg a:hover { color: var(--t1); }
.seg .on { background: var(--l3); color: var(--t1); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
body.light .seg .on { background: #fff; box-shadow: 0 1px 2px rgba(15,17,21,.12); }
/* text tabs (Manus library style) */
.ttabs { display: flex; gap: 2px; flex-wrap: wrap; }
.ttab { height: 28px; padding: 0 10px; border-radius: 7px; font-size: var(--fs-sm); color: var(--t3); }
.ttab:hover { color: var(--t1); }
.ttab.on { color: var(--t1); background: var(--hover); }

.search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 9px; background: var(--l1); box-shadow: inset 0 0 0 1px var(--b2); color: var(--t4); width: 240px; max-width: 100%; }
.search input { background: none; border: 0; outline: 0; flex: 1; min-width: 0; color: var(--t1); font-size: var(--fs-sm); }
.search input::placeholder { color: var(--t4); }

/* section heading used everywhere */
.h6 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; padding: 0 8px; font-size: var(--fs-cap); font-weight: 500; color: var(--t4); }
.h6 .grow { flex: 1; }
.h6 a, .h6 button { font-weight: 400; color: var(--t3); }
.h6 a:hover, .h6 button:hover { color: var(--t1); }

/* plain list rows */
.list { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px; border-radius: 10px; position: relative; text-align: left; width: 100%; }
.lrow + .lrow::before { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--b1); }
.lrow:hover { background: var(--hover); }
.lrow:hover::before, .lrow:hover + .lrow::before { opacity: 0; }
.lrow .t { flex: 1; min-width: 0; }
.lrow .t b { display: block; font-weight: 500; font-size: var(--fs-ui); color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .t small { display: block; color: var(--t3); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.lrow .t small.wrap { white-space: normal; }
.lrow .r { flex: none; color: var(--t4); font-size: var(--fs-cap); text-align: right; }
.lrow .hov { opacity: 0; transition: opacity .15s; display: flex; gap: 4px; }
.lrow:hover .hov, .lrow:focus-within .hov { opacity: 1; }

/* ── Composer (DSH) ───────────────────────────────────────────── */
.composer { background: var(--input); box-shadow: var(--shadow-1); border-radius: var(--r-xl); padding: 14px 12px 10px 18px; position: relative; }
.composer textarea { width: 100%; resize: none; border: 0; outline: 0; background: none; font-size: var(--fs-body); line-height: 1.5; min-height: 46px; color: var(--t1); display: block; }
.composer textarea::placeholder { color: var(--t4); }
.composer .bar { display: flex; align-items: center; gap: 4px; margin-left: -8px; }
.cbtn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 9px; color: var(--t3); font-size: var(--fs-sm); white-space: nowrap; min-width: 0; }
.cbtn:hover, .cbtn.on { background: var(--hover); color: var(--t1); }
.cbtn .i { width: 15px; height: 15px; }
.cbtn .cv { width: 12px; height: 12px; color: var(--t4); }
.cbtn.round { width: 30px; padding: 0; justify-content: center; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--b2); }
.cbtn .ml { overflow: hidden; text-overflow: ellipsis; }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--send); color: #fff; display: grid; place-items: center; flex: none; margin-left: 4px; }
.send .i { width: 16px; height: 16px; stroke-width: 2; }
.scope-note { font-size: var(--fs-sm); color: var(--t4); padding: 10px 18px 0; }
.scope-note b { color: var(--t2); font-weight: 500; }
.where { display: flex; align-items: center; gap: 2px; margin: 0 0 8px 8px; font-size: var(--fs-sm); color: var(--t4); }
.where .cbtn { color: var(--t2); font-weight: 500; padding: 0 8px; }
.composer-wrap { flex: none; padding: 0 24px 16px; position: relative; }
.composer-wrap .composer, .composer-wrap .scope-note { max-width: 740px; margin: 0 auto; }

/* ── Home & folder room (same grammar) ─────────────────────────── */
.room { width: 100%; max-width: 740px; margin: 0 auto; padding: 0 24px; }
.home { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 40px 0 12vh; }
.hero { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; }
.hero .brand-mark { width: 30px; height: 30px; }
.hero h1 { font-size: var(--fs-hero); font-weight: 500; margin: 0; letter-spacing: -.015em; }
.needs { margin-top: 44px; }
.needs .lrow { min-height: 44px; }

.room-head { text-align: center; padding: 64px 0 28px; }
.room-head h1 { font-size: var(--fs-hero); font-weight: 600; letter-spacing: -.015em; margin: 0 0 12px; }
.room-head .faces { gap: 6px; }
.room-head .faces > .av { width: 28px; height: 28px; font-size: 10px; box-shadow: none; margin-left: 0; }
.room-head .who { font-size: var(--fs-sm); color: var(--t3); height: 26px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.room-sec { margin-top: 40px; }
.room-sec:last-child { padding-bottom: 64px; }
.fstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 4px 8px 0; }
.fmini { text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fmini b { font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fmini small { color: var(--t4); font-size: var(--fs-cap); margin-top: -6px; }
.fmini:hover .thumb { box-shadow: inset 0 0 0 1px var(--b3); }

/* file thumbnails — monochrome */
.thumb { aspect-ratio: 4 / 3; border-radius: 10px; background: var(--l1); box-shadow: inset 0 0 0 1px var(--b1); overflow: hidden; position: relative; display: grid; place-items: center; color: var(--t4); transition: box-shadow .15s; }
body.light .thumb { background: var(--l2); }
.thumb .i { width: 22px; height: 22px; }
.thumb .lines { position: absolute; inset: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.thumb .lines i { display: block; height: 4px; border-radius: 2px; background: var(--b2); }
.thumb .lines i:first-child { width: 50%; height: 6px; background: var(--b4); margin-bottom: 4px; }
body.light .thumb.grid-bg { background-image: linear-gradient(var(--b2) 1px, transparent 1px), linear-gradient(90deg, var(--b2) 1px, transparent 1px); }
.thumb.grid-bg { background-image: linear-gradient(var(--b1) 1px, transparent 1px), linear-gradient(90deg, var(--b1) 1px, transparent 1px); background-size: 100% 16px, 25% 100%; }
.thumb.img { background: linear-gradient(160deg, var(--l3), var(--l1) 75%); }

/* ── Chat ──────────────────────────────────────────────────────── */
.chat { max-width: 740px; margin: 0 auto; padding: 16px 24px 24px; }
.day { text-align: center; font-size: var(--fs-cap); color: var(--t4); margin: 8px 0 24px; }
.msg { margin-bottom: 28px; position: relative; }
.msg-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: var(--fs-sm); }
.msg-h .who { font-weight: 500; color: var(--t1); }
.msg-h .when { color: var(--t4); font-size: var(--fs-cap); }
.msg-in { padding-left: 32px; }
.msg-body { font-size: var(--fs-body); line-height: 1.65; color: var(--t1); }
.msg-body p { margin: 0 0 12px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body ul { margin: 0 0 12px; padding-left: 20px; }
.msg-body li { margin-bottom: 6px; }
.msg-body li::marker { color: var(--t4); }
.msg-body strong { font-weight: 600; }
.mention { color: var(--accent); font-weight: 500; white-space: nowrap; }
.bubble-me { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 28px; }
.bubble-me .bubble { max-width: 75%; background: var(--l2); padding: 10px 16px; border-radius: var(--r-xl); font-size: var(--fs-body); line-height: 1.6; }
.bubble-me .meta { font-size: var(--fs-cap); color: var(--t4); margin-top: 6px; padding-right: 6px; }
.turn { display: flex; align-items: center; gap: 6px; width: 100%; color: var(--t3); font-size: var(--fs-ui); padding: 2px 0 12px; margin-bottom: 14px; border-bottom: 1px solid var(--b1); }
.turn:hover { color: var(--t1); }
.turn .i { width: 14px; height: 14px; transition: transform .2s var(--ease); }
.turn.open .i { transform: rotate(180deg); }
.turn .r { margin-left: auto; color: var(--t4); font-size: var(--fs-cap); }
.steps { margin: -4px 0 18px; padding-left: 14px; border-left: 1px solid var(--b2); animation: reveal .2s var(--ease); }
@keyframes reveal { from { opacity: 0; transform: translateY(-3px); } }
.steps .s-h { font-size: var(--fs-cap); color: var(--t4); margin: 0 0 4px; }
.step { display: flex; align-items: center; gap: 10px; min-height: 30px; font-size: 13.5px; color: var(--t2); }
.step .nm { color: var(--t1); min-width: 92px; }
.step .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t3); }
.step .dur { color: var(--t4); font-size: var(--fs-cap); font-family: var(--font-mono); }
.ok { color: var(--green); } .warn { color: var(--amber); } .err { color: var(--red); } .idle { color: var(--t4); }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--b3); border-top-color: var(--t1); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.live { display: flex; align-items: center; gap: 10px; font-size: var(--fs-ui); color: var(--t2); padding: 2px 0 12px; margin-bottom: 14px; border-bottom: 1px solid var(--b1); width: 100%; }
.live .r { margin-left: auto; color: var(--t4); font-size: var(--fs-cap); }
.files-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.fchip { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; border-radius: var(--r-md); background: var(--l1); box-shadow: inset 0 0 0 1px var(--b1); text-align: left; min-width: 0; }
.fchip:hover { background: var(--l2); }
.fchip > .i { width: 18px; height: 18px; color: var(--t3); }
.fchip b { display: block; font-weight: 500; font-size: var(--fs-sm); }
.fchip small { color: var(--t4); font-size: var(--fs-cap); }
.msg-actions { display: flex; align-items: center; gap: 2px; margin: 10px 0 0 -6px; color: var(--t4); opacity: 0; transition: opacity .15s; }
.msg:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
.msg-actions .iconbtn .i { width: 15px; height: 15px; }
.approval { margin: 18px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--l1); box-shadow: inset 0 0 0 1px rgba(245,158,11,.32); }
body.light .approval { background: var(--amber-soft); }
.approval .ah { display: flex; gap: 12px; align-items: flex-start; }
.approval .ah > .i { color: var(--amber); margin-top: 3px; }
.approval .ah b { font-weight: 500; display: block; margin-bottom: 2px; font-size: var(--fs-ui); }
.approval .ah p { margin: 0; color: var(--t3); font-size: var(--fs-sm); }
.approval .acts { display: flex; gap: 6px; margin-top: 12px; padding-left: 28px; align-items: center; flex-wrap: wrap; }
.approval .acts small { color: var(--t4); margin-left: auto; font-size: var(--fs-cap); }
.typing { display: flex; align-items: center; gap: 8px; color: var(--t4); font-size: var(--fs-sm); }
.typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--t4); display: inline-block; animation: blink 1.2s infinite; margin-right: 2px; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* ── Right panel: one sheet ────────────────────────────────────── */
.rpanel { width: 312px; flex: none; margin: 0 12px 12px 0; background: var(--l1); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--b2) transparent; animation: slidein .2s var(--ease); align-self: stretch; }
body.light .rpanel { background: var(--l2); box-shadow: none; }
@keyframes slidein { from { opacity: 0; transform: translateX(8px); } }
.psec { padding: 14px 16px 12px; }
.psec + .psec { border-top: 1px solid var(--b1); }
.psec-h { display: flex; align-items: center; gap: 6px; height: 24px; margin-bottom: 4px; font-size: var(--fs-cap); font-weight: 500; color: var(--t4); }
.psec-h .grow { flex: 1; }
.psec-h .iconbtn { width: 22px; height: 22px; opacity: 0; transition: opacity .15s; }
.psec-h .iconbtn .i { width: 14px; height: 14px; }
.psec:hover .psec-h .iconbtn { opacity: 1; }
.psec-h.tog { width: 100%; text-align: left; cursor: pointer; }
.psec-h.tog:hover { color: var(--t2); }
.psec-h.tog .i { width: 13px; height: 13px; margin-left: auto; transition: transform .2s var(--ease); }
.psec-h.tog.open .i { transform: rotate(180deg); }
.pi { display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 13.5px; color: var(--t1); width: calc(100% + 12px); margin: 0 -6px; padding: 0 6px; text-align: left; border-radius: 8px; }
a.pi:hover, button.pi:hover { background: var(--hover); }
.pi .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pi .r { color: var(--t4); font-size: var(--fs-cap); flex: none; display: flex; align-items: center; gap: 6px; }
.pi > .i { color: var(--t4); }
.pi.sub { padding-left: 38px; color: var(--t3); min-height: 28px; font-size: var(--fs-sm); position: relative; }
.pi.sub::before { content: ''; position: absolute; left: 16px; top: 0; bottom: 0; width: 1px; background: var(--b2); }
.pi.sub:last-of-type::before { bottom: 50%; }
.pmore { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: var(--fs-sm); color: var(--t3); }
.pmore:hover { color: var(--t1); }
.pmore .i { width: 13px; height: 13px; }
.ptext { font-size: var(--fs-sm); color: var(--t2); line-height: 1.6; margin: 2px 0 4px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; padding: 4px 0 4px; font-size: var(--fs-sm); margin: 0; }
.kv dt { color: var(--t4); }
.kv dd { margin: 0; color: var(--t1); min-width: 0; }
.kv dd a { color: var(--t1); text-decoration: underline; text-decoration-color: var(--b3); text-underline-offset: 3px; }
.done-list { margin: 2px 0 2px; }
.done { display: flex; gap: 10px; font-size: 13.5px; padding: 5px 0; line-height: 1.4; }
.done .d { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--t5); }
.done .d.ok { background: var(--green); } .done .d.warn { background: var(--amber); } .done .d.run { background: var(--t2); }
.done small { display: block; color: var(--t4); font-size: var(--fs-cap); }
.meter { height: 3px; border-radius: 2px; background: var(--b2); overflow: hidden; margin: 8px 0 2px; }
.meter i { display: block; height: 100%; background: var(--t3); border-radius: 2px; }

/* ── Pages ─────────────────────────────────────────────────────── */
.page { max-width: 960px; margin: 0 auto; padding: 32px 40px 64px; }
.page.wide { max-width: 1240px; }
.ptitle { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
.ptitle > div:first-child { flex: 1; min-width: 240px; }
.ptitle h1 { font-size: var(--fs-title); font-weight: 600; margin: 0; letter-spacing: -.01em; }
.ptitle p { margin: 4px 0 0; color: var(--t3); font-size: var(--fs-ui); max-width: 560px; }
.ptitle .acts { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.group { margin-bottom: 36px; }

/* library launcher */
.lib { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 32px; }
.lib-item { display: flex; gap: 14px; padding: 14px 8px; border-radius: 12px; align-items: flex-start; position: relative; }
.lib-item + .lib-item::before { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--b1); }
.lib-item:hover { background: var(--hover); }
.lib-item > .i { width: 20px; height: 20px; color: var(--t3); margin-top: 1px; }
.lib-item b { display: block; font-weight: 500; font-size: var(--fs-body); }
.lib-item small { display: block; color: var(--t3); font-size: var(--fs-sm); margin-top: 2px; }
.lib-item .att { color: var(--t1); }
.lib-item .att::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }

/* files grid */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 28px 20px; }
.ftile { display: flex; flex-direction: column; gap: 10px; text-align: left; min-width: 0; }
.ftile:hover .thumb { box-shadow: inset 0 0 0 1px var(--b3); }
.ftile .meta { padding: 0 2px; min-width: 0; }
.ftile .meta b { display: block; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ftile .meta small { display: block; color: var(--t4); font-size: var(--fs-cap); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

/* memory */
.mem { padding: 12px 8px; position: relative; display: flex; gap: 12px; align-items: flex-start; border-radius: 10px; }
.mem + .mem::before { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 1px; background: var(--b1); }
.mem:hover { background: var(--hover); }
.mem p { margin: 0 0 3px; font-size: var(--fs-ui); line-height: 1.55; }
.mem small { color: var(--t4); font-size: var(--fs-cap); }
.mem .acts { display: flex; gap: 4px; flex: none; }
.mem .hov { opacity: 0; transition: opacity .15s; }
.mem:hover .hov { opacity: 1; }

/* detail pages (agent, bot) */
.dhead { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }

  function thumb(cat) {

    if (cat === 'site') return `<div class="thumb" style="display:block;padding:14px 16px"><div style="height:5px;width:36%;background:var(--b3);border-radius:3px;margin-bottom:12px"></div><div style="height:9px;width:70%;background:var(--b4);border-radius:3px;margin-bottom:7px"></div><div style="height:5px;width:52%;background:var(--b2);border-radius:3px"></div></div>`;

  }
  function crmView() {
    const rows = [['Atlas Studio', 'Ines Weber', 'Expansion', 24000, 'anna', 'Negotiation'], ['Harbor & Co', 'J. Alvarez', 'New', 18000, 'dev', 'Proposal'], ['Kestrel Health', 'M. Osei', 'New', 42000, 'dev', 'Discovery'], ['Lumen Retail', 'P. Novak', 'Renewal', 9600, 'mark', 'Won'], ['Orbit Freight', 'S. Iyer', 'New', 15500, 'anna', 'Proposal'], ['Pine Legal', 'R. Haas', 'New', 7200, 'mark', 'Discovery'], ['Quill Media', 'T. Brandt', 'Expansion', 12800, 'anna', 'Negotiation']];
    const stages = ['Discovery', 'Proposal', 'Negotiation', 'Won'];
    const sum = st => rows.filter(r => r[5] === st).reduce((a, r) => a + r[3], 0);
    const total = rows.reduce((a, r) => a + r[3], 0);
    return `${mhead('<b>Client CRM</b><span class="note hide-sm">Team app</span>', appRight)}<div class="mbody"><div class="content"><div class="page wide">
      <div class="app-head"><div><h1>Pipeline</h1><p>${rows.length} open deals · $${(total / 1000).toFixed(1)}k · Lead qualifier adds new leads</p></div><div class="acts"><label class="search">${ic('search')}<input placeholder="Search deals"></label><button class="btn">${ic('plus')}Deal</button></div></div>
      <div class="pipe">${stages.map(s => `<i style="flex:${sum(s)}"></i>`).join('')}</div>
      <div class="pipe-legend">${stages.map(s => `<div>${s}<b>$${(sum(s) / 1000).toFixed(1)}k</b></div>`).join('')}</div>
      <table class="table"><thead><tr><th>Company</th><th>Stage</th><th>Contact</th><th>Type</th><th>Value</th><th>Owner</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[5] === 'Won' ? `<span class="status running">Won</span>` : r[5]}</td><td>${r[1]}</td><td>${r[2]}</td><td>$${r[3].toLocaleString('en-US')}</td><td>${name(r[4])}</td></tr>`).join('')}</tbody></table>
    </div></div></div>`;
  }

  /* ── settings ────────────────────────────────────────────────── */
  function settingsView(r) {
    const sec = r.id === 'models' ? 'models' : 'members';
    const nav = [['h', 'Northwind Labs'], ['general', 'General'], ['members', 'Members & roles'], ['models', 'Subscriptions & models'], ['limits', 'Spend & limits'], ['security', 'Data & security'], ['h', 'You'], ['profile', 'Profile'], ['pmem', 'Personal memory'], ['notif', 'Notifications']];
    const vnav = `<nav class="vnav">${nav.map(([k, l]) => k === 'h' ? `<h5>${l}</h5>` : `<a class="${sec === k ? 'on' : ''}" href="#/settings/${k}">${l}</a>`).join('')}</nav>`;
    let main;
    if (sec === 'models') {
      main = `${ptitle('Subscriptions & models', 'One layer over every subscription the team already pays for. kumiya routes each run and shows who pays.', `<button class="btn">${ic('plus')}Connect</button>`)}
        ${group('Subscriptions', `<div class="list">${subs.map(s => `<div class="lrow"><span class="logo">${s.l}</span><span class="t"><b>${s.n}</b><small>${s.who} · ${s.models}</small></span><span class="r" style="width:150px">${s.use}% · ${s.note}<div class="meter"><i style="width:${s.use}%;${s.use > 55 ? 'background:var(--amber)' : ''}"></i></div></span></div>`).join('')}</div>`)}
        ${group('Routing', `<div class="list">${[['Research, long documents, planning', 'Claude Opus 4.5 · Claude Team'], ['Bulk jobs, bots, scheduled tasks', 'DeepSeek V4 · team pool'], ['Images and edits', 'GPT Image · ChatGPT Business'], ['When a subscription hits its cap', 'Next cheapest that fits']].map(([a, b]) => `<div class="lrow" style="min-height:42px"><span class="t"><b style="font-weight:400">${a}</b></span><span class="r" style="color:var(--t2);font-size:13px">${b}</span></div>`).join('')}</div>`)}
        ${group('Personal subscriptions', `<div style="padding:0 8px">${perm('Members can connect their own subscriptions', 'Used only in their personal chats', true)}${perm('Members may share one with the team', 'They set the cap — like Anna’s Google AI Pro at 50%', true)}</div>`)}`;
    } else {
      const mem = [['anna', 'Owner', 'Claude Team, ChatGPT Business'], ['me', 'Admin', 'Claude Team · ChatGPT Plus (own)'], ['mark', 'Member', 'Claude Team'], ['sofia', 'Member', 'Claude Team, ChatGPT Business'], ['dev', 'Member', 'ChatGPT Business'], ['ines', 'Member', 'Team pool'], ['lena', 'Member', 'Team pool'], ['tom', 'Guest', 'Atlas launch only · capped']];
      main = `${ptitle('Members & roles', '9 members · 8 seats used. Agents and bots never take a seat.', `<button class="btn ghost">${ic('link')}Invite link</button><button class="btn">${ic('plus')}Invite</button>`)}
        <div class="list">${mem.map(([k, role, m]) => `<div class="lrow">${av(k, 'xl')}<span class="t"><b>${P[k].n}${k === 'me' ? ' (you)' : ''}</b><small>${m}</small></span><button class="txtbtn">${role}${ic('chevd')}</button></div>`).join('')}</div>
        <div class="group" style="margin-top:36px"><div class="h6">Roles</div><dl class="kv" style="padding:0 8px;grid-template-columns:100px 1fr"><dt>Owner</dt><dd>Billing, subscriptions, delete workspace</dd><dt>Admin</dt><dd>Members, apps, connectors, policies</dd><dt>Member</dt><dd>Team folders they’re in, their own personal space</dd><dt>Guest</dt><dd>Only shared folders and chats; can’t see team memory</dd></dl></div>`;
    }
    return page('<b>Settings</b>', `<div class="set-layout">${vnav}<div>${main}</div></div>`);
  }

  /* ── search: one spotlight ───────────────────────────────────── */
  function searchView() {
    const row = (href, t, s, on) => `<a class="lrow ${on ? 'on' : ''}" href="${href}"><span class="t"><b>${t}</b><small>${s}</small></span></a>`;
    return home({ id: '' }) + `<div class="scrim top" data-nav="#/home"><div class="spot" data-stop role="dialog" aria-label="Search">
      <label class="spot-in">${ic('search')}<input value="atlas" placeholder="Search chats, folders, files, memory, people" data-spot></label>
      <div class="spot-body">
        <div class="h6">Chats</div>${row('#/chat/atlas', 'Atlas v2 launch plan', 'Atlas launch · Anna, Mark, Sofia, you · now', true)}${row('#/chat/pricing-exp', 'Pricing experiments', 'Atlas launch · 2h')}
        <div class="h6">Folders</div>${row('#/folder/atlas', 'Atlas launch', '6 people · 4 chats')}
        <div class="h6">Files</div>${row('#/files', 'Atlas-v2-launch-plan.md', 'Atlas launch · now')}${row('#/files', 'atlas-v2 landing', 'Atlas launch · 1d')}
        <div class="h6">Memory</div>${row('#/memory', 'Atlas Studio signs off launches with Ines on their side…', 'Team memory · Clients')}
        <div class="h6">People</div>${row('#/settings/members', 'Ines Weber', 'Member · client contact for Atlas Studio')}
      </div></div></div>`;
  }

  /* ── main render ─────────────────────────────────────────────── */
  function mainView(r) {
    switch (r.v) {
      case 'chat': return chatView(r) + (r.sub === 'share' ? shareChatDialog(r) : '');
      case 'folder': return folderView(r);
      case 'library': return library();
      case 'app': return r.id === 'crm' ? crmView() : boardView();
      case 'apps': return appsDir();
      case 'files': return filesView();
      case 'memory': return memoryView();
      case 'agents': return agentsView(r);
      case 'skills': return skillsView();
      case 'bots': return botsView(r);
      case 'scheduled': return scheduledView();
      case 'connectors': return connectorsView();
      case 'settings': return settingsView(r);
      case 'search': return searchView();
      default: return home(r);
    }
  }

  let lastHash = '';
  function render() {
    const r = route();
    document.body.classList.toggle('light', S.theme === 'light');
    const prev = document.querySelector('.content');
    const prevScroll = prev ? prev.scrollTop : 0;
    const prevPanel = document.querySelector('.rpanel'); const prevPanelScroll = prevPanel ? prevPanel.scrollTop : 0;
    const base = h => h.split('/').slice(0, 3).join('/'), subOf = h => h.split('/')[3] || '';
    const OV = ['', 'mention', 'model', 'plus', 'share', 'details', 'about'];
    const same = !!lastHash && base(lastHash) === base(r.hash) && OV.includes(subOf(lastHash)) && OV.includes(r.sub);
    const wsOpen = r.v === 'home' && r.id === 'ws';
    document.getElementById('app').innerHTML = `<div class="stage">${scenebar(r)}<div class="window ${S.sideOpen ? 'side-open' : ''}">${sidebar(r)}<main class="main">${mainView(r)}</main>${(menu === 'ws' || wsOpen) ? wsMenu() : ''}</div></div>`;
    const c = document.querySelector('.content');
    if (c) {
      if (same) c.scrollTop = prevScroll;
      else if (c.dataset.scroll === 'bottom') c.scrollTop = c.scrollHeight;
      else if (c.dataset.scroll === 'steps') { const t = c.querySelector('.turn'); if (t) c.scrollTop = t.offsetTop - 120; }
    }
    const rp = document.querySelector('.rpanel');
    if (rp) { if (r.sub === 'details' && subOf(lastHash) !== 'details') rp.scrollTop = rp.scrollHeight; else if (same) rp.scrollTop = prevPanelScroll; }
    const pill = document.querySelector('.pill.on'); if (pill && lastHash !== r.hash) pill.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (r.sub === 'mention') { const t = document.querySelector('[data-composer]'); if (t) { t.focus(); t.setSelectionRange(1, 1); } }
    if (r.v === 'search') { const t = document.querySelector('[data-spot]'); if (t) t.focus(); }
    lastHash = r.hash;
    bindBoard();
  }

  /* ── board drag & drop ───────────────────────────────────────── */
  function bindBoard() {
    let drag = null;
    document.querySelectorAll('.kcard').forEach(el => {
      el.addEventListener('dragstart', e => { drag = { col: el.dataset.col, i: +el.dataset.i }; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'card'); });
      el.addEventListener('dragend', () => el.classList.remove('drag'));
    });
    document.querySelectorAll('[data-drop]').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over'); if (!drag) return;
        const B = JSON.parse(JSON.stringify(S.board || BOARD0));
        const [card] = B[drag.col].splice(drag.i, 1);
        const to = col.dataset.drop;
        const after = [...col.querySelectorAll('.kcard')].filter(k => { const rc = k.getBoundingClientRect(); return e.clientY > rc.top + rc.height / 2; }).length;
        let idx = after; if (to === drag.col && drag.i < after) idx = after - 1;
        B[to].splice(Math.max(0, idx), 0, card);
        S.board = B; persist(); drag = null; render(); toast(`Moved to ${to}`);
      });
    });
  }

  /* ── events ──────────────────────────────────────────────────── */
  let toastT;
  function toast(msg) { clearTimeout(toastT); let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = msg; toastT = setTimeout(() => t.remove(), 2200); }
  const go = h => { if (location.hash === h) render(); else location.hash = h; };

  document.addEventListener('click', e => {
    const stop = e.target.closest('[data-stop]');
    const navEl = e.target.closest('[data-nav]');
    if (navEl && !(stop && navEl.classList.contains('scrim'))) { if (navEl.classList.contains('scrim') && e.target !== navEl) return; e.preventDefault(); go(navEl.dataset.nav); return; }
    if (S.sideOpen && !e.target.closest('.sidebar') && !e.target.closest('[data-act="side-open"]')) { S.sideOpen = false; render(); return; }
    const tg = e.target.closest('.toggle'); if (tg) { tg.classList.toggle('on'); tg.setAttribute('aria-checked', tg.classList.contains('on')); return; }
    const a = e.target.closest('[data-act]');
    if (e.target.closest('a[href^="#"]') && (!a || a.dataset.act === 'nf-preset')) { if (a) { S.newFolderWho = a.dataset.v; persist(); } menu = null; S.sideOpen = false; return; }
    if (!a) return;
    const act = a.dataset.act, v = a.dataset.v;
    switch (act) {
      case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; break;
      case 'panel': if (narrow()) S.panelSm = !S.panelSm; else S.panel = !S.panel; break;
      case 'set': S[a.dataset.k] = v; break;
      case 'where-pick': { const team = PLACES[v].team; if (team) S.whereTeam = v; else S.whereSolo = v; persist(); go(team ? '#/home' : '#/home/personal'); return; }
      case 'nf-who': S.newFolderWho = v; break;
      case 'room-private': S.roomPrivate = !S.roomPrivate; break;
      case 'all-recent': S.allRecent = !S.allRecent; break;
      case 'sources': S.sources = !S.sources; break;
      case 'share-access': S.shareAccess = v; break;
      case 'share-more': S.shareMore = !S.shareMore; break;
      case 'folder-access': S.folderAccess = v; break;
      case 'folder-more': S.folderMore = !S.folderMore; break;
      case 'ws-menu': menu = menu === 'ws' ? null : 'ws'; if (route().id === 'ws') { location.hash = '#/home'; return; } break;
      case 'close-menu': menu = null; if (route().id === 'ws') { location.hash = '#/home'; return; } break;
      case 'side-open': S.sideOpen = true; break;
      case 'side-close': if (innerWidth <= 860) { S.sideOpen = false; break; } toast('The sidebar folds away in the real app'); return;
      case 'board-reset': S.board = null; toast('Board reset'); break;
      case 'plus-open': { const r = route(); if (r.v === 'chat' && CH[r.id]) go(r.sub === 'plus' ? `#/chat/${r.id}` : `#/chat/${r.id}/plus`); else toast('Attach files · Add from Files · @ people and agents · / skills · Permissions'); return; }
      case 'model-open': { const r = route(); if (r.v === 'chat' && CH[r.id]) go(r.sub === 'model' ? `#/chat/${r.id}` : `#/chat/${r.id}/model`); else toast('Auto picks the model by workspace rules — and shows who pays'); return; }
      case 'send': toast('Prototype: nothing is sent — sample conversation only'); return;
      case 'prev': case 'next': { const i = FLAT.indexOf(route().hash); const n = act === 'next' ? (i + 1) % FLAT.length : (i - 1 + FLAT.length) % FLAT.length; go(FLAT[i < 0 ? 0 : n]); return; }
      case 'toast': toast(a.dataset.msg || 'Prototype'); return;
      default: return;
    }
    e.preventDefault(); persist(); render();
  });
  document.addEventListener('input', e => {
    if (e.target.matches('[data-composer]') && e.target.value.endsWith('@')) { const r = route(); if (r.v === 'chat' && CH[r.id] && r.sub !== 'mention') go(`#/chat/${r.id}/mention`); }
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); go('#/search'); return; }
    const r = route();
    if (e.key === 'Escape') {
      menu = null; S.sideOpen = false;
      if (r.v === 'chat' && ['share', 'mention', 'model', 'plus'].includes(r.sub)) go(`#/chat/${r.id}`);
      else if (r.v === 'folder' && r.sub === 'share') go(`#/folder/${r.id}/about`);
      else if (r.v === 'search' || (r.v === 'folder' && r.id === 'new') || (r.v === 'home' && (r.id === 'ws' || r.id === 'where'))) go('#/home');
      else if (r.v === 'home' && r.sub === 'where') go('#/home/personal');
      else render();
      return;
    }
    if (e.target.matches('input, textarea')) return;
    if (e.key === ']' || e.key === '[') { document.querySelector(`[data-act="${e.key === ']' ? 'next' : 'prev'}"]`).click(); }
    if (/^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey) go(FLAT[+e.key - 1]);
  });
  window.addEventListener('hashchange', () => { menu = null; S.sideOpen = false; render(); });
  render();
})();
</script>
</body>
</html>
