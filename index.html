:root {
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-brand: 'Montserrat', var(--font);
  --font-mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-panel: 28px;

  /* dark (DSH data-ds-dark-theme) */
  --page: #0c0c0d;
  --bg: rgb(21,21,23);              /* bluish-950 */
  --side-a: rgb(42,42,45); --side-b: rgb(49,49,52);
  --l1: rgb(35,35,36);              /* layer-1 bluish-875 */
  --l2: rgb(44,44,46);              /* layer-2 bluish-850 */
  --l3: rgb(53,54,56);              /* layer-3 bluish-800 */
  --input: rgb(44,44,46);
  --code: rgb(27,27,28);
  --b1: rgba(255,255,255,.06); --b2: rgba(255,255,255,.12); --b3: rgba(255,255,255,.16); --b4: rgba(255,255,255,.2);
  --hover: rgba(255,255,255,.08); --active: rgba(255,255,255,.14);
  --nav-active: rgb(67,69,74);
  --t1: rgb(249,250,251); --t2: rgb(207,211,214); --t3: rgb(173,178,184); --t4: rgb(129,133,140); --t5: rgb(97,102,107);
  --accent: rgb(122,170,255); --accent-2: rgb(86,134,254); --accent-soft: rgb(52,65,91); --accent-ink: rgb(183,200,254);
  --send: rgb(72,104,178);
  --green: rgb(34,197,94); --green-soft: rgb(35,60,44); --green-t: rgb(78,209,126);
  --amber: rgb(245,158,11); --amber-soft: rgb(39,36,31); --amber-t: rgb(247,173,49);
  --red: rgb(242,90,90); --red-soft: rgba(242,90,90,.12);
  --violet: rgb(167,139,250); --violet-soft: rgba(167,139,250,.14);
  --menu: rgba(48,49,54,.96);
  --shadow-menu: 0 12px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  --badge-bg: rgb(249,250,251); --badge-t: rgb(21,21,23);
  color-scheme: dark;
}
body.light {
  --page: #e6e8ec;
  --bg: #fff;
  --side-a: rgb(249,250,251); --side-b: rgb(245,247,250);
  --l1: #fff; --l2: rgb(245,247,250); --l3: rgb(235,238,242);
  --input: #fff; --code: rgb(249,250,251);
  --b1: rgba(0,0,0,.04); --b2: rgba(0,0,0,.1); --b3: rgba(0,0,0,.12); --b4: rgba(0,0,0,.16);
  --hover: rgba(38,49,72,.06); --active: rgba(38,49,72,.1);
  --nav-active: rgb(235,238,242);
  --t1: rgb(15,17,21); --t2: rgb(97,102,107); --t3: rgb(129,133,140); --t4: rgb(151,157,166); --t5: rgb(173,178,184);
  --accent: rgb(65,118,230); --accent-2: rgb(65,118,230); --accent-soft: rgb(228,237,253); --accent-ink: rgb(47,76,143);
  --send: rgb(65,118,230);
  --green-soft: rgb(230,250,237); --green-t: rgb(1,140,60);
  --amber-soft: rgb(254,245,231); --amber-t: rgb(190,110,20);
  --red: rgb(220,40,40); --red-soft: rgba(236,19,19,.07);
  --violet: rgb(124,58,237); --violet-soft: rgba(124,58,237,.08);
  --menu: rgba(252,253,254,.98);
  --shadow-menu: 0 12px 40px rgba(15,17,21,.14), 0 0 0 1px rgba(0,0,0,.08);
  --badge-bg: rgb(15,17,21); --badge-t: #fff;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--font); color: var(--t1); background: var(--page); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--t3); } .dim { color: var(--t4); }

/* ── Stage: scenario bar above the product window ─────────────── */
.stage { height: 100vh; display: flex; flex-direction: column; padding: 10px 18px 18px; gap: 10px; }
.scenebar { display: flex; align-items: center; gap: 14px; min-height: 40px; }
.scenebar .sb-brand { font: 500 13px var(--font-brand); color: var(--t3); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.scenebar .sb-scroll { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 2px; }
.scenebar .sb-scroll::-webkit-scrollbar { display: none; }
.sb-group { display: flex; align-items: center; gap: 4px; flex: none; }
.sb-group > span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--t4); margin-right: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; border-radius: 999px; background: var(--l1); border: 1px solid var(--b1); color: var(--t2); font-size: 12.5px; white-space: nowrap; transition: background .15s var(--ease); }
.pill b { font: 500 10.5px var(--font-mono); color: var(--t4); min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; background: var(--b1); }
.pill:hover { background: var(--l2); color: var(--t1); }
.pill.on { background: var(--t1); color: var(--bg); border-color: transparent; }
.pill.on b { background: rgba(0,0,0,.12); color: var(--bg); }
.sb-tools { display: flex; gap: 6px; }

.window { flex: 1; min-height: 0; display: flex; border-radius: 14px; overflow: hidden; background: var(--bg); box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.07); position: relative; }
body.light .window { box-shadow: 0 30px 80px rgba(15,17,21,.18), 0 0 0 1px rgba(0,0,0,.08); }

/* ── Sidebar (DSH SidebarRoot) ─────────────────────────────────── */
.sidebar { width: 280px; flex: none; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--side-a), var(--side-b)); border-right: 1px solid var(--b1); padding: 0 8px 6px; min-height: 0; }
.tl { display: flex; align-items: center; height: 44px; padding: 0 6px; gap: 8px; }
.tl i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.tl i:nth-child(1) { background: #ff5f57; } .tl i:nth-child(2) { background: #febc2e; } .tl i:nth-child(3) { background: #28c840; }
.tl .grow { flex: 1; }
.iconbtn { width: 28px; height: 28px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--t3); transition: background .15s var(--ease), color .15s; flex: none; }
.iconbtn:hover { background: var(--hover); color: var(--t1); }
.iconbtn.on { color: var(--t1); background: var(--hover); }

.brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px; }
.brand-mark { width: 26px; height: 26px; color: var(--t1); }
.brand-name { font: 500 23px/1 var(--font-brand); letter-spacing: -.02em; }
.brand-badge { font: 600 9.5px/1 var(--font); letter-spacing: .06em; background: var(--badge-bg); color: var(--badge-t); padding: 3px 4px 2px; border-radius: 3px; margin-top: 3px; }

.ws { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--r-md); width: 100%; text-align: left; margin-bottom: 8px; }
.ws:hover { background: var(--hover); }
.ws-logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-size: 13px; color: #fff; flex: none; }
.ws-name { font-weight: 500; font-size: 13.5px; line-height: 1.2; }
.ws-sub { font-size: 11.5px; color: var(--t4); }
.ws .i { margin-left: auto; color: var(--t4); }

.newchat { display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; width: 100%; border-radius: var(--r-md); background: var(--l3); border: 1px solid var(--b2); font-size: 14.5px; color: var(--t1); transition: background .15s var(--ease); }
body.light .newchat { background: #fff; }
.newchat:hover { background: var(--nav-active); }
.newchat-row { display: flex; gap: 6px; margin-bottom: 10px; }
.newchat-row .newchat { flex: 1; }
.newchat-row .split { width: 40px; flex: none; }

.side-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px; padding: 0 8px; scrollbar-width: thin; scrollbar-color: transparent transparent; }
.side-scroll:hover { scrollbar-color: var(--b3) transparent; }
.nav { display: flex; flex-direction: column; gap: 1px; margin-bottom: 14px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r-md); color: var(--t1); width: 100%; text-align: left; font-size: 14px; transition: background .12s var(--ease); }
.nav-item .i { color: var(--t3); width: 17px; height: 17px; }
.nav-item:hover { background: var(--hover); }
.nav-item.on { background: var(--nav-active); }
.nav-item.on .i { color: var(--t1); }
.nav-item .cnt { margin-left: auto; font-size: 11.5px; color: var(--t4); }
.nav-item .cnt.blue { color: var(--accent); }

.sec { margin-bottom: 12px; }
.sec-h { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 10px; color: var(--t4); font-size: 13px; }
.sec-h .lbl { display: flex; align-items: center; gap: 6px; flex: 1; }
.sec-h .lbl .i { width: 14px; height: 14px; }
.sec-h .iconbtn { width: 24px; height: 24px; opacity: 0; }
.sec:hover .sec-h .iconbtn, .sec-h .iconbtn.keep { opacity: 1; }
.row { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 5px 10px; border-radius: var(--r-md); width: 100%; text-align: left; color: var(--t1); font-size: 14px; transition: background .12s var(--ease); }
.row:hover { background: var(--hover); }
.row.on { background: var(--nav-active); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font-size: 11.5px; color: var(--t4); flex: none; }
.row .i { color: var(--t3); }
.row.folder .i.fi { color: var(--accent); }
.row.child { padding-left: 32px; font-size: 13.5px; color: var(--t2); }
.row.child.on { color: var(--t1); }
.row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; margin-left: -14px; margin-right: 2px; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 2s infinite; }
.row .dot.blue { background: var(--accent); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); } 70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
.row .chev { width: 14px; height: 14px; color: var(--t4); }
.row .app-ic { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.row .app-ic .i { width: 13px; height: 13px; color: #fff; }
.side-foot { display: flex; align-items: center; gap: 8px; padding: 8px 6px 2px; border-top: 1px solid var(--b1); margin-top: 6px; }
.side-foot .me { display: flex; align-items: center; gap: 9px; flex: 1; padding: 4px; border-radius: var(--r-sm); text-align: left; }
.side-foot .me:hover { background: var(--hover); }
.side-foot .me small { display: block; color: var(--t4); font-size: 11.5px; line-height: 1.2; }

/* ── Main ──────────────────────────────────────────────────────── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.mhead { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px 0 28px; flex: none; }
.mhead .title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mhead .mode { display: flex; align-items: center; gap: 5px; color: var(--t3); font-size: 13px; white-space: nowrap; }
.mhead .grow { flex: 1; }
.tabs { display: flex; gap: 24px; padding: 0 28px; border-bottom: 1px solid var(--b1); flex: none; }
.tab { position: relative; height: 38px; font-size: 14px; color: var(--t2); display: flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--t1); }
.tab.on { color: var(--accent); }
.tab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tab .n { font-size: 11px; color: var(--t4); }
.mbody { flex: 1; min-height: 0; display: flex; }
.content { flex: 1; min-width: 0; overflow-y: auto; position: relative; scrollbar-width: thin; scrollbar-color: var(--b2) transparent; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); background: var(--l2); border: 1px solid var(--b1); font-size: 13px; color: var(--t1); white-space: nowrap; transition: background .15s var(--ease); }
.btn:hover { background: var(--l3); }
.btn.primary { background: var(--t1); color: var(--bg); border-color: transparent; }
.btn.primary:hover { opacity: .9; }
.btn.blue { background: var(--accent-2); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--t2); }
.btn.ghost:hover { background: var(--hover); color: var(--t1); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; border-radius: 7px; }
.btn.danger { color: var(--red); }

/* avatars */
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 600; letter-spacing: .02em; color: #fff; flex: none; position: relative; }
.av.lg { width: 32px; height: 32px; font-size: 12px; }
.av.xl { width: 40px; height: 40px; font-size: 14px; }
.av.sm { width: 18px; height: 18px; font-size: 8px; }
.ag { width: 22px; height: 22px; border-radius: 7px; display: inline-grid; place-items: center; flex: none; background: var(--l3); color: var(--t1); position: relative; }
.ag .i { width: 13px; height: 13px; }
.ag.lg { width: 32px; height: 32px; border-radius: 9px; } .ag.lg .i { width: 17px; height: 17px; }
.ag.xl { width: 44px; height: 44px; border-radius: 12px; } .ag.xl .i { width: 22px; height: 22px; }
.ag.k { background: var(--t1); color: var(--bg); }
.ag.bot::after { content: ''; position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 2px var(--bg); }
.ag.bot.idle::after { background: var(--t4); }
.ag.bot.sched::after { background: var(--amber); }
.stack { display: inline-flex; align-items: center; }
.stack > * { box-shadow: 0 0 0 2px var(--bg); }
.stack > * + * { margin-left: -4px; }
.stack .more { width: 22px; height: 22px; border-radius: 50%; background: var(--l3); color: var(--t2); font-size: 10px; display: grid; place-items: center; }

/* tags */
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; color: var(--t2); background: var(--b1); border: 1px solid var(--b1); white-space: nowrap; }
.tag .i { width: 11px; height: 11px; }
.tag.team { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; }
.tag.solo { color: var(--t2); }
.tag.green { color: var(--green-t); background: var(--green-soft); border-color: transparent; }
.tag.amber { color: var(--amber-t); background: var(--amber-soft); border-color: transparent; }
.tag.red { color: var(--red); background: var(--red-soft); border-color: transparent; }
.tag.violet { color: var(--violet); background: var(--violet-soft); border-color: transparent; }
.sdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }

/* segmented */
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--l1); border: 1px solid var(--b1); gap: 2px; }
.seg button { height: 26px; padding: 0 11px; border-radius: 8px; font-size: 12.5px; color: var(--t3); display: inline-flex; align-items: center; gap: 5px; }
.seg button .i { width: 13px; height: 13px; }
.seg button:hover { color: var(--t1); }
.seg button.on { background: var(--l3); color: var(--t1); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
body.light .seg button.on { background: #fff; }

/* chips row (category filters, like Manus/Library) */
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 11px; border-radius: 8px; font-size: 13px; color: var(--t3); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { color: var(--t1); background: var(--hover); }
.chip.on { background: var(--l3); color: var(--t1); }
.chip .n { font-size: 11px; color: var(--t4); }

.search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: var(--r-sm); background: var(--l1); border: 1px solid var(--b2); color: var(--t4); min-width: 240px; }
.search input { background: none; border: 0; outline: 0; flex: 1; min-width: 0; width: 100%; color: var(--t1); font-size: 13.5px; }
.search input::placeholder { color: var(--t4); }

/* ── Chat (DSH ChatView) ───────────────────────────────────────── */
.chat { max-width: 820px; margin: 0 auto; padding: 18px 32px 24px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--l1); border: 1px solid var(--b1); margin-bottom: 26px; font-size: 13px; color: var(--t2); }
.banner .i { color: var(--t3); }
.banner b { color: var(--t1); font-weight: 500; }
.banner .btn { margin-left: auto; }
.day { text-align: center; font-size: 12px; color: var(--t4); margin: 4px 0 20px; }
.msg { margin-bottom: 26px; }
.msg-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
.msg-h .who { font-weight: 500; }
.msg-h .when { color: var(--t4); font-size: 12px; }
.msg-body { font-size: 15px; line-height: 1.7; color: var(--t1); }
.msg-body p { margin: 0 0 12px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body ul { margin: 0 0 12px; padding-left: 20px; }
.msg-body li { margin-bottom: 6px; }
.msg-body li::marker { color: var(--t3); }
.msg-body code { font-family: var(--font-mono); font-size: 13px; background: var(--code); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--b1); }
.msg-body strong { font-weight: 600; }
.mention { color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-weight: 500; white-space: nowrap; }
body.light .mention { color: var(--accent-ink); }
.human-msg { display: flex; gap: 12px; }
.human-msg .av { margin-top: 2px; }
.human-msg .msg-wrap { flex: 1; min-width: 0; }
.bubble-me { display: flex; flex-direction: column; align-items: flex-end; margin-bottom: 26px; }
.bubble-me .bubble { max-width: 75%; background: var(--l2); padding: 10px 16px; border-radius: var(--r-xl); font-size: 15px; line-height: 1.6; }
.bubble-me .meta { font-size: 12px; color: var(--t4); margin-top: 6px; display: flex; gap: 10px; align-items: center; }
.turn-trigger { display: inline-flex; align-items: center; gap: 6px; color: var(--t3); font-size: 14px; padding: 4px 0 12px; border-bottom: 1px solid var(--b1); width: 100%; margin-bottom: 14px; }
.turn-trigger .i { width: 14px; height: 14px; }
.turn-trigger:hover { color: var(--t1); }
.turn-trigger .grow { flex: 1; }
.turn-trigger .stack { margin-left: 8px; }
.msg-actions { display: flex; align-items: center; gap: 2px; margin-top: 12px; color: var(--t4); font-size: 12.5px; }
.msg-actions .iconbtn { width: 28px; height: 28px; }
.msg-actions .use { display: flex; align-items: center; gap: 5px; margin-left: 10px; }

.card { background: var(--l1); border: 1px solid var(--b1); border-radius: var(--r-lg); }
.run { padding: 4px; margin: 4px 0 14px; }
.run-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; font-size: 13.5px; }
.run-h .grow { flex: 1; }
.run-h .t { font-weight: 500; }
.run-h small { color: var(--t4); font-size: 12px; }
.sub { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-md); font-size: 13.5px; }
.sub:hover { background: var(--hover); }
.sub .nm { font-weight: 500; min-width: 92px; }
.sub .desc { color: var(--t3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub .dur { color: var(--t4); font-size: 12px; font-family: var(--font-mono); }
.ok { color: var(--green); } .warn { color: var(--amber); } .err { color: var(--red); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--b2); border-top-color: var(--accent); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.files-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.fchip { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: var(--r-md); background: var(--l1); border: 1px solid var(--b1); min-width: 220px; text-align: left; }
.fchip:hover { background: var(--l2); }
.fchip .fic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.fchip .fic .i { width: 16px; height: 16px; }
.fchip b { display: block; font-weight: 500; font-size: 13px; }
.fchip small { color: var(--t4); font-size: 11.5px; }

.approval { padding: 14px 16px; margin: 6px 0 14px; border-color: rgba(245,158,11,.28); background: linear-gradient(0deg, var(--amber-soft), var(--amber-soft)), var(--l1); }
.approval .ah { display: flex; gap: 10px; align-items: flex-start; }
.approval .ah .i { color: var(--amber); margin-top: 3px; }
.approval .ah b { font-weight: 500; display: block; margin-bottom: 2px; }
.approval .ah p { margin: 0; color: var(--t2); font-size: 13px; }
.approval .acts { display: flex; gap: 8px; margin-top: 12px; padding-left: 26px; align-items: center; }
.approval .acts small { color: var(--t4); margin-left: auto; font-size: 12px; }
.typing { display: flex; align-items: center; gap: 8px; color: var(--t4); font-size: 13px; margin: -6px 0 10px; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--t4); display: inline-block; animation: blink 1.2s infinite; margin-right: 2px; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

/* composer (DSH) */
.composer-wrap { flex: none; padding: 0 32px 10px; position: relative; }
.composer { max-width: 820px; margin: 0 auto; background: var(--input); border: 1px solid var(--b1); border-radius: var(--r-xl); padding: 14px 14px 10px 18px; position: relative; }
body.light .composer { box-shadow: 0 2px 12px rgba(15,17,21,.06); border-color: var(--b2); }
.composer textarea { width: 100%; resize: none; border: 0; outline: 0; background: none; font-size: 15px; line-height: 1.5; min-height: 46px; color: var(--t1); }
.composer textarea::placeholder { color: var(--t4); }
.composer .bar { display: flex; align-items: center; gap: 6px; }
.composer .bar .grow { flex: 1; }
.cbtn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 9px; color: var(--t2); font-size: 13.5px; white-space: nowrap; }
.cbtn:hover { background: var(--hover); color: var(--t1); }
.cbtn .i { width: 15px; height: 15px; }
.cbtn .cv { width: 12px; height: 12px; color: var(--t4); }
.cbtn.round { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 50%; border: 1px solid var(--b2); margin-left: -6px; }
.cbtn.team { color: var(--accent); }
.send { width: 36px; height: 36px; border-radius: 50%; background: var(--send); color: #fff; display: grid; place-items: center; }
.send .i { width: 17px; height: 17px; stroke-width: 2; }
.send.stop { background: var(--t1); color: var(--bg); }
.send.stop i { width: 11px; height: 11px; background: currentColor; border-radius: 2px; display: block; }
.stats { display: flex; justify-content: center; gap: 18px; color: var(--t4); font-size: 12.5px; margin-top: 8px; flex-wrap: wrap; }
.stats span { display: inline-flex; align-items: center; gap: 6px; }
.stats .i { width: 14px; height: 14px; }

/* home (DSH empty state) */
.home { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px 90px; }
.hero { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
.hero .brand-mark { width: 40px; height: 40px; }
.hero h1 { font-size: 34px; font-weight: 500; margin: 0; letter-spacing: -.01em; }
.hero .pv { font: 500 13px var(--font-mono); background: var(--accent-soft); color: var(--accent-ink); padding: 2px 8px; border-radius: 8px; align-self: flex-start; }
.home-pick { width: 100%; max-width: 820px; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; padding-left: 10px; align-items: center; }
.home .composer { width: 100%; max-width: 820px; margin: 0; }
.scope-note { width: 100%; max-width: 820px; display: flex; gap: 10px; padding: 12px 14px; margin-top: 12px; color: var(--t3); font-size: 13px; align-items: center; }
.scope-note .stack { margin-left: auto; }
.home-cont { width: 100%; max-width: 820px; margin-top: 28px; }
.home-cont h4 { margin: 0 0 8px 4px; font-size: 12.5px; font-weight: 500; color: var(--t4); }
.home-cont .list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cont { text-align: left; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--b1); background: var(--l1); }
.cont:hover { background: var(--l2); }
.cont b { display: block; font-weight: 500; font-size: 13.5px; margin: 6px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cont small { color: var(--t4); font-size: 12px; }
.cont .top { display: flex; align-items: center; gap: 6px; }

/* ── Right panel (meta) ────────────────────────────────────────── */
.rpanel { width: 340px; flex: none; overflow-y: auto; padding: 12px 14px 20px 6px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: var(--b2) transparent; }
.rcard { background: var(--l1); border: 1px solid var(--b1); border-radius: var(--r-lg); padding: 6px; }
body.light .rcard { background: var(--l2); border-color: transparent; }
.rcard-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; font-size: 14px; color: var(--t2); }
.rcard-h .grow { flex: 1; }
.rcard-h .n { color: var(--t4); font-size: 12.5px; }
.rcard-h .iconbtn { width: 24px; height: 24px; }
.ritem { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; font-size: 13.5px; min-height: 36px; width: 100%; text-align: left; }
.ritem:hover { background: var(--hover); }
.ritem .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .t small { display: block; color: var(--t4); font-size: 11.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
.ritem .r { color: var(--t4); font-size: 11.5px; flex: none; }
.ritem.indent { padding-left: 30px; }
.ritem .i { color: var(--t3); }
.ritem.link { color: var(--t3); }
.kv { display: grid; grid-template-columns: 104px 1fr; gap: 7px 10px; padding: 4px 10px 8px; font-size: 13px; }
.kv dt { color: var(--t4); }
.kv dd { margin: 0; color: var(--t1); display: flex; align-items: center; gap: 6px; min-width: 0; }
.tl-list { padding: 2px 10px 6px; }
.tl-row { display: flex; gap: 10px; position: relative; padding-bottom: 12px; font-size: 13px; }
.tl-row::before { content: ''; position: absolute; left: 6px; top: 16px; bottom: 0; width: 1px; background: var(--b2); }
.tl-row:last-child::before { display: none; }
.tl-row .tdot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--t5); flex: none; margin-top: 4px; background: var(--bg); }
.tl-row .tdot.g { border-color: var(--green); } .tl-row .tdot.a { border-color: var(--amber); } .tl-row .tdot.b { border-color: var(--accent); }
.tl-row .tt { flex: 1; }
.tl-row .tt small { display: block; color: var(--t4); font-size: 11.5px; }
.usage-bar { height: 4px; border-radius: 2px; background: var(--b2); overflow: hidden; margin: 2px 10px 10px; }
.usage-bar i { display: block; height: 100%; background: var(--accent-2); border-radius: 2px; }

/* ── Activity (trajectory) ─────────────────────────────────────── */
.act { max-width: 880px; margin: 0 auto; padding: 22px 32px 40px; }
.act-top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.act-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--b1); border: 1px solid var(--b1); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 22px; }
.act-sum > div { background: var(--bg); padding: 12px 16px; }
.act-sum b { display: block; font-size: 18px; font-weight: 500; }
.act-sum small { color: var(--t4); font-size: 12px; }
.turn { margin-bottom: 18px; }
.turn-h { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13.5px; }
.turn-h .q { color: var(--t1); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn-h .r { color: var(--t4); font-size: 12px; font-family: var(--font-mono); }
.steps { border-left: 1px solid var(--b2); margin-left: 11px; padding-left: 20px; }
.step { display: flex; align-items: center; gap: 10px; padding: 6px 10px; margin-left: -10px; border-radius: 10px; font-size: 13.5px; color: var(--t2); }
.step:hover { background: var(--hover); }
.step .tool { font-family: var(--font-mono); font-size: 12px; color: var(--t3); background: var(--code); border: 1px solid var(--b1); padding: 1px 6px; border-radius: 5px; }
.step .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .r { color: var(--t4); font-size: 12px; font-family: var(--font-mono); }
.step.diff .add { color: var(--green-t); font-family: var(--font-mono); font-size: 12px; }
.step.diff .del { color: var(--red); font-family: var(--font-mono); font-size: 12px; }

/* ── Generic pages ─────────────────────────────────────────────── */
.page { max-width: 1120px; margin: 0 auto; padding: 30px 40px 60px; }
.page.wide { max-width: 1360px; }
.eyebrow { display: flex; align-items: center; gap: 7px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); font-weight: 500; margin-bottom: 6px; }
.eyebrow .sdot { background: var(--t1); width: 6px; height: 6px; }
.ph { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
.ph h2 { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.ph p { margin: 4px 0 0; color: var(--t3); font-size: 14px; }
.ph .grow { flex: 1; }
.ph .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }

.table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table th { text-align: left; font-weight: 500; color: var(--t4); font-size: 12px; padding: 8px 12px; border-bottom: 1px solid var(--b1); white-space: nowrap; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--b1); vertical-align: middle; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--hover); }
.table td .cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.table td .cell b { font-weight: 500; }
.table td small { color: var(--t4); font-size: 12px; display: block; }

.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
.tile { background: var(--l1); border: 1px solid var(--b1); border-radius: var(--r-lg); padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; transition: background .15s var(--ease), border-color .15s; }
.tile:hover { background: var(--l2); }
.tile h4 { margin: 0; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.tile p { margin: 0; color: var(--t3); font-size: 13px; line-height: 1.5; }
.tile .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; color: var(--t4); font-size: 12px; }
.tile .foot .grow { flex: 1; }
.tile.add { border-style: dashed; background: transparent; align-items: center; justify-content: center; color: var(--t3); min-height: 120px; }

.sect-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t3); font-weight: 500; margin: 26px 0 10px; }
.sect-title .grow { flex: 1; }

/* files */

      <div class="perm" style="padding-left:2px">${ic('brain')}<span class="grow">Use my personal memory in this chat<br><small class="dim">Off by default once a chat is shared</small></span><span class="toggle"></span></div>

      ${opt('private', 'Only me', 'Turns it into a personal folder')}

      ${Object.entries(roles).map(([k, r]) => `<div class="prow">${av(k, 'lg')}<span class="t">${name(k)}<small>${{ Owner: 'Full control, sharing', Editor: 'Chats, files, instructions', 'Can chat': 'Chats and files', Viewer: 'Read only' }[r]}</small></span><button class="sel">${r}${ic('chevd')}</button></div>`).join('')}

      <div class="perm" style="padding-left:2px">${ic('brain')}<span class="grow">kumiya may write to team memory from this folder<br><small class="dim">Always through the review queue</small></span><span class="toggle on"></span></div>
      <div class="perm" style="padding-left:2px">${ic('building')}<span class="grow">Share with Atlas Studio workspace (client)<br><small class="dim">Guests see chats you mark as client-visible</small></span><span class="toggle"></span></div>

      <div class="sep"></div>
      <a class="mi2" href="#/settings/members">${ic('gear')}<span class="t">Workspace settings<small>Members, roles, subscriptions, limits</small></span></a>
      <a class="mi2" href="#/settings/members">${ic('users')}<span class="t">Invite people</span></a>
      <button class="mi2" data-act="toast" data-msg="Create workspace">${ic('plus')}<span class="t">Create workspace<small>For a team, a client or a side project</small></span></button>
    </div>`;
  }
  function newChatMenu() {
    return `<div class="menu-scrim" data-act="close-menu"></div><div class="menu" style="left:16px;top:196px;width:260px">
      <a class="mi2" href="#/home" data-act="newscope-go" data-v="team">${ic('users')}<span class="t">Team chat<small>In a team folder · ⌘N</small></span></a>
      <a class="mi2" href="#/home" data-act="newscope-go" data-v="solo">${ic('lock')}<span class="t">Personal chat<small>Only you · ⇧⌘N</small></span></a>
      <div class="sep"></div>
      <button class="mi2" data-act="toast" data-msg="New folder">${ic('folderp')}<span class="t">New folder</span></button>
      <a class="mi2" href="#/apps">${ic('grid')}<span class="t">Build an app</span></a>
      <a class="mi2" href="#/scheduled">${ic('clock')}<span class="t">Schedule a task</span></a>

  /* ── page helpers ────────────────────────────────────────────── */
  const pageWrap = (head, body, wide) => `<div class="mhead"><button class="iconbtn mob-only" data-act="side-open">${ic('menu')}</button>${head || ''}<span class="grow"></span></div><div class="mbody"><div class="content"><div class="page ${wide ? 'wide' : ''}">${body}</div></div></div>`;
  const ph = (eyebrow, title, sub, acts) => `<div class="ph"><div>${eyebrow ? `<div class="eyebrow"><span class="sdot"></span>${eyebrow}</div>` : ''}<h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><span class="grow"></span><div class="acts">${acts || ''}</div></div>`;
  const seg = (key, val, opts) => `<div class="seg">${opts.map(([v, l, i]) => `<button class="${val === v ? 'on' : ''}" data-act="set" data-k="${key}" data-v="${v}">${i ? ic(i) : ''}${l}</button>`).join('')}</div>`;
  const scopeSeg = key => seg(key, S[key], [['all', 'All'], ['team', 'Team', 'users'], ['solo', 'Personal', 'lock']]);
  const byScope = (arr, key) => S[key] === 'all' ? arr : arr.filter(x => x.scope === S[key]);

  /* ── folder ──────────────────────────────────────────────────── */
  function folderView(r) {
    const f = folders.find(x => x.id === r.id) || folders[0];
    const team = f.scope === 'team';
    const fl = files.filter(x => x.where.startsWith(f.n));
    const head = `<span class="title" style="display:flex;align-items:center;gap:8px">${ic('folder')}${f.n}</span>${scopeTag(f.scope)}`;
    const body = `${ph(team ? 'Team folder' : 'Personal folder', f.n, team ? `${f.members.length} people · ${f.chats.length} chats · ${fl.length} files` : `Only you${f.sharedWith ? ' · shared with Lena Park (can view)' : ''} · ${f.chats.length} chats`,
      `${team ? stack(f.members, 5) : ''}<a class="btn" href="#/folder/${f.id}/share">${ic(team ? 'users' : 'share')}${team ? 'Access' : 'Share'}</a><a class="btn primary" href="#/home">${ic('plus')}New chat here</a>`)}
      <div class="detail"><div>
        <div class="sect-title" style="margin-top:0">Chats<span class="grow"></span><span class="dim" style="font-weight:400">${team ? 'Team chats · plus your personal ones here' : 'All private'}</span></div>
        <table class="table"><tbody>${f.chats.map(c => `<tr class="click" data-nav="#/chat/${c.id}"><td><div class="cell">${c.run ? '<span class="spin"></span>' : ic('msg')}<span><b>${c.n}</b><small>${team ? (c.id === 'atlas' ? 'Anna, Mark, Sofia, you · kumiya, Researcher, Support bot' : 'Anna, Sofia · kumiya') : 'You · kumiya'}</small></span></div></td><td class="dim" style="text-align:right">${c.t}</td></tr>`).join('')}
        ${team ? `<tr class="click" data-nav="#/chat/pricing-draft"><td><div class="cell">${ic('lock')}<span><b>My notes on launch copy</b><small>Personal chat inside a team folder · only you</small></span></div></td><td class="dim" style="text-align:right">2d</td></tr>` : ''}</tbody></table>
        <div class="sect-title">Files<span class="grow"></span><a href="#/files" style="font-weight:400;font-size:12.5px">Open in Files</a></div>
        <div class="grid g3">${(fl.length ? fl : files.filter(x => x.scope === f.scope).slice(0, 3)).slice(0, 6).map(fileTile).join('')}</div>
      </div>
      <aside style="display:flex;flex-direction:column;gap:10px">
        <section class="rcard"><div class="rcard-h"><span class="grow">Folder instructions</span><button class="iconbtn">${ic('edit')}</button></div><div style="padding:2px 10px 10px;font-size:13px;color:var(--t2);line-height:1.6">${team ? 'Atlas v2 launches on a Tuesday. Client contact is Ines at Atlas Studio. Use the brand-voice skill for anything public. Ask before emailing the client.' : 'Drafts for me. Keep it short. Lena reviews pricing work.'}</div></section>
        <section class="rcard"><div class="rcard-h"><span class="grow">${team ? 'Members' : 'Access'}</span><a class="iconbtn" href="#/folder/${f.id}/share">${ic('plus')}</a></div>
          ${team ? f.members.slice(0, 6).map(k => `<div class="ritem">${av(k)}<span class="t">${name(k)}</span><span class="r">${{ anna: 'Owner', ines: 'Viewer', dev: 'Can chat' }[k] || 'Editor'}</span></div>`).join('') : `<div class="ritem">${av('me')}<span class="t">You</span><span class="r">Owner</span></div><div class="ritem">${av('lena')}<span class="t">Lena Park</span><span class="r">Can view</span></div>`}</section>
        <section class="rcard"><div class="rcard-h"><span class="grow">Defaults</span></div><dl class="kv">
          <dt>Agents</dt><dd>${team ? 'Researcher, Copywriter' : 'Writing coach'}</dd>
          <dt>Connectors</dt><dd>${team ? 'Notion, Drive, Intercom' : 'Gmail (yours)'}</dd>
          <dt>Memory</dt><dd>${team ? '<span class="tag team">Team</span>' : '<span class="tag solo">Personal</span>'}</dd>
          <dt>Model</dt><dd>${team ? 'Auto · workspace rules' : 'Your ChatGPT Plus'}</dd></dl></section>
      </aside></div>`;
    return pageWrap(head, body) + (r.sub === 'share' ? shareFolderDialog() : '');
  }

  /* ── files ───────────────────────────────────────────────────── */
  function thumb(cat) {
    const c = (FT[cat] || [, '#888'])[1];
    if (cat === 'doc' || cat === 'code') return `<div class="thumb"><div class="lines"><i></i><i style="width:90%"></i><i style="width:80%"></i><i style="width:86%"></i><i style="width:60%"></i></div></div>`;
    if (cat === 'sheet') return `<div class="thumb" style="background-image:linear-gradient(var(--b2) 1px,transparent 1px),linear-gradient(90deg,var(--b2) 1px,transparent 1px);background-size:100% 18px,25% 100%"></div>`;
    if (cat === 'image') return `<div class="thumb" style="background:linear-gradient(160deg,${c}55,#2b3a6b 70%,#151517)"></div>`;
    if (cat === 'video') return `<div class="thumb" style="background:linear-gradient(160deg,#3a2a2a,#151517)"><span style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center">${ic('play')}</span></div>`;
    if (cat === 'site') return `<div class="thumb" style="display:block;padding:10px"><div style="height:6px;width:40%;background:var(--b3);border-radius:3px;margin-bottom:10px"></div><div style="height:12px;width:70%;background:var(--t5);border-radius:3px;margin-bottom:6px"></div><div style="height:6px;width:55%;background:var(--b3);border-radius:3px;margin-bottom:10px"></div><div style="height:14px;width:26%;background:${c};border-radius:4px"></div></div>`;
    if (cat === 'slides') return `<div class="thumb"><div style="width:62%;aspect-ratio:16/9;border-radius:4px;background:var(--l3);border:1px solid var(--b2);display:grid;place-items:center"><div style="width:50%;height:6px;background:${c};border-radius:3px"></div></div></div>`;
    return `<div class="thumb">${ic(FT[cat] ? FT[cat][0] : 'file')}</div>`;
  }
  function fileTile(f) {
    return `<button class="tile ftile" data-act="toast" data-msg="Preview ${esc(f.n)}">${thumb(f.cat)}<div class="meta"><b>${esc(f.n)}</b><small>${f.scope === 'team' ? ic('users') : ic('lock')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(f.where)}</span>${f.share.length ? stack(f.share, 3, 'sm') : '<span>Only you</span>'}</small></div></button>`;
  }
  function filesView() {
    const CATS = [['all', 'All'], ['doc', 'Docs & PDF'], ['sheet', 'Spreadsheets'], ['slides', 'Slides'], ['site', 'Websites'], ['image', 'Images'], ['video', 'Videos'], ['audio', 'Audio'], ['code', 'Code']];
    let list = byScope(files, 'fileScope');
    const count = k => k === 'all' ? list.length : list.filter(f => f.cat === k).length;
    const shown = S.fileCat === 'all' ? list : list.filter(f => f.cat === S.fileCat);
    const body = `${ph('Library', 'Files', 'Everything people, agents and bots created or added — apps live separately.', `<label class="search">${ic('search')}<input placeholder="Search files"></label>${seg('fileView', S.fileView, [['grid', '', 'grid'], ['list', '', 'list']])}<button class="btn primary">${ic('plus')}Upload</button>`)}
      <div class="toolbar">${scopeSeg('fileScope')}<span style="width:1px;height:20px;background:var(--b2)"></span><div class="chips">${CATS.map(([k, l]) => `<button class="chip ${S.fileCat === k ? 'on' : ''}" data-act="set" data-k="fileCat" data-v="${k}">${l}<span class="n">${count(k)}</span></button>`).join('')}</div></div>
      ${!shown.length ? `<div class="empty">${ic('archive')}<b>Nothing here yet</b>Files from your chats will appear here.<br><br><a class="btn" href="#/home">${ic('edit')}New chat</a></div>` :
        S.fileView === 'grid' ? `<div class="grid g4">${shown.map(fileTile).join('')}</div>` :
        `<table class="table"><thead><tr><th>Name</th><th>Scope</th><th>Owner</th><th>Shared with</th><th>Modified</th></tr></thead><tbody>${shown.map(f => `<tr class="click"><td><div class="cell">${fic(f.cat)}<span><b>${esc(f.n)}</b><small>${esc(f.where)}</small></span></div></td><td>${scopeTag(f.scope)}</td><td>${name(f.owner)}</td><td>${f.share.length ? stack(f.share, 4, 'sm') : '<span class="dim">Only you</span>'}</td><td class="dim">${f.age}</td></tr>`).join('')}</tbody></table>`}`;
    return pageWrap('<span class="title">Files</span>', body, true);
  }

  /* ── memory ──────────────────────────────────────────────────── */
  function memoryView() {
    const team = S.memScope === 'team';
    const list = team ? memory.team : memory.solo;
    const cats = ['All', 'People', 'Clients', 'Preferences', 'Processes', 'Decisions', 'Glossary'];
    const cnt = c => c === 'All' ? list.length : list.filter(m => m.cat === c).length;
    const shown = S.memCat === 'All' ? list : list.filter(m => m.cat === S.memCat);
    const item = (m, review) => `<div class="memitem">${review ? agi(m.by === 'kumiya' ? 'sparkles' : 'bot') : (m.by === 'me' ? av('me') : av(m.by))}<div class="mi"><p>${esc(m.t)}</p><small><span class="tag">${m.cat}</span>${review ? `Suggested by ${m.by} · from ${esc(m.from)}` : `Added by ${name(m.by)} · used ${m.used}`} · <a href="#/chat/atlas">${esc(m.src)}</a></small></div>
      ${review ? `<div style="display:flex;gap:6px;align-items:flex-start"><button class="btn sm primary" data-act="toast" data-msg="Added to team memory">Approve</button><button class="btn sm" data-act="toast" data-msg="Edit before saving">Edit</button><button class="btn sm ghost" data-act="toast" data-msg="Discarded">${ic('x')}</button></div>` : `<button class="iconbtn" data-act="toast" data-msg="Edit · Move to team/personal · Forget">${ic('more')}</button>`}</div>`;
    const body = `${ph('Library', 'Memory', team ? 'What kumiya, agents and bots know about Northwind. Nothing lands here without a human approving it.' : 'Only you and your personal chats see this. Never used in team chats unless you allow it per chat.',
      `${seg('memScope', S.memScope, [['team', 'Team', 'users'], ['solo', 'Personal', 'lock']])}<button class="btn primary">${ic('plus')}Add memory</button>`)}

        <label class="search" style="margin-bottom:6px">${ic('search')}<input placeholder="Search ${team ? 'team' : 'personal'} memory"></label>
        ${shown.map(m => item(m)).join('') || `<div class="empty">${ic('brain')}<b>No memories in ${S.memCat}</b></div>`}</div></div>`;
    return pageWrap('<span class="title">Memory</span>', body);
  }

  /* ── agents & skills ─────────────────────────────────────────── */
  function agentsView(r) {
    if (r.id) return agentDetail(r.id);
    const tabs = `<div class="tabs" style="padding:0;margin-bottom:18px"><a class="tab on" href="#/agents">Agents <span class="n">${agents.length}</span></a><a class="tab" href="#/skills">Skills <span class="n">${skills.length}</span></a></div>`;
    const list = byScope(agents, 'agScope');
    const body = `${ph('Library', 'Agents & skills', 'Agents are configurable workers you @ into any chat. Skills are reusable know-how any agent or bot can use.', `<button class="btn primary">${ic('plus')}New agent</button>`)}

      <div class="grid g3">
        <div class="tile">${kag('lg')}<h4>kumiya <span class="tag">Built-in</span></h4><p>Orchestrator in every chat. Picks agents, splits work into subagents, asks before anything leaves the workspace.</p><div class="foot">Auto model routing<span class="grow"></span>every chat</div></div>
        ${list.map(a => `<a class="tile" href="#/agents/${a.id}" style="color:inherit">${agi(a.ic, '', 'lg')}<h4>${a.n} ${scopeTag(a.scope)}</h4><p>${a.d}</p><div class="foot">${av(a.owner, 'sm')}${name(a.owner)}<span class="grow"></span>${a.model} · ${a.chats} chats</div></a>`).join('')}
        <button class="tile add">${ic('plus')}Describe an agent in a chat — kumiya drafts it</button></div>`;
    return pageWrap('<span class="title">Agents & skills</span>', body);
  }
  function skillsView() {
    const tabs = `<div class="tabs" style="padding:0;margin-bottom:18px"><a class="tab" href="#/agents">Agents <span class="n">${agents.length}</span></a><a class="tab on" href="#/skills">Skills <span class="n">${skills.length}</span></a></div>`;
    const list = byScope(skills, 'agScope');
    const body = `${ph('Library', 'Agents & skills', 'Skills are versioned instructions + scripts. Type / in any chat to use one.', `<button class="btn">${ic('ext')}Import</button><button class="btn primary">${ic('plus')}New skill</button>`)}

      <table class="table"><thead><tr><th>Skill</th><th>Scope</th><th>Used by</th><th>Owner</th><th>Runs · 30d</th><th>Version</th></tr></thead><tbody>
      ${list.map(s => `<tr class="click"><td><div class="cell">${agi('wand')}<span><b>${s.n}</b> <span class="mono dim" style="font-size:12px">/${s.id}</span><small>${s.d}</small></span></div></td><td>${scopeTag(s.scope)}</td><td class="muted">${s.used.join(', ')}</td><td>${name(s.owner)}</td><td>${s.runs}</td><td class="mono dim">v${s.v}</td></tr>`).join('')}</tbody></table>`;
    return pageWrap('<span class="title">Agents & skills</span>', body);
  }
  function agentDetail(id) {
    const a = agents.find(x => x.id === id) || agents[0];
    const body = `<a href="#/agents" class="dim" style="font-size:13px;display:inline-flex;gap:4px;align-items:center;margin-bottom:14px">${ic('chevr').replace('class="i ', 'class="i " style="transform:rotate(180deg)" ')}Agents</a>
      <div class="ph" style="align-items:center">${agi(a.ic, '', 'xl')}<div><h2 style="display:flex;gap:10px;align-items:center">${a.n} ${scopeTag(a.scope)}</h2><p>${a.d}</p></div><span class="grow"></span><div class="acts"><button class="btn">${ic('history')}Runs</button><button class="btn">${ic('edit')}Edit</button><a class="btn primary" href="#/home">${ic('msg')}Chat with ${a.n}</a></div></div>
      <div class="detail"><div>
        <div class="field"><label>Instructions</label><div class="box">You research for the Northwind team. Split large asks into parallel subagents (max 4). Cite every claim with a source link or file. Prefer team memory over guessing. Never contact clients; hand drafts back to the chat.</div></div>
        <div class="field"><label>Skills</label><div style="display:flex;gap:6px;flex-wrap:wrap">${a.skills.map(s => `<span class="tag">${ic('wand')}/${s}</span>`).join('')}<button class="btn sm ghost">${ic('plus')}Add</button></div></div>
        <div class="field"><label>Subagents it can spawn</label><div class="card tree" style="padding:6px">
          <div class="node">${agi('search')}<b style="font-weight:500">${a.n}</b><small>orchestrates</small></div>
          <div class="kids"><div class="node">${ic('globe')}Market scan<small>web.search, web.fetch</small></div><div class="node">${ic('audio')}Interview synthesis<small>files.read · skill</small></div><div class="node">${ic('db')}Numbers<small>notion.query, stripe.read</small></div><div class="node">${ic('doc')}Writer<small>file.write</small></div></div></div></div>
        <div class="field"><label>Recent runs</label><table class="table"><tbody>
          ${[['Atlas v2 launch plan', 'anna', '4m 12s', 'ok'], ['Competitor watch — daily', 'Scheduled', '1m 03s', 'ok'], ['Pricing experiments', 'dev', '2m 40s', 'ok'], ['Press kit & announcement', 'sofia', '58s', 'warn']].map(([c, w, d, s]) => `<tr class="click" data-nav="#/chat/atlas/activity"><td><div class="cell">${ic(s === 'ok' ? 'checkc' : 'alert', s)}<b>${c}</b></div></td><td class="muted">${P[w] ? name(w) : w}</td><td class="mono dim">${d}</td></tr>`).join('')}</tbody></table></div>
      </div>

    if (sec === 'models') {
      main = `${ph('', 'Subscriptions & models', 'One layer over every subscription the team already pays for. kumiya routes each run to the right one and shows who pays.', `<button class="btn primary">${ic('plus')}Connect subscription</button>`)}
        <div class="grid g2">${subs.map(s => `<div class="sub-card"><div class="top"><span class="logo" style="width:32px;height:32px;border-radius:9px;background:${s.c};color:#fff;display:grid;place-items:center;font-weight:700">${s.l}</span><span style="flex:1"><b>${s.n}</b><br><small class="dim">${s.who}</small></span>${s.pays === 'me' ? '<span class="tag solo">' + ic('lock') + 'Personal</span>' : s.pays === 'member' ? '<span class="tag violet">Shared by member</span>' : '<span class="tag team">' + ic('users') + 'Team</span>'}</div>
          <div class="meter"><i style="width:${s.use}%;background:${s.use > 55 ? 'var(--amber)' : 'var(--accent-2)'}"></i></div><div class="row2"><span>${s.models}</span><span>${s.use}% · ${s.note}</span></div></div>`).join('')}</div>
        <div class="sect-title">Routing rules<span class="grow"></span><button class="btn sm">${ic('plus')}Rule</button></div>
        ${[['Research, long documents, planning', 'Claude Opus 4.5', 'Claude Team'], ['Bulk jobs, bots, scheduled tasks', 'DeepSeek V4', 'DeepSeek API pool'], ['Images and edits', 'GPT Image', 'ChatGPT Business'], ['When a subscription hits its cap', 'Next cheapest that fits', 'Fallback chain']].map(([a, b, c]) => `<div class="route">${ic('route')}<span class="grow">${a}</span><span class="arrow">${ic('arrow')}</span><b style="font-weight:500">${b}</b><span class="tag">${c}</span></div>`).join('')}
        <div class="sect-title">Personal subscriptions</div>
        <div class="card" style="padding:4px 12px"><div class="perm">${ic('lock')}<span class="grow">Members can connect personal subscriptions<br><small class="dim">Used only in their personal chats</small></span><span class="toggle on"></span></div><div class="perm">${ic('users')}<span class="grow">Members may share a personal subscription with the team<br><small class="dim">They set the cap — like Anna’s Google AI Pro at 50%</small></span><span class="toggle on"></span></div><div class="perm">${ic('card')}<span class="grow">Team pool monthly limit</span><b style="font-weight:500">$200</b></div></div>`;
    } else {
      const mem = [['anna', 'Owner', 'Full', 'Claude Team, ChatGPT Business'], ['me', 'Admin', 'Full', 'Claude Team, ChatGPT Plus (own)'], ['mark', 'Member', 'Full', 'Claude Team'], ['sofia', 'Member', 'Full', 'Claude Team, ChatGPT Business'], ['dev', 'Member', 'Full', 'ChatGPT Business'], ['ines', 'Member', 'Full', 'Team pool'], ['lena', 'Member', 'Full', 'Team pool'], ['tom', 'Guest', 'Atlas launch only', 'Team pool · capped']];
      main = `${ph('', 'Members & roles', '9 members · 8 seats used. Agents and bots never take a seat.', `<button class="btn">${ic('link')}Invite link</button><button class="btn primary">${ic('plus')}Invite</button>`)}
        <table class="table"><thead><tr><th>Person</th><th>Role</th><th>Access</th><th>Models available</th><th></th></tr></thead><tbody>
        ${mem.map(([k, role, acc, m]) => `<tr><td><div class="cell">${av(k, 'lg')}<span><b>${P[k].n}${k === 'me' ? ' (you)' : ''}</b><small>${P[k].n.split(' ')[0].toLowerCase()}@northwind.example</small></span></div></td><td><button class="btn sm ghost">${role}${ic('chevd')}</button></td><td class="muted">${acc}</td><td class="muted">${m}</td><td>${ic('more')}</td></tr>`).join('')}
        <tr><td><div class="cell">${agi('bot', 'bot', 'lg')}<span><b>4 bots · 5 agents</b><small>Free · run under their owner’s permissions</small></span></div></td><td class="dim">Service</td><td class="muted">Per bot</td><td class="muted">Routing rules</td><td></td></tr></tbody></table>
        <div class="sect-title">Roles</div><div class="grid g4">${[['Owner', 'Billing, subscriptions, delete workspace'], ['Admin', 'Members, apps, connectors, policies'], ['Member', 'Team folders they’re in, own personal space'], ['Guest', 'Only shared folders and chats; can’t see team memory']].map(([n, d]) => `<div class="tile"><h4>${n}</h4><p>${d}</p></div>`).join('')}</div>`;
    }
    return pageWrap('<span class="title">Settings · Northwind Labs</span>', `<div class="set-layout">${vnav}<div>${main}</div></div>`);
  }

  function searchView() {
    return pageWrap('<span class="title">Search</span>', `${ph('', 'Search', 'Chats, files, memory, agents and people across Northwind and your personal space.')}<label class="search" style="height:44px;font-size:15px;margin-bottom:18px">${ic('search')}<input placeholder="Search everything…" value="atlas launch"></label>
      <div class="toolbar">${seg('fileScope', S.fileScope, [['all', 'All'], ['team', 'Team', 'users'], ['solo', 'Personal', 'lock']])}</div>
      <div class="sect-title" style="margin-top:0">Chats</div><table class="table"><tbody><tr class="click" data-nav="#/chat/atlas"><td><div class="cell">${ic('msg')}<span><b>Atlas v2 launch plan</b><small>Atlas launch · Anna, Mark, Sofia, you</small></span></div></td><td class="dim">now</td></tr><tr class="click" data-nav="#/folder/atlas"><td><div class="cell">${ic('folder')}<span><b>Atlas launch</b><small>Team folder · 6 people</small></span></div></td><td class="dim">folder</td></tr></tbody></table>
      <div class="sect-title">Files</div><div class="grid g4">${files.slice(0, 4).map(fileTile).join('')}</div>
      <div class="sect-title">Memory</div>${memory.team.slice(0, 2).map(m => `<div class="memitem">${av(m.by)}<div class="mi"><p>${m.t}</p><small><span class="tag">${m.cat}</span>Team memory</small></div></div>`).join('')}`);
  }

  /* ── main render ─────────────────────────────────────────────── */
  function mainView(r) {
    switch (r.v) {
      case 'chat': return chatView(r) + (r.sub === 'share' ? shareChatDialog(r) : '');
      case 'folder': return folderView(r);
      case 'app': return r.id === 'crm' ? crmView() : boardView();
      case 'apps': return appsDir();
      case 'files': return filesView();
      case 'memory': return memoryView();
      case 'agents': return agentsView(r);
      case 'skills': return skillsView();
      case 'bots': return botsView(r);
      case 'scheduled': return scheduledView();
      case 'connectors': return connectorsView();
      case 'settings': return settingsView(r);
      case 'search': return searchView();
      default: return home(r);
    }
  }

  let lastHash = '';
  function render() {
    const r = route();
    document.body.classList.toggle('light', S.theme === 'light');
    const prevScroll = document.querySelector('.content') ? document.querySelector('.content').scrollTop : 0;
    const same = lastHash === r.hash;
    const wsOpen = r.v === 'home' && r.id === 'ws';
    document.getElementById('app').innerHTML = `<div class="stage">${scenebar(r)}<div class="window ${S.sideOpen ? 'side-open' : ''}">${sidebar(r)}<main class="main">${mainView(r)}</main>${(menu === 'ws' || wsOpen) ? wsMenu() : ''}${menu === 'newchat' ? newChatMenu() : ''}</div></div>`;
    const c = document.querySelector('.content');
    if (c) { if (same) c.scrollTop = prevScroll; else if (c.dataset.scroll === 'bottom' && r.sub !== 'mention' && r.sub !== 'model' && r.sub !== 'share') c.scrollTop = c.scrollHeight; else if (c.dataset.scroll === 'bottom') c.scrollTop = c.scrollHeight; }
    const pill = document.querySelector('.pill.on'); if (pill && !same) pill.scrollIntoView({ block: 'nearest', inline: 'center' });
    if (r.sub === 'mention') { const t = document.querySelector('[data-composer]'); if (t) { t.focus(); t.setSelectionRange(1, 1); } }
    lastHash = r.hash;
    bindBoard();
  }

  /* ── board drag & drop ───────────────────────────────────────── */
  function bindBoard() {
    let drag = null;
    document.querySelectorAll('.kcard').forEach(el => {
      el.addEventListener('dragstart', e => { drag = { col: el.dataset.col, i: +el.dataset.i }; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'card'); });
      el.addEventListener('dragend', () => el.classList.remove('drag'));
    });
    document.querySelectorAll('[data-drop]').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over'); if (!drag) return;
        const B = JSON.parse(JSON.stringify(S.board || BOARD0));
        const [card] = B[drag.col].splice(drag.i, 1);
        const to = col.dataset.drop;
        const after = [...col.querySelectorAll('.kcard')].filter(k => { const r = k.getBoundingClientRect(); return e.clientY > r.top + r.height / 2; }).length;
        let idx = after; if (to === drag.col && drag.i < after) idx = after - 1;
        B[to].splice(Math.max(0, idx), 0, card);
        S.board = B; persist(); drag = null; render(); toast(`Moved to ${to}`);
      });
    });
  }

  /* ── events ──────────────────────────────────────────────────── */
  let toastT;
  function toast(msg) { clearTimeout(toastT); let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; toastT = setTimeout(() => t.remove(), 2200); }
  const go = h => { if (location.hash === h) render(); else location.hash = h; };

  document.addEventListener('click', e => {
    const stop = e.target.closest('[data-stop]');
    const navEl = e.target.closest('[data-nav]');
    if (navEl && !(stop && navEl.classList.contains('scrim'))) { if (navEl.classList.contains('scrim') && e.target !== navEl) return; e.preventDefault(); go(navEl.dataset.nav); return; }
    if (S.sideOpen && !e.target.closest('.sidebar') && !e.target.closest('[data-act="side-open"]')) { S.sideOpen = false; render(); return; }
    const tg = e.target.closest('.toggle'); if (tg) { tg.classList.toggle('on'); return; }
    const a = e.target.closest('[data-act]');
    if (e.target.closest('a[href^="#"]') && !a) { menu = null; S.sideOpen = false; return; }
    if (!a) return;
    const act = a.dataset.act, v = a.dataset.v;
    switch (act) {
      case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; break;
      case 'panel': S.panel = !S.panel; break;
      case 'newscope': S.newScope = v; break;
      case 'newscope-go': S.newScope = v; menu = null; break;
      case 'set': S[a.dataset.k] = v; break;
      case 'tsec': S.collapsed[a.dataset.id] = !S.collapsed[a.dataset.id]; break;
      case 'tfolder': S.openFolders[a.dataset.id] = !S.openFolders[a.dataset.id]; break;
      case 'rtoggle': S.rcollapsed[a.dataset.id] = !S.rcollapsed[a.dataset.id]; break;
      case 'share-access': S.shareAccess = v; break;
      case 'folder-access': S.folderAccess = v; break;
      case 'ws-menu': menu = menu === 'ws' ? null : 'ws'; break;
      case 'newchat-menu': menu = menu === 'newchat' ? null : 'newchat'; break;
      case 'close-menu': menu = null; if (route().id === 'ws') { location.hash = '#/home'; return; } break;
      case 'side-open': S.sideOpen = true; break;
      case 'side-close': S.sideOpen = false; toast('Sidebar collapses to a rail in the real app'); break;
      case 'board-reset': S.board = null; toast('Board reset'); break;
      case 'mention-open': { const r = route(); go(r.v === 'chat' ? `#/chat/${r.id}/mention` : '#/chat/atlas/mention'); return; }
      case 'model-open': { const r = route(); go(r.v === 'chat' ? `#/chat/${r.id}/model` : '#/chat/atlas/model'); return; }
      case 'send': toast('Prototype: messages are not sent — sample conversation only'); return;
      case 'prev': case 'next': { const i = FLAT.indexOf(route().hash); const n = act === 'next' ? (i + 1) % FLAT.length : (i - 1 + FLAT.length) % FLAT.length; go(FLAT[i < 0 ? 0 : n]); return; }
      case 'toast': toast(a.dataset.msg || 'Prototype'); return;
      default: return;
    }
    e.preventDefault(); persist(); render();
  });
  document.addEventListener('input', e => {
    if (e.target.matches('[data-composer]') && e.target.value.endsWith('@')) { const r = route(); if (r.v === 'chat' && r.sub !== 'mention') go(`#/chat/${r.id}/mention`); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === ']' || e.key === '[') { document.querySelector(`[data-act="${e.key === ']' ? 'next' : 'prev'}"]`).click(); }
    if (e.key === 'Escape') { const r = route(); menu = null; if (['share', 'mention', 'model'].includes(r.sub)) go(`#/${r.v}/${r.id}`); else if (r.id === 'ws') go('#/home'); else render(); }
    if (/^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey) go(FLAT[+e.key - 1]);
  });
  window.addEventListener('hashchange', () => { menu = null; S.sideOpen = false; render(); });
  render();
})();
</script>
</body>
</html>
