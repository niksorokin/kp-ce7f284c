<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Lead qualifier — Scout">
  <style>
    .sm{display:none}
    @media (max-width:32px){.d{display:none}.sm{display:inline}.lg{display:none}}
    @media (max-width:56px){.xl{display:none}}
  </style>
  <defs>
    <clipPath id="c"><circle cx="48" cy="48" r="48"/></clipPath>
    <radialGradient id="bg" cx="30%" cy="22%" r="90%">
      <stop offset="0" stop-color="#FFF8EE"/><stop offset="1" stop-color="#F8D6AE"/>
    </radialGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FDBA74"/><stop offset=".5" stop-color="#F06A1D"/><stop offset="1" stop-color="#B83A0E"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  <radialGradient id="iris" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#7A3A12"/><stop offset=".6" stop-color="#3A1A0A"/><stop offset="1" stop-color="#1E0D05"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="96" height="96" fill="url(#bg)"/>
    <ellipse cx="48" cy="93" rx="28" ry="6" fill="#7C2D12" opacity=".14"/>
    <!-- ears -->
    <path d="M20 46 L23.5 15 Q25 10.5 29 13 L47 31 Z" fill="url(#body)" stroke="#E8641F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M76 46 L72.5 15 Q71 10.5 67 13 L49 31 Z" fill="url(#body)" stroke="#E8641F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M26.5 38 L27.5 20 L40 31.5 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="2" stroke-linejoin="round"/>
    <path d="M69.5 38 L68.5 20 L56 31.5 Z" fill="#FFE2C7" stroke="#FFE2C7" stroke-width="2" stroke-linejoin="round"/>
    <!-- head with cheek fluff -->
    <path d="M14 60 Q16 30 48 28 Q80 30 82 60 Q80 64 76 66 Q72 80 60 88 Q54 92 48 92 Q42 92 36 88 Q24 80 20 66 Q16 64 14 60 Z" fill="url(#body)"/>
    <ellipse cx="34" cy="41" rx="14" ry="8" fill="url(#shine)"/>
    <!-- muzzle -->
    <path d="M24 64 Q36 56 48 66 Q60 56 72 64 Q68 84 48 92 Q28 84 24 64 Z" fill="#FFF6EC"/>
    <!-- sharp, assessing eyes -->
    <g class="lg">
      <ellipse cx="37" cy="53" rx="5.4" ry="6" transform="rotate(-12 37 53)" fill="url(#iris)"/>
      <ellipse cx="59" cy="53" rx="5.4" ry="6" transform="rotate(12 59 53)" fill="url(#iris)"/>
      <circle cx="38.8" cy="50.8" r="1.9" fill="#fff"/><circle cx="60.8" cy="50.8" r="1.9" fill="#fff"/>
    </g>
    <g class="sm" fill="#2A160C"><ellipse cx="37" cy="53" rx="5.6" ry="4.6"/><ellipse cx="59" cy="53" rx="5.6" ry="4.6"/></g>
    <path class="d" d="M30 44.5 Q36 41 43 43.5" fill="none" stroke="#8A2C0A" stroke-width="2.2" stroke-linecap="round"/>
    <path class="d" d="M53 43.5 Q60 41 66 44.5" fill="none" stroke="#8A2C0A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- monocle: the one who scores -->
    <circle class="xl" cx="59" cy="52.5" r="9.2" fill="#fff" fill-opacity=".14" stroke="#F4C04E" stroke-width="2.2"/>
    <path class="xl" d="M66.5 58 Q72 67 67.5 76" fill="none" stroke="#F4C04E" stroke-width="1.3" stroke-linecap="round"/>
    <!-- nose + mouth -->
    <ellipse cx="48" cy="69" rx="4.6" ry="3.4" fill="#2A160C"/>
    <ellipse class="d" cx="46.6" cy="67.9" rx="1.4" ry=".8" fill="#fff" opacity=".6"/>
    <path class="d" d="M42.5 74.5 Q48 79.5 53.5 74.5" fill="none" stroke="#2A160C" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="48" cy="48" r="47.4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>
</svg>
