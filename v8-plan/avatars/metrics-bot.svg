<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Metrics bot — Tally">
  <style>
    .sm{display:none}
    @media (max-width:32px){.d{display:none}.sm{display:inline}.lg{display:none}}
    @media (max-width:56px){.xl{display:none}}
  </style>
  <defs>
    <clipPath id="c"><circle cx="48" cy="48" r="48"/></clipPath>
    <radialGradient id="bg" cx="32%" cy="22%" r="90%">
      <stop offset="0" stop-color="#F5F5FF"/><stop offset="1" stop-color="#C6C8FB"/>
    </radialGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8F88FF"/><stop offset=".55" stop-color="#5546E8"/><stop offset="1" stop-color="#3424B0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#99F6E4"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="38%" r="62%">
      <stop offset=".72" stop-color="#1E1470" stop-opacity="0"/><stop offset="1" stop-color="#1E1470" stop-opacity=".35"/>
    </radialGradient>
  <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#4B3FD6"/><stop offset=".6" stop-color="#1E1866"/><stop offset="1" stop-color="#0E0B2C"/>
    </radialGradient>
    <radialGradient id="bounce" cx="70%" cy="100%" r="60%">
      <stop offset="0" stop-color="#B8B2FF" stop-opacity=".55"/><stop offset="1" stop-color="#B8B2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="96" height="96" fill="url(#bg)"/>
    <ellipse cx="48" cy="93" rx="30" ry="6" fill="#2A2380" opacity=".16"/>
    <!-- chart crest: three rising bars -->
    <rect x="31" y="22" width="9" height="18" rx="4.5" fill="url(#bar)"/>
    <rect x="43.5" y="14" width="9" height="26" rx="4.5" fill="url(#bar)"/>
    <rect x="56" y="6" width="9" height="34" rx="4.5" fill="url(#bar)"/>
    <rect class="d" x="58" y="8.5" width="2.6" height="10" rx="1.3" fill="#fff" opacity=".7"/>
    <!-- body -->
    <rect x="13" y="30" width="70" height="70" rx="32" fill="url(#body)"/>
    <rect x="13" y="30" width="70" height="70" rx="32" fill="url(#rim)"/>
    <rect x="13" y="30" width="70" height="70" rx="32" fill="url(#bounce)"/>
    <ellipse cx="33" cy="43" rx="17" ry="10" fill="url(#shine)"/>
    <!-- eyes: looking up-right at the numbers -->
    <g class="lg">
      <ellipse cx="36" cy="57" rx="8.2" ry="9.2" fill="#fff"/>
      <ellipse cx="60" cy="57" rx="8.2" ry="9.2" fill="#fff"/>
      <circle cx="38.8" cy="54.6" r="5" fill="url(#iris)"/>
      <circle cx="62.8" cy="54.6" r="5" fill="url(#iris)"/>
      <circle cx="40.6" cy="52.6" r="1.8" fill="#fff"/><circle class="xl" cx="37.4" cy="56.4" r=".8" fill="#fff" opacity=".7"/>
      <circle cx="64.6" cy="52.6" r="1.8" fill="#fff"/><circle class="xl" cx="61.4" cy="56.4" r=".8" fill="#fff" opacity=".7"/>
    </g>
    <g class="sm">
      <ellipse cx="36" cy="57" rx="9" ry="10" fill="#fff"/>
      <ellipse cx="60" cy="57" rx="9" ry="10" fill="#fff"/>
      <circle cx="38.5" cy="55" r="5.6" fill="#15123A"/>
      <circle cx="62.5" cy="55" r="5.6" fill="#15123A"/>
    </g>
    <!-- one raised brow, dry smirk -->
    <path class="d" d="M29 43.5 Q35.5 41.8 42 43.6" fill="none" stroke="#221A78" stroke-width="2.6" stroke-linecap="round"/>
    <path class="d" d="M53.5 41 Q60.5 36.2 67.5 39.6" fill="none" stroke="#221A78" stroke-width="2.6" stroke-linecap="round"/>
    <path class="d" d="M42 73 Q49 77.2 56.5 71.6" fill="none" stroke="#1A1450" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse class="d" cx="26" cy="69" rx="5" ry="3" fill="#FF8FC0" opacity=".38"/>
    <ellipse class="d" cx="70" cy="69" rx="5" ry="3" fill="#FF8FC0" opacity=".38"/>
  </g>
  <circle cx="48" cy="48" r="47.4" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>
</svg>
