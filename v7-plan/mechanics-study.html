<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kumiya v7 — mechanics study (overlay · split · sidebar)</title>
<style>
:root{
  --font: Inter, -apple-system, "SF Pro Text", "Segoe UI", "Liberation Sans", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "DejaVu Sans Mono", monospace;
  --bg:#e9eaf0;
  --frame: linear-gradient(155deg,#c7d2f6 0%,#d4d0f1 48%,#e6d6ec 100%);
  --frame-ink:#1d2246; --frame-sub:rgba(29,34,70,.58); --frame-hover:rgba(255,255,255,.42); --frame-sel:rgba(255,255,255,.78);
  --sheet:#fff; --sheet-2:#f5f5f8; --sheet-3:#ececf1;
  --line:rgba(22,24,44,.085); --line-2:rgba(22,24,44,.14);
  --t1:#1b1c22; --t2:#4a4b56; --t3:#7b7c88; --t4:#a7a8b2;
  --hover:rgba(22,24,44,.045); --sel:rgba(22,24,44,.075);
  --accent:#3a5bcc; --accent-soft:#e9eefc; --accent-ink:#2b45a3;
  --green:#2f9461; --amber:#c4820c; --amber-soft:#fbf3df; --amber-ink:#8a5a06; --red:#d2453d;
  --sh-sheet:0 0 0 1px rgba(22,24,44,.05),0 1px 2px rgba(22,24,44,.05),0 8px 22px rgba(22,24,44,.05);
  --sh-pop:0 0 0 1px rgba(22,24,44,.08),0 14px 40px rgba(22,24,44,.18),0 2px 6px rgba(22,24,44,.06);
  --sh-win:0 24px 70px rgba(30,40,90,.22),0 0 0 1px rgba(255,255,255,.4);
  --kbd-bg:var(--sheet-2); --scrim:rgba(20,22,40,.18);
  --ov-w:344px;
}
[data-theme=dark]{
  --bg:#111216;
  --frame: linear-gradient(155deg,#232c52 0%,#2a2648 50%,#33263f 100%);
  --frame-ink:#e8e9f3; --frame-sub:rgba(232,233,243,.55); --frame-hover:rgba(255,255,255,.07); --frame-sel:rgba(255,255,255,.13);
  --sheet:#1f2026; --sheet-2:#282930; --sheet-3:#30313a;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13);
  --t1:#ececf1; --t2:#b6b7c1; --t3:#878894; --t4:#5f606b;
  --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.08);
  --accent:#7d97ef; --accent-soft:rgba(125,151,239,.16); --accent-ink:#a9bcf6;
  --amber-soft:rgba(196,130,12,.16); --amber-ink:#e3b25a;
  --sh-sheet:0 0 0 1px rgba(255,255,255,.05),0 8px 22px rgba(0,0,0,.25);
  --sh-pop:0 0 0 1px rgba(255,255,255,.09),0 16px 44px rgba(0,0,0,.5);
  --sh-win:0 24px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13.5px/1.45 var(--font);color:var(--t1);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;border:1px solid var(--line-2);background:var(--kbd-bg);color:var(--t3);font-size:11px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.02em;white-space:nowrap}
.mut{color:var(--t3)} .mut2{color:var(--t4)}

/* scenario pills (prototype chrome) */
#pills{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
#pills .brand{font-weight:650;letter-spacing:-.01em;margin-right:6px;display:flex;gap:6px;align-items:center}
#pills .brand small{font-weight:500;color:var(--t3)}
.pill{flex:none;height:26px;padding:0 9px 0 4px;border-radius:13px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.6);color:#1b2242;font-size:12.5px;box-shadow:0 0 0 1px rgba(22,24,44,.06)}
[data-theme=dark] .pill{background:rgba(255,255,255,.07);color:var(--t2)}
.pill b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:9px;background:rgba(22,24,44,.07);font-size:10.5px;font-weight:600}
.pill.on{background:#1b1c22;color:#fff} .pill.on b{background:rgba(255,255,255,.18)}
[data-theme=dark] .pill.on{background:#e8e9f3;color:#111}
#hash{font:11.5px var(--mono);color:var(--frame-sub);margin-left:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--frame-hover);padding:4px 8px;border-radius:7px;max-width:520px}

/* window = Arc frame */
#frame{position:absolute;top:40px;left:8px;right:8px;bottom:8px;border-radius:14px;background:var(--frame);box-shadow:var(--sh-win);display:flex;flex-direction:column;overflow:hidden;transition:inset .25s}
#strip{height:40px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 14px;color:var(--frame-ink)}
.lights{display:flex;gap:7px;margin-right:10px}.lights i{width:12px;height:12px;border-radius:6px;background:#ee6a5f}.lights i:nth-child(2){background:#f5bd4f}.lights i:nth-child(3){background:#61c454}
.ib{height:28px;min-width:28px;padding:0 6px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--frame-ink);position:relative}
.ib:hover{background:var(--frame-hover)} .ib.on{background:var(--frame-sel)}
.ib .kbd{background:transparent;border-color:rgba(29,34,70,.18);color:var(--frame-sub)}
[data-theme=dark] .ib .kbd{border-color:rgba(255,255,255,.16)}
#strip .sp{flex:1}
#strip .where{font-size:12.5px;color:var(--frame-sub);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#body{flex:1;display:flex;min-height:0;position:relative}

/* sidebar */
#sb{width:236px;flex:none;display:flex;flex-direction:column;padding:2px 8px 10px 10px;color:var(--frame-ink);transition:margin-left .28s cubic-bezier(.3,1.25,.4,1),opacity .2s;overflow:hidden}
body.sb-off #sb{margin-left:-236px;opacity:0;pointer-events:none}
body.sb-off.sb-peek #sb{position:absolute;z-index:40;top:0;bottom:8px;left:6px;margin-left:0;opacity:1;pointer-events:auto;border-radius:12px;background:var(--frame);box-shadow:var(--sh-pop);padding-top:10px}
#edge{position:absolute;left:0;top:0;bottom:0;width:10px;z-index:39;display:none}
body.sb-off #edge{display:block}
.search{position:relative;height:32px;border-radius:9px;background:var(--frame-hover);display:flex;align-items:center;gap:8px;padding:0 8px;color:var(--frame-sub);margin-bottom:10px;width:100%;text-align:left}
.search:hover{background:var(--frame-sel)}
.search>span:not(.kbd){flex:1;white-space:nowrap}
.search .kbd{background:transparent;border-color:rgba(29,34,70,.16);color:var(--frame-sub)}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.fav{height:40px;border-radius:9px;background:var(--frame-hover);display:grid;place-items:center;color:var(--frame-ink);position:relative}
.fav:hover,.fav.on{background:var(--frame-sel)}
.grp{font-size:11.5px;font-weight:600;color:var(--frame-sub);padding:10px 8px 4px;display:flex;justify-content:space-between;letter-spacing:.01em}
.row{height:30px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;width:100%;text-align:left;color:var(--frame-ink);white-space:nowrap;user-select:none;position:relative}
.row:hover{background:var(--frame-hover)} .row.on{background:var(--frame-sel);font-weight:550}
.row .cnt{margin-left:auto;font-size:11.5px;color:var(--frame-sub);font-variant-numeric:tabular-nums}
.row .open-dot{margin-left:auto;width:6px;height:6px;border-radius:3px;background:var(--accent)}
.row .beside{margin-left:auto;opacity:0;color:var(--frame-sub)} .row:hover .beside{opacity:1}
.row .open-dot + .beside{margin-left:6px}
.sb-scroll{flex:1;overflow:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.spaces{display:flex;gap:6px;align-items:center;padding-top:8px;border-top:1px solid rgba(29,34,70,.08)}
.spaces i{width:8px;height:8px;border-radius:4px;background:var(--frame-sub);opacity:.4}.spaces i.on{opacity:1;background:var(--frame-ink)}
.spaces span{font-size:12px;color:var(--frame-sub);margin-right:auto}
.sbtip{font-size:11.5px;color:var(--frame-sub);padding:6px 8px 0;line-height:1.4}

/* content + panes */
#content{flex:1;min-width:0;position:relative;padding:0 8px 8px 0;transition:padding .2s}
body.sb-off #content{padding-left:8px}
#panes{height:100%;display:flex;gap:8px;transition:padding-right .26s cubic-bezier(.3,1.1,.4,1)}
body.pinned #panes{padding-right:calc(var(--ov-w) + 8px)}
.pane{flex:1 1 0;min-width:0;background:var(--sheet);border-radius:11px;box-shadow:var(--sh-sheet);display:flex;flex-direction:column;overflow:hidden;container-type:inline-size;position:relative;outline:1.5px solid transparent;outline-offset:0;transition:outline-color .15s}
.multi .pane.focus{outline-color:var(--accent)}
.pane.zoomed-out{display:none}
.ph{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid transparent}
.ph .crumb{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;cursor:grab}
.ph .crumb .c1{color:var(--t3)} .ph .crumb .c2{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.multi .pane:not(.focus) .ph .c2{color:var(--t2);font-weight:550}
.ph .sp{flex:1}
.pbtn{height:28px;min-width:28px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--t2);position:relative}
.pbtn:hover{background:var(--hover)}
.pbtn.ghost{opacity:0;transition:opacity .12s}
.pane:hover .pbtn.ghost,.pane.focus .pbtn.ghost{opacity:1}
.avs{display:flex;align-items:center}
.av{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:9px;font-weight:650;letter-spacing:.02em;border:2px solid var(--sheet);margin-left:-5px;flex:none}
.avs .av:first-child{margin-left:0}
.av.ak{background:#f4e1dc;color:#9a4b3c}.av.ml{background:#dcefe3;color:#2e6b48}.av.sr{background:#efdfea;color:#8a3f6f}.av.am{background:#dfe5f6;color:#3a4f93}.av.dp{background:#f5ead4;color:#8a6420}.av.tc{background:#e6e6ea;color:#555}
[data-theme=dark] .av{filter:saturate(.8) brightness(.85)}
.addp{width:22px;height:22px;border-radius:11px;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--t3);margin-left:4px}
.addp:hover{color:var(--accent);border-color:var(--accent)}
.pb{flex:1;overflow:auto;min-height:0;position:relative}
.pf{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:12px;color:var(--t3);border-top:1px solid var(--line)}
.pf span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pf .sp{flex:1}
.pf .agent{white-space:nowrap;height:28px;padding:0 6px 0 10px;border-radius:8px;background:var(--sheet-2);color:var(--t1);display:inline-flex;align-items:center;gap:8px;font-weight:550}
.multi .pane:not(.focus) .pf{visibility:hidden}
@container (max-width:680px){ .pf .opt{display:none} }

/* reading column re-centres when overlay floats over it */
.col{max-width:700px;margin:0 auto;padding:18px 28px 24px;transition:transform .26s cubic-bezier(.3,1.1,.4,1)}
.pane.nudge .col{transform:translateX(calc(var(--nudge) * -1px))}

/* chat */
.msg{display:flex;gap:12px;margin:0 0 18px}
.msg .who{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:650}
.k{background:#1b1c22;color:#fff;font-weight:700;font-size:13px!important}
[data-theme=dark] .k{background:#e8e9f3;color:#111}
.msg .meta{font-size:12.5px;color:var(--t3);margin-bottom:2px}.msg .meta b{color:var(--t1);font-weight:600;margin-right:4px}
.run{font-size:12.5px;color:var(--t3);margin:2px 0 6px;display:flex;align-items:center;gap:4px}
.msg p{margin:0 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:10px;box-shadow:0 0 0 1px var(--line-2);background:var(--sheet);text-align:left;position:relative}
.chip:hover{background:var(--sheet-2)}
.chip .ic{width:28px;height:28px;border-radius:7px;background:var(--sheet-2);display:grid;place-items:center;color:var(--t2)}
.chip b{display:block;font-weight:550;font-size:13px}.chip small{color:var(--t3);font-size:11.5px}
.chip .hint{font-size:11px;color:var(--t4);margin-left:6px}
.approve{border-radius:12px;background:var(--amber-soft);box-shadow:0 0 0 1px rgba(196,130,12,.28);padding:12px 14px;margin-top:8px}
.approve b{font-weight:600}.approve .acts{display:flex;gap:8px;margin-top:10px;align-items:center}
.btn{height:30px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-weight:550;box-shadow:0 0 0 1px var(--line-2);background:var(--sheet);white-space:nowrap;position:relative}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.pri .kbd{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
.btn:hover{filter:brightness(.97)}
.composer{margin:0 auto 12px;max-width:700px;width:calc(100% - 40px);border-radius:12px;box-shadow:0 0 0 1px var(--line-2),0 2px 8px rgba(22,24,44,.04);padding:10px 12px;background:var(--sheet);transition:transform .26s cubic-bezier(.3,1.1,.4,1)}
.pane.nudge .composer{transform:translateX(calc(var(--nudge) * -1px))}
.composer .ph2{color:var(--t4);height:22px}
.composer .bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);margin-top:6px}
.composer .bar .sp{flex:1}
.send{width:26px;height:26px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center}
.chatwrap{display:flex;flex-direction:column;height:100%}
.chatwrap .msgs{flex:1;overflow:auto}

/* tasks */
.scope{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 9px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:550;white-space:nowrap}
.scope button{opacity:.7}
.board{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:10px;padding:14px 16px;align-items:start;transition:padding .26s}
.pane.cover .board,.pane.cover .tlist{padding-right:calc(var(--ov-w) + 24px)}
.colm{background:var(--sheet-2);border-radius:10px;padding:8px}
.colm h4{margin:2px 4px 8px;font-size:12.5px;font-weight:600}.colm h4 span{color:var(--t3);font-weight:500;margin-left:4px}
.card{background:var(--sheet);border-radius:8px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(22,24,44,.04);padding:9px 10px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left;display:block}
.card:hover{box-shadow:0 0 0 1px var(--line-2),0 2px 6px rgba(22,24,44,.06)}
.card.sel{box-shadow:0 0 0 1.5px var(--accent)}
.card.new{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--sheet)}}
.card .t{font-weight:550;font-size:13px}.card .m{white-space:nowrap;display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--t3)}
.card .m .sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;background:var(--sheet-2);color:var(--t2);font-size:11.5px;font-weight:550}
.tag i{width:6px;height:6px;border-radius:3px;background:var(--accent)}
.tag.sup i{background:var(--amber)}.tag.sal i{background:var(--green)}
.done .t{text-decoration:line-through;color:var(--t3)}
.tlist{display:none;padding:6px 12px 14px}
.tlist h4{font-size:12px;font-weight:600;color:var(--t3);margin:12px 8px 4px}
.tlist .card{box-shadow:none;border-radius:8px;margin:0;display:flex;align-items:center;gap:10px;padding:8px}
.tlist .card:hover{background:var(--hover)}
.tlist .card .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlist .card.sel{background:var(--accent-soft);box-shadow:none}
.cb{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line-2);flex:none}
.done .cb{background:var(--accent);border-color:var(--accent)}
@container (max-width:819px){ .board{display:none} .tlist{display:block} }
.kmark{font-size:10px;font-weight:700;width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;box-shadow:0 0 0 1px var(--line-2);color:var(--t2)}

/* page */
.page h1{font-size:30px;letter-spacing:-.02em;margin:18px 0 6px}
.page .pm{font-size:12.5px;color:var(--t3);margin-bottom:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page h3{font-size:16px;margin:20px 0 8px}
.page .ck{display:flex;align-items:center;gap:10px;padding:5px 0}
.callout{background:var(--sheet-2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;color:var(--t2)}

/* crm */
.deal{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.deal:hover{background:var(--hover)}
.deal b{font-weight:550;flex:1}.deal .v{font-variant-numeric:tabular-nums;font-weight:600}

/* bot */
.sched{border-radius:12px;box-shadow:0 0 0 1px var(--line-2);padding:12px 14px;margin-top:8px;background:var(--sheet)}
.sched .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:550}
.sched .tok{height:24px;padding:0 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);display:inline-flex;align-items:center;font-weight:600}
.sched dl{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin:10px 0;font-size:12.5px}
.sched dt{color:var(--t3)}.sched dd{margin:0}
.status{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;background:var(--sheet-2);color:var(--t2);font-size:12px;font-weight:550;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:3px;background:var(--green)}

/* drop zones */
#drop{position:absolute;pointer-events:none;border-radius:11px;background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 0 0 0 2px var(--accent);display:none;z-index:30;place-items:center;transition:left .12s,width .12s}
#drop span{background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;padding:5px 10px;border-radius:8px;box-shadow:var(--sh-pop)}

/* overlay */
#ov{position:absolute;z-index:20;top:50px;right:16px;bottom:16px;width:var(--ov-w);background:var(--sheet);border-radius:13px;box-shadow:var(--sh-pop);display:flex;flex-direction:column;overflow:hidden;transform:translateX(16px) scale(.985);opacity:0;pointer-events:none;transition:transform .24s cubic-bezier(.3,1.3,.4,1),opacity .16s}
#ov.open{transform:none;opacity:1;pointer-events:auto}
body.pinned #ov{top:0;right:8px;bottom:8px;box-shadow:var(--sh-sheet);border-radius:11px}
.oh{display:flex;align-items:center;gap:4px;padding:8px 8px 0 10px}
.tabs{display:flex;gap:2px;background:var(--sheet-2);border-radius:9px;padding:2px;flex:1}
.tab{flex:1;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:550;color:var(--t3);font-size:12.5px;white-space:nowrap;position:relative}
.tab.on{background:var(--sheet);color:var(--t1);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(22,24,44,.06)}
.tab .kbd{height:16px;font-size:10px;min-width:16px;padding:0 3px}
.pbtn.on{color:var(--accent);background:var(--accent-soft)}
.pbtn[disabled]{opacity:.35;cursor:not-allowed}
.octx{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden}
.octx b{color:var(--t1);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ob{flex:1;overflow:auto;padding:4px 14px 14px;transition:opacity .12s}
.sec{border-bottom:1px solid var(--line);padding:10px 0}
.sec:last-child{border-bottom:0}
.sec h5{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--t3);display:flex;justify-content:space-between;align-items:center}
.sec h5 button{color:var(--accent);font-weight:550;font-size:12px}

.obeside{margin-left:auto;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:550;color:var(--accent);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}

.sug b{font-weight:550;display:block}.sug small{color:var(--t3)}
.ans{background:var(--sheet-2);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.sample{font-size:10.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber-soft);padding:2px 6px;border-radius:5px;margin-right:6px}
.ocomp{margin:0 10px 10px;border-radius:11px;box-shadow:0 0 0 1px var(--line-2);padding:9px 10px}
.ocomp .ph2{color:var(--t4);height:20px}
.ocomp .bar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t3);margin-top:6px}
.tone{display:flex;gap:6px;flex-wrap:wrap}.tone button{height:26px;padding:0 10px;border-radius:13px;box-shadow:0 0 0 1px var(--line-2);font-size:12px}.tone button.on{background:var(--t1);color:var(--sheet);box-shadow:none}
.ta{width:100%;min-height:74px;border-radius:9px;border:1px solid var(--line-2);background:var(--sheet);padding:8px 10px;resize:none;font-size:12.5px;line-height:1.45}
.tg{width:30px;height:18px;border-radius:9px;background:var(--line-2);position:relative;flex:none;margin-left:auto}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tg.on{background:var(--accent)}.tg.on::after{left:14px}

/* peek, command bar, sheet */
#dim{position:fixed;inset:0;background:var(--scrim);z-index:55;display:none}body.dim #dim{display:block}
#scrim{position:absolute;inset:0;background:var(--scrim);z-index:50;display:none}
#scrim.on{display:block}
#peek{position:absolute;z-index:51;left:50%;top:5%;width:min(820px,80%);height:88%;transform:translateX(-50%);background:var(--sheet);border-radius:14px;box-shadow:var(--sh-pop);display:none;flex-direction:column;overflow:hidden;container-type:inline-size}
#peek.on{display:flex}
#cmd,#sheet{position:fixed;z-index:60;left:50%;top:18%;width:620px;max-width:calc(100% - 24px);transform:translateX(-50%);background:var(--sheet);border-radius:14px;box-shadow:var(--sh-pop);display:none;overflow:hidden}
#cmd.on,#sheet.on{display:block}

#sheet{width:720px;top:12%}
.sh-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:6px 16px 16px;max-height:470px;overflow:auto}
.sh-cols .ci{height:32px;padding:0 8px}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1f2027;color:#f4f4f7;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:90;pointer-events:none;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-pop)}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast .kbd{background:rgba(255,255,255,.12);border-color:transparent;color:#ddd}

/* hold ⌘ → key badges */
body.showkeys [data-k]::after{content:attr(data-k);position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:95;background:#1b1c22;color:#fff;font:600 10.5px/1 var(--font);padding:3px 5px;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none}

body.fm .pf,body.fm #ov{display:none}

#switcher{display:none}
@media (max-width:760px){

  #edge{display:none!important}

}

<script>
/* ---------- icons ---------- */
const I = {
  chat:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2H7l-3 2.5v-2.5h0a1.5 1.5 0 0 1-1.5-1.5z"/></svg>',

  swap:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 5.5h10l-2.5-2.5M13.5 10.5h-10l2.5 2.5"/></svg>',

  beside:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M8 2.8v10.4M10.5 8h2M11.5 7v2"/></svg>',
  sun:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>',
  moon:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg>',
  plus:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>',
  zoom:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/></svg>',
};

/* ---------- data (fictional) ---------- */
const R = {
  'upnext':{type:'upnext',title:'Up next',c1:'',icon:'up'},
  'chat/atlas':{type:'chat',title:'Atlas v2 launch plan',c1:'Atlas launch',icon:'chat',project:'atlas'},

  'tasks/all':{type:'tasks',title:'Tasks',c1:'',icon:'tasks'},
  'tasks/atlas':{type:'tasks',title:'Tasks',c1:'',icon:'tasks',scope:'Atlas launch'},
  'crm/pipeline':{type:'crm',title:'Pipeline',c1:'CRM',icon:'crm'},
  'bot/metrics':{type:'bot',title:'Metrics bot',c1:'Bots',icon:'bot'},
};
let TASKS = [
  {id:1,t:'Update pricing page for Atlas v2',s:'In progress',p:'atlas',tag:'Atlas',due:'Today',who:'am'},
  {id:2,t:'Write launch announcement email',s:'In progress',p:'atlas',tag:'Atlas',due:'Nov 12',who:'sr'},
  {id:3,t:'Draft FAQ for the new sharing model',s:'Review',p:'atlas',tag:'Support',due:'Nov 10',who:'k',cls:'sup'},
  {id:4,t:'Embargo list for press',s:'Review',p:'atlas',tag:'Atlas',due:'Nov 11',who:'ak'},
  {id:5,t:'Record 30s product teaser',s:'To do',p:'atlas',tag:'Atlas',due:'Nov 13',who:'sr'},
  {id:6,t:'QA invite flow on mobile',s:'To do',p:'atlas',tag:'Atlas',due:'Nov 14',who:'dp'},
  {id:7,t:'Send data room to Juniper Ventures',s:'To do',p:'fund',tag:'Fundraising',due:'Nov 7',who:'ak',cls:'sal'},
  {id:8,t:'Set up Atlas launch teamspace',s:'Done',p:'atlas',tag:'Atlas',due:'Oct 30',who:'am'},
];
const STAGES=['To do','In progress','Review','Done'];
const FAVS=['upnext','chat/atlas','tasks/all','crm/pipeline'];

/* ---------- state ---------- */
const S = {panes:['chat/atlas'],f:0,o:null,pin:false,sb:true,sbAuto:false,fm:false,zoom:-1,sel:null,askOff:{},ans:null,peek:null,botSaved:false,botTone:'Brief',theme:'light'};
const narrow = () => innerWidth <= 760;
const cur = () => S.panes[S.f];
const meta = r => R[r];

/* ---------- keymap: single source for hints, ⌘/ sheet, handlers ---------- */
const KEYS = [
  {k:'mod+k',g:'Overlay & bar',l:'Command bar',run:()=>openCmd('here')},
  {k:'mod+\\',g:'Panes',l:'Open beside…',run:()=>openCmd('beside')},
  {k:'mod+i',g:'Overlay & bar',l:'In this … (overlay)',run:()=>toggleOv('info')},
  {k:'mod+j',g:'Overlay & bar',l:'Ask kumiya',run:()=>toggleOv('ask')},
  {k:'mod+.',g:'Overlay & bar',l:'Pin / unpin overlay',run:()=>togglePin()},
  {k:'mod+s',g:'App',l:'Show / hide sidebar',run:()=>toggleSb()},
  {k:'mod+shift+s',g:'App',l:'Focus mode (hide everything)',run:()=>toggleFm()},
  {k:'mod+shift+l',g:'App',l:'Theme light / dark',run:()=>toggleTheme()},
  {k:'mod+/',g:'App',l:'Keyboard shortcuts',run:()=>toggleSheet()},
  {k:'mod+alt+arrowleft',g:'Panes',l:'Focus pane on the left',run:()=>focusPane(S.f-1)},
  {k:'mod+alt+arrowright',g:'Panes',l:'Focus pane on the right',run:()=>focusPane(S.f+1)},
  {k:'ctrl+mod+arrowleft',g:'Panes',l:'Move pane left (swap)',run:()=>movePane(S.f,-1)},
  {k:'ctrl+mod+arrowright',g:'Panes',l:'Move pane right (swap)',run:()=>movePane(S.f,1)},
  {k:'mod+shift+enter',g:'Panes',l:'Zoom focused pane',run:()=>toggleZoom()},
  {k:'alt+w',g:'Panes',l:'Close focused pane (⌘W in the app)',run:()=>closePane(S.f)},
];
const VIEWKEYS = {
  chat:[['⇧-click','Open a sidebar item beside'],['Drag','Sidebar item → edge of content'],['Click chip','Peek · then ⇧↵ beside']],
  tasks:[['Click','Select task → shows in overlay'],['Drag header','Onto other pane → swap']],
  page:[['⌘J','Ask about this page']],crm:[['Click','Select deal']],bot:[['⌘I','Edit bot in overlay']],upnext:[['⇧-click','Open beside']],
};
function fk(k){const o=['ctrl','alt','shift','mod'];return k.split('+').sort((a,b)=>(o.indexOf(a)+1||9)-(o.indexOf(b)+1||9)).map(p=>({mod:'⌘',shift:'⇧',alt:'⌥',ctrl:'⌃',enter:'↵',arrowleft:'←',arrowright:'→',escape:'Esc'}[p]||p.toUpperCase())).join('')}
function match(e,k){
  const p=k.split('+'), key=p[p.length-1];
  const wantCtrl=p.includes('ctrl'), wantMod=p.includes('mod');
  const mod=e.metaKey||e.ctrlKey;
  if(wantMod&&!mod) return false; if(!wantMod&&!wantCtrl&&(e.metaKey||e.ctrlKey)) return false;
  if(wantCtrl&&!(e.ctrlKey&&e.metaKey)&&wantMod) return false;
  if(!!p.includes('shift')!==e.shiftKey) return false;
  if(!!p.includes('alt')!==e.altKey) return false;
  const ek=(e.key||'').toLowerCase(), code=e.code||'';
  if(key==='.') return ek==='.'||code==='Period';
  if(key==='/') return ek==='/'||ek==='?'||code==='Slash';
  if(key==='\\') return ek==='\\'||code==='Backslash';
  if(key.length===1) return code==='Key'+key.toUpperCase()||ek===key;
  return ek===key;
}

/* ---------- hash: #/chat/atlas+tasks/atlas?f=2&o=info&pin=1&sb=0&fm=1 ---------- */
let writing=false;
function toHash(){
  const q=[];
  if(S.panes.length>1&&S.f>0) q.push('f='+(S.f+1));
  if(S.o) q.push('o='+S.o);
  if(S.pin&&S.o) q.push('pin=1');
  if(!S.sb&&!S.sbAuto) q.push('sb=0');
  if(S.fm) q.push('fm=1');
  return '#/'+S.panes.join('+')+(q.length?'?'+q.join('&'):'');
}
function fromHash(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(!h) return false;
  const [path,qs='']=h.split('?');
  const panes=path.split('+').filter(r=>R[r]);
  if(!panes.length) return false;
  const q=Object.fromEntries(qs.split('&').filter(Boolean).map(x=>x.split('=')));
  S.panes=panes.slice(0,3); S.f=Math.min((+q.f||1)-1,S.panes.length-1);
  S.o=q.o==='info'||q.o==='ask'?q.o:null; S.pin=q.pin==='1'; S.fm=q.fm==='1';
  S.sbAuto=false; S.sb=q.sb!=='0'&&!narrow();
  if(S.panes.length===3&&S.sb&&!narrow()){S.sb=false;S.sbAuto=true}
  S.zoom=-1; S.sel=null; S.ans=null; S.peek=null;
  return true;
}
addEventListener('hashchange',()=>{if(writing){writing=false;return} closeCmd();$('#sheet').classList.remove('on');syncDim();fromHash();render()});

/* ---------- actions ---------- */
function maxPanes(){ if(narrow()) return 3; const w=document.getElementById('body').clientWidth; return w>=1100?3:w>=760?2:1 }
function scoped(route,base){ // an app opened beside a chat is scoped to that chat's project
  const b=R[base]; if(route==='tasks/all'&&b&&b.project==='atlas') return 'tasks/atlas'; return route;
}
function openBeside(route){
  route=scoped(route,cur());
  const i=S.panes.indexOf(route); if(i>=0){focusPane(i);toast('Already open — focused');return}
  if(S.panes.length>=maxPanes()){toast('Max '+maxPanes()+' panes here — opened in place');return navigate(route)}
  insertPane(route,S.f+1);
}
function insertPane(route,at){
  route=scoped(route,S.panes[Math.max(0,at-1)]);
  if(S.panes.includes(route)){focusPane(S.panes.indexOf(route));return}
  if(S.panes.length>=maxPanes()){toast('Max '+maxPanes()+' panes');return}
  S.panes.splice(at,0,route); S.f=at; S.zoom=-1;
  if(S.panes.length===3&&S.sb&&!narrow()){S.sb=false;S.sbAuto=true;toast('Sidebar hidden to make room','⌘S')}
  if(S.pin&&!pinOk()){S.pin=false;toast('Overlay unpinned — not enough room')}
  render();
}
function navigate(route){
  const i=S.panes.indexOf(route); if(i>=0){focusPane(i);return}
  if(S.panes.length>1) route=scoped(route,S.panes[S.f===0?1:0]);
  S.panes[S.f]=route; S.sel=null; S.ans=null; render();
}
function closePane(i){
  if(S.panes.length<2){toast('Last pane — nothing to close');return}
  S.panes.splice(i,1); S.f=Math.min(S.f>i?S.f-1:S.f,S.panes.length-1); S.zoom=-1;
  if(S.panes.length<3&&S.sbAuto){S.sb=true;S.sbAuto=false}
  render();
}
function swapPanes(a,b){ if(b<0||b>=S.panes.length||a===b) return; [S.panes[a],S.panes[b]]=[S.panes[b],S.panes[a]]; if(S.f===a)S.f=b; else if(S.f===b)S.f=a; render() }
function movePane(i,d){ swapPanes(i,i+d) }
function focusPane(i){ if(i<0||i>=S.panes.length) return; if(S.f!==i){S.f=i;S.sel=null;S.ans=null} render() }
function toggleOv(t){ if(S.fm) return; if(S.o===t){S.o=null}else{S.o=t} render(); if(S.o==='ask'){/* focus composer (demo: visual only) */} }
function pinOk(){ if(narrow()) return false; const w=document.getElementById('content').clientWidth-8; const n=S.zoom>=0?1:S.panes.length; return (w-(344+8)-(n-1)*8)/n>=360 }
function togglePin(){ if(!S.o) S.o='info'; if(!S.pin&&!pinOk()){toast('Close a pane to pin');render();return} S.pin=!S.pin; render() }
function toggleSb(){ S.sb=!S.sb; S.sbAuto=false; document.body.classList.remove('sb-peek'); render() }
function toggleFm(){ S.fm=!S.fm; render(); if(S.fm) toast('Focus','⌘⇧S to exit') }
function toggleTheme(){ S.theme=S.theme==='light'?'dark':'light'; render() }
function toggleZoom(){ S.zoom=S.zoom>=0?-1:S.f; render() }

const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  document.documentElement.dataset.theme=S.theme;
  const b=document.body;
  b.classList.toggle('sb-off',!S.sb); b.classList.toggle('fm',S.fm);
  b.classList.toggle('pinned',!!(S.o&&S.pin&&!S.fm&&!narrow()));
  renderPills(); renderSidebar(); renderPanes(); renderOverlay(); renderPeek();
  $('#b-theme').innerHTML=S.theme==='light'?I.moon:I.sun;
  const m=meta(cur());
  $('#where').textContent=S.panes.length>1?S.panes.length+' panes · focus: '+m.title:'';
  $('#b-info-l').textContent=ovLabel(m.type);
  $('#b-info').classList.toggle('on',S.o==='info'); $('#b-ask').classList.toggle('on',S.o==='ask');
  const h=toHash(); $('#hash').textContent=h;
  if(location.hash!==h){writing=true;history.replaceState(null,'',h);writing=false}
  requestAnimationFrame(layoutNudge);
}

/* reading column re-centres beside a floating overlay; boards get scroll padding */
function layoutNudge(){
  document.querySelectorAll('.pane').forEach(p=>{p.classList.remove('nudge','cover');p.style.removeProperty('--nudge')});
  if(!S.o||S.pin||S.fm||narrow()) return;
  const ov=$('#ov').getBoundingClientRect();
  document.querySelectorAll('.pane').forEach(p=>{
    const r=p.getBoundingClientRect(); if(r.right<=ov.left||r.width===0) return;
    const col=p.querySelector('.col');
    if(p.querySelector('.board')||!col){p.classList.add('cover');return}
    const free=ov.left-r.left-16, cw=Math.min(700,r.width);
    const colRight=r.left+(r.width+cw)/2;
    if(colRight<=ov.left-8) return;
    if(free>=560){p.classList.add('nudge');p.style.setProperty('--nudge',Math.max(0,Math.round(colRight-(r.left+free)+8)));}
  });
}

      bottest:()=>{S.botTest=1;render()}})[a]?.();
    return;
  }
  if(d.beside!==undefined&&d.beside){e.stopPropagation();return openBeside(d.beside)}
  if(d.peek&&!e.shiftKey){e.stopPropagation();S.peek=d.peek;return render()}
  if(d.route){e.stopPropagation();if(e.shiftKey||e.target.closest('.beside')) openBeside(d.route); else navigate(d.route);document.body.classList.remove('sb-peek');return}
  if(d.task){e.stopPropagation();const pi=+el.closest('.pane')?.dataset.pane;if(!isNaN(pi))S.f=pi;S.sel=+d.task;if(!S.o)S.o='info';return render()}

/* drag: sidebar rows / chips → edges (insert) or pane middle (open here); pane header → other pane (swap) */
let DRAG=null;
document.addEventListener('dragstart',e=>{
  const p=e.target.closest('[data-drag-pane]'); const r=e.target.closest('[data-route]');
  if(p) DRAG={pane:+p.dataset.dragPane}; else if(r) DRAG={route:r.dataset.route}; else return;
  e.dataTransfer.setData('text/plain','kumiya'); e.dataTransfer.effectAllowed='move';
  if(r&&!S.sb) setTimeout(()=>document.body.classList.remove('sb-peek'),50);
});
document.addEventListener('dragend',()=>{DRAG=null;$('#drop').style.display='none'});
function dropTarget(x){
  const panes=[...document.querySelectorAll('.pane')].filter(p=>p.offsetWidth); const c=$('#content').getBoundingClientRect();
  const rs=panes.map(p=>p.getBoundingClientRect()); const n=rs.length; const Z=70;
  if(DRAG.pane!=null){const j=rs.findIndex(r=>x>=r.left&&x<=r.right); if(j<0||j===DRAG.pane) return null; return {kind:'swap',j,rect:rs[j]}}
  if(n<maxPanes()){
    const bs=[rs[0].left,...rs.slice(0,-1).map((r,i)=>(r.right+rs[i+1].left)/2),rs[n-1].right];
    for(let i=0;i<bs.length;i++) if(Math.abs(x-bs[i])<Z){
      const w=Math.min(260,(rs[0].width)*.42); const left=i===0?rs[0].left:i===n?rs[n-1].right-w:bs[i]-w/2;
      return {kind:'insert',i,rect:{left,top:rs[0].top,width:w,height:rs[0].height}};
    }
  }
  const j=rs.findIndex(r=>x>=r.left&&x<=r.right); if(j<0) return null;
  return {kind:'here',j,rect:rs[j]};
}
$('#content').addEventListener('dragover',e=>{
  if(!DRAG) return; e.preventDefault();
  const t=dropTarget(e.clientX), d=$('#drop'); if(!t){d.style.display='none';return}
  const c=$('#content').getBoundingClientRect();
  Object.assign(d.style,{display:'grid',left:(t.rect.left-c.left)+'px',top:(t.rect.top-c.top)+'px',width:t.rect.width+'px',height:t.rect.height+'px'});
  d.firstElementChild.textContent=t.kind==='insert'?'Open beside':t.kind==='swap'?'Swap panes':'Open here';
});
$('#content').addEventListener('drop',e=>{
  if(!DRAG) return; e.preventDefault(); const t=dropTarget(e.clientX); $('#drop').style.display='none';
  const D=DRAG; DRAG=null; if(!t) return;
  if(t.kind==='swap') return swapPanes(D.pane,t.j);
  if(t.kind==='insert') return insertPane(D.route,t.i);
  S.f=t.j; navigate(D.route);
});

/* keyboard */
let holdT;
document.addEventListener('keydown',e=>{
  if(e.key==='Meta'||e.key==='Control'){clearTimeout(holdT);holdT=setTimeout(()=>document.body.classList.add('showkeys'),500);return}
  clearTimeout(holdT); document.body.classList.remove('showkeys');
  const cmdOn=$('#cmd').classList.contains('on'), shOn=$('#sheet').classList.contains('on');
  if(cmdOn){
    const n=cmdItems().length;
    if(e.key==='Escape'){closeCmd();return}
    if(e.key==='ArrowDown'){e.preventDefault();CMD.i=(CMD.i+1)%n;renderCmd();return}
    if(e.key==='ArrowUp'){e.preventDefault();CMD.i=(CMD.i-1+n)%n;renderCmd();return}
    if(e.key==='Enter'){e.preventDefault();if(e.altKey){const q=CMD.q||cmdItems()[CMD.i]?.label;closeCmd();S.o='ask';S.ans='Pre-scripted sample answer about “'+esc(q)+'”.';render();return} runCmd(CMD.i,e.shiftKey);return}
  }
  if(shOn&&e.key==='Escape'){$('#sheet').classList.remove('on');syncDim();return}
  if(S.peek){ if(e.key==='Escape'){S.peek=null;render();return} if(e.key==='Enter'){e.preventDefault();const r=S.peek;S.peek=null;e.shiftKey?openBeside(r):navigate(r);return} }
  for(const k of KEYS){ if(match(e,k.k)){e.preventDefault(); if(cmdOn)closeCmd(); if(shOn&&k.k!=='mod+/'){$('#sheet').classList.remove('on');syncDim()} k.run(); return} }
  if(e.key==='Escape'&&!e.target.closest('input,textarea')){
    if(S.o&&!S.pin){S.o=null;render()} else if(S.fm){toggleFm()} else if(S.zoom>=0){toggleZoom()}
  }
});
document.addEventListener('keyup',e=>{if(e.key==='Meta'||e.key==='Control'){clearTimeout(holdT);document.body.classList.remove('showkeys')}});
addEventListener('blur',()=>document.body.classList.remove('showkeys'));
addEventListener('resize',()=>{if(narrow()&&S.sb&&!S.sbAuto){S.sb=false} render()});

/* boot */
if(narrow()) S.sb=false;
if(!fromHash()) {S.panes=['chat/atlas','tasks/atlas'];S.f=0;S.o='info'}
render();
</script>
